<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="390" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">SAO: single-rollout asynchronous optimization</text>

  <!-- Synchronous GRPO -->
  <rect x="24" y="48" width="350" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="199" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">Synchronous GRPO — group barrier</text>
  <g font-size="10.5" fill="#64748b">
    <text x="40" y="96">rollout 1</text><text x="40" y="122">rollout 2</text><text x="40" y="148">rollout 3</text>
  </g>
  <g fill="#fca5a5">
    <rect x="96" y="86" width="86" height="14" rx="4"/>
    <rect x="96" y="112" width="170" height="14" rx="4"/>
    <rect x="96" y="138" width="70" height="14" rx="4"/>
  </g>
  <g fill="#fee2e2">
    <rect x="182" y="86" width="84" height="14" rx="4"/>
    <rect x="166" y="138" width="100" height="14" rx="4"/>
  </g>
  <text x="224" y="97" font-size="9.5" fill="#dc2626" text-anchor="middle">idle</text>
  <text x="216" y="149" font-size="9.5" fill="#dc2626" text-anchor="middle">idle</text>
  <line x1="266" y1="80" x2="266" y2="160" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="320" y="120" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle">policy</text>
  <text x="320" y="134" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle">update</text>
  <text x="199" y="182" text-anchor="middle" font-size="11" fill="#64748b">wait for the slowest trajectory · needs a group per prompt</text>

  <!-- Async SAO -->
  <rect x="406" y="48" width="350" height="150" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="581" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">Asynchronous SAO — immediate pipeline</text>
  <g font-size="10.5" fill="#64748b">
    <text x="422" y="96">prompt 1</text><text x="422" y="122">prompt 2</text><text x="422" y="148">prompt 3</text>
  </g>
  <g fill="#6ee7b7">
    <rect x="480" y="86" width="86" height="14" rx="4"/>
    <rect x="480" y="112" width="182" height="14" rx="4"/>
    <rect x="480" y="138" width="70" height="14" rx="4"/>
  </g>
  <g fill="#059669" font-size="9" text-anchor="middle">
    <rect x="568" y="86" width="30" height="14" rx="4"/><text x="583" y="97" fill="#ffffff">upd</text>
    <rect x="664" y="112" width="30" height="14" rx="4"/><text x="679" y="123" fill="#ffffff">upd</text>
    <rect x="552" y="138" width="30" height="14" rx="4"/><text x="567" y="149" fill="#ffffff">upd</text>
  </g>
  <text x="581" y="182" text-anchor="middle" font-size="11" fill="#64748b">one rollout per prompt · learner never blocks · policy lag θ ≠ θ_rollout</text>

  <!-- Three stabilizers -->
  <text x="24" y="228" font-size="12.5" font-weight="700" fill="#334155">Three mechanisms that make single-rollout async stable</text>

  <rect x="24" y="240" width="236" height="132" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="142" y="262" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">DIS — double-sided masking</text>
  <text x="142" y="280" text-anchor="middle" font-size="10.5" fill="#475569">r_t = π_θ / π_rollout (logged logprobs)</text>
  <line x1="48" y1="330" x2="236" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="112" y="296" width="60" height="34" fill="#dbeafe"/>
  <line x1="112" y1="292" x2="112" y2="336" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="172" y1="292" x2="172" y2="336" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="142" y="318" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1d4ed8">keep</text>
  <text x="76" y="318" text-anchor="middle" font-size="10.5" fill="#dc2626">drop</text>
  <text x="208" y="318" text-anchor="middle" font-size="10.5" fill="#dc2626">drop</text>
  <g font-size="9.5" fill="#64748b" text-anchor="middle">
    <text x="112" y="347">1−ε_ℓ</text><text x="172" y="347">1+ε_h</text>
  </g>
  <text x="142" y="365" text-anchor="middle" font-size="10.5" fill="#059669">1,000+ steps stable vs. 160 for async GRPO</text>

  <rect x="272" y="240" width="236" height="132" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="390" y="262" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c3aed">Two-time-scale critic</text>
  <g font-size="11" fill="#334155" text-anchor="middle">
    <rect x="292" y="276" width="90" height="38" rx="7" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="337" y="293">policy π_θ</text><text x="337" y="307" font-size="10" fill="#64748b">1 update</text>
    <rect x="398" y="276" width="90" height="38" rx="7" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="443" y="293">value V_φ</text><text x="443" y="307" font-size="10" fill="#64748b">K = 2 updates</text>
  </g>
  <line x1="382" y1="295" x2="394" y2="295" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#sa)"/>
  <text x="390" y="336" text-anchor="middle" font-size="10.5" fill="#475569">frozen attention: ∇_{W_attn} L_VF = 0</text>
  <text x="390" y="354" text-anchor="middle" font-size="10.5" fill="#475569">only MoE projections W_MoE train</text>
  <text x="390" y="368" text-anchor="middle" font-size="10" fill="#64748b">smooths critic gradient norms</text>

  <rect x="520" y="240" width="236" height="132" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="638" y="262" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Skip-observation GAE</text>
  <g>
    <rect x="540" y="282" width="46" height="26" rx="5" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="596" y="282" width="46" height="26" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="652" y="282" width="46" height="26" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  </g>
  <g font-size="10.5" text-anchor="middle">
    <text x="563" y="299" fill="#1d4ed8">a_i</text>
    <text x="619" y="299" fill="#64748b">o_i</text>
    <text x="675" y="299" fill="#1d4ed8">a_i+1</text>
  </g>
  <path d="M563,278 C590,254 648,254 675,278" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#sa2)"/>
  <text x="619" y="330" text-anchor="middle" font-size="10.5" fill="#475569">δ_t = r_t + γV(a_{i+1,0}) − V(a_{i,N})</text>
  <text x="619" y="350" text-anchor="middle" font-size="10.5" fill="#475569">bridge action→action, skip env tokens</text>
  <text x="619" y="366" text-anchor="middle" font-size="10" fill="#64748b">critic never predicts the environment</text>

  <text x="390" y="400" text-anchor="middle" font-size="12" font-weight="600" fill="#059669">slime dataflow + 1e-7 logprob alignment → 2.3x end-to-end RL throughput on long-horizon coding</text>

  <defs>
    <marker id="sa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/></marker>
    <marker id="sa2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker>
  </defs>
</svg>
