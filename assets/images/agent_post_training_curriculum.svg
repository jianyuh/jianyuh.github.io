<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 553" width="940" height="553" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="553" fill="#ffffff"/><text x="20.0" y="34.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">A curriculum for post-training agents: each step removes a dependency of the last</text><text x="20.0" y="56.0" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">and pays for it with a weaker or more expensive signal</text><text x="30.0" y="84.0" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Step</text><text x="230.0" y="84.0" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">The model learns from</text><text x="470.0" y="84.0" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">TRL trainer</text><text x="630.0" y="84.0" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Limitation that motivates the next step</text><rect x="20.0" y="96.0" width="190.0" height="72.5" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/><text x="30.0" y="119.0" font-size="14" font-weight="700" fill="#1e293b" text-anchor="start">1. SFT</text><rect x="220.0" y="96.0" width="230.0" height="72.5" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><text x="230.0" y="118.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">agent traces from a stronger model</text><rect x="460.0" y="96.0" width="150.0" height="72.5" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><text x="470.0" y="118.0" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">SFTTrainer</text><rect x="620.0" y="96.0" width="300.0" height="72.5" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="630.0" y="118.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Sees only correct traces, never its own</text><text x="630.0" y="135.5" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">attempts, so it never learns to recover from its</text><text x="630.0" y="153.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">own mistakes.</text><line x1="115.0" y1="170.5" x2="115.0" y2="184.5" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="20.0" y="186.5" width="190.0" height="72.5" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="30.0" y="209.5" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="start">2. Distillation</text><rect x="220.0" y="186.5" width="230.0" height="72.5" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/><text x="230.0" y="208.5" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">a teacher's tokens or probabilities</text><text x="230.0" y="226.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">on the student's own tokens</text><rect x="460.0" y="186.5" width="150.0" height="72.5" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/><text x="470.0" y="208.5" font-size="12.5" font-weight="400" fill="#4c1d95" text-anchor="start">DistillationTrainer</text><rect x="620.0" y="186.5" width="300.0" height="72.5" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/><text x="630.0" y="208.5" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Dense per-token signal, but the student is</text><text x="630.0" y="226.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">capped by the teacher, and on-policy runs need</text><text x="630.0" y="243.5" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">the teacher every step.</text><line x1="115.0" y1="261.0" x2="115.0" y2="275.0" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="20.0" y="277.0" width="190.0" height="72.5" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="30.0" y="300.0" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start">3. RL</text><rect x="220.0" y="277.0" width="230.0" height="72.5" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="230.0" y="299.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">a score for each answer (a reward</text><text x="230.0" y="316.5" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">function)</text><rect x="460.0" y="277.0" width="150.0" height="72.5" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="470.0" y="299.0" font-size="12.5" font-weight="400" fill="#1e3a8a" text-anchor="start">GRPOTrainer</text><rect x="620.0" y="277.0" width="300.0" height="72.5" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/><text x="630.0" y="299.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Needs only a check, but one number per</text><text x="630.0" y="316.5" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">answer, so many attempts; each answer is a</text><text x="630.0" y="334.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">single scored turn.</text><line x1="115.0" y1="351.5" x2="115.0" y2="365.5" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="20.0" y="367.5" width="190.0" height="55.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="30.0" y="390.5" font-size="14" font-weight="700" fill="#14532d" text-anchor="start">4. RL environments</text><rect x="220.0" y="367.5" width="230.0" height="55.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="230.0" y="389.5" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">the outcome of acting over many</text><text x="230.0" y="407.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">turns in a stateful environment</text><rect x="460.0" y="367.5" width="150.0" height="55.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="470.0" y="389.5" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="start">GRPOTrainer</text><rect x="620.0" y="367.5" width="300.0" height="55.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/><text x="630.0" y="389.5" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Episodes are long, so generating rollouts</text><text x="630.0" y="407.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">becomes the slowest part of training.</text><line x1="115.0" y1="424.5" x2="115.0" y2="438.5" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="20.0" y="440.5" width="190.0" height="72.5" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="30.0" y="463.5" font-size="14" font-weight="700" fill="#78350f" text-anchor="start">5. Harnesses and scale</text><rect x="220.0" y="440.5" width="230.0" height="72.5" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="230.0" y="462.5" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">full runs of a real agent harness in a</text><text x="230.0" y="480.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">remote sandbox</text><rect x="460.0" y="440.5" width="150.0" height="72.5" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/><text x="470.0" y="462.5" font-size="12.5" font-weight="400" fill="#78350f" text-anchor="start">AsyncGRPOTrainer</text><rect x="620.0" y="440.5" width="300.0" height="72.5" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1"/><text x="630.0" y="462.5" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Generation and training on separate GPUs,</text><text x="630.0" y="480.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">weights pushed back to vLLM; the model trains</text><text x="630.0" y="497.5" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">where it will run.</text><text x="20.0" y="539.0" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">Frontier pipelines chain the steps: SFT, then RL experts per domain, then on-policy distillation to merge them, then agentic RL in environments.</text></svg>