.</text><rect x="24.0" y="48.0" width="440.0" height="444.9" rx="10" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3"/><rect x="486.0" y="48.0" width="430.0" height="444.9" rx="10" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 3"/></svg>