<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 914" width="940" height="914" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="940" height="914" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="17.5" fill="#0f172a" font-weight="700">Never Give Up: fixed K is a compute allocation nobody chose</text>
  <text x="470" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">Retry hard prompts geometrically, filter easy ones after four samples, and let async RL spend the difference</text>
  <rect x="22" y="68" width="896" height="178" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="38" y="89" font-size="12.5" fill="#b91c1c" font-weight="700">THE MATTHEW EFFECT: RL GAINS TRACK INITIAL COMPETENCE</text>
  <text x="52" y="125" font-size="10.4" fill="#475569">easy   (high pass@1)</text>
  <rect x="172" y="116" width="300" height="15" rx="5" fill="#6ee7b7" stroke="#059669" stroke-width="1.1"/>
  <text x="486" y="127" font-size="10.4" fill="#047857" font-weight="700">+0.63 pass@1</text>
  <text x="52" y="153" font-size="10.4" fill="#475569">medium</text>
  <rect x="172" y="144" width="171" height="15" rx="5" fill="#fcd34d" stroke="#d97706" stroke-width="1.1"/>
  <text x="486" y="155" font-size="10.4" fill="#b45309" font-weight="700">+0.36 pass@1</text>
  <text x="52" y="181" font-size="10.4" fill="#475569">hard   (pass@32 = 0)</text>
  <rect x="172" y="172" width="15" height="15" rx="5" fill="#fca5a5" stroke="#dc2626" stroke-width="1.1"/>
  <text x="486" y="183" font-size="10.4" fill="#b91c1c" font-weight="700">+0.03 pass@1</text>
  <text x="52" y="210" font-size="9.6" fill="#64748b">AIME, LCBv5, SWEBench-Verified - the pattern is the same in all three</text>
  <rect x="612" y="108" width="290" height="122" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="624" y="128" font-size="10.6" fill="#b45309" font-weight="700">the diagnosis that is wrong</text>
  <text x="624" y="146" font-size="9.5" fill="#475569">"Hard prompts are undersampled, so raise K." But at K=32 an</text>
  <text x="624" y="158.4" font-size="9.5" fill="#475569">easy prompt sweeps 32/32 only ~19% of the time, so it</text>
  <text x="624" y="170.8" font-size="9.5" fill="#475569">survives filtering and eats a full slot teaching the model what it</text>
  <text x="624" y="183.2" font-size="9.5" fill="#475569">knows. Around step 200 the curves cross: high-K spends its</text>
  <text x="624" y="195.6" font-size="9.5" fill="#475569">budget on rare failures of easy prompts.</text>
  <text x="624" y="216" font-size="10" fill="#b45309" font-weight="700">signal efficiency, not signal loss</text>
  <rect x="22" y="262" width="896" height="422" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="38" y="283" font-size="12.5" fill="#1d4ed8" font-weight="700">NGU: ADAPTIVE PER-PROMPT SAMPLING</text>
  <rect x="345" y="302" width="250" height="38" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.7"/>
  <text x="470" y="325" text-anchor="middle" font-size="11.2" fill="#1d4ed8" font-weight="700">sample K completions  (K = 4)</text>
  <line x1="190" y1="360" x2="750" y2="360" stroke="#cbd5e1" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="470" y1="341" x2="470" y2="360" stroke="#cbd5e1" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="190" y1="360" x2="190" y2="374" stroke="#059669" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a059669)"/>
  <text x="126" y="376" text-anchor="middle" font-size="9.6" fill="#047857" font-weight="700">all correct</text>
  <rect x="85" y="380" width="210" height="44" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="190" y="399" text-anchor="middle" font-size="10.8" fill="#047857" font-weight="700">filter the prompt</text>
  <text x="190" y="414" text-anchor="middle" font-size="9.4" fill="#64748b">cost: 4 completions, done</text>
  <line x1="470" y1="360" x2="470" y2="374" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a7c3aed)"/>
  <text x="406" y="376" text-anchor="middle" font-size="9.6" fill="#6d28d9" font-weight="700">mixed rewards</text>
  <rect x="365" y="380" width="210" height="44" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="470" y="399" text-anchor="middle" font-size="10.8" fill="#6d28d9" font-weight="700">compute the update</text>
  <text x="470" y="414" text-anchor="middle" font-size="9.4" fill="#64748b">train on it</text>
  <line x1="750" y1="360" x2="750" y2="374" stroke="#dc2626" stroke-width="1.2" stroke-linecap="round" marker-end="url(#adc2626)"/>
  <text x="814" y="376" text-anchor="middle" font-size="9.6" fill="#b91c1c" font-weight="700">all incorrect</text>
  <rect x="645" y="380" width="210" height="44" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="750" y="399" text-anchor="middle" font-size="10.8" fill="#b91c1c" font-weight="700">draw u ~ Uniform(0,1)</text>
  <text x="750" y="414" text-anchor="middle" font-size="9.4" fill="#64748b">retry with probability p_NGU</text>
  <path d="M750.0,425 L750.0,436 L694.0,436 L694.0,446" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-linecap="round" marker-end="url(#adc2626)"/>
  <rect x="642" y="448" width="104" height="32" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <text x="694" y="462" text-anchor="middle" font-size="9.8" fill="#b91c1c" font-weight="700">u &lt; p_NGU</text>
  <text x="694" y="474" text-anchor="middle" font-size="9.4" fill="#64748b">requeue K more</text>
  <path d="M750.0,425 L750.0,436 L806.0,436 L806.0,446" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a94a3b8)"/>
  <rect x="754" y="448" width="104" height="32" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="806" y="462" text-anchor="middle" font-size="9.8" fill="#334155" font-weight="700">u &gt;= p_NGU</text>
  <text x="806" y="474" text-anchor="middle" font-size="9.4" fill="#64748b">give up</text>
  <path d="M642.0,464 L44,464 L44,321 L342.0,321" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-linecap="round" marker-end="url(#adc2626)"/>
  <text x="52" y="454" font-size="9.3" fill="#b91c1c" font-weight="700">back into the generator queue, in flight</text>
  <rect x="38" y="504" width="276" height="164" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="50" y="524" font-size="10.8" fill="#1d4ed8" font-weight="700">geometric budget</text>
  <text x="176" y="550" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="700">E[samples] = K / (1 - p_NGU)</text>
  <text x="50" y="570" font-size="9.5" fill="#475569">K=4, p=0.95: an easy prompt costs 4 completions, a</text>
  <text x="50" y="582.4" font-size="9.5" fill="#475569">stubborn one draws 80. A 20x spread from one scalar,</text>
  <text x="50" y="594.8" font-size="9.5" fill="#475569">allocated by measured difficulty rather than guessed in</text>
  <text x="50" y="607.2" font-size="9.5" fill="#475569">advance. Requires async RL - the saved compute has to</text>
  <text x="50" y="619.6" font-size="9.5" fill="#475569">be spendable in flight.</text>
  <rect x="332" y="504" width="276" height="164" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="344" y="524" font-size="10.8" fill="#b45309" font-weight="700">1. staleness window</text>
  <text x="344" y="544" font-size="9.5" fill="#475569">Retries span training steps, so old negatives drift off-policy.</text>
  <text x="344" y="556.4" font-size="9.5" fill="#475569">Discard any completion with age &gt; T. Ablations peak at T =</text>
  <text x="344" y="568.8" font-size="9.5" fill="#475569">4 async steps; T = 8 and T = 16 both degrade.</text>
  <text x="344" y="591.2" font-size="9.4" fill="#64748b">This controls which completions enter the batch. It does not</text>
  <text x="344" y="603.4" font-size="9.4" fill="#64748b">correct the residual off-policy bias in the gradient itself.</text>
  <rect x="626" y="504" width="276" height="164" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="638" y="524" font-size="10.8" fill="#047857" font-weight="700">2. anchoring the positives</text>
  <text x="638" y="544" font-size="9.5" fill="#475569">Dropping stale negatives de-centers the group.</text>
  <text x="638" y="556.4" font-size="9.5" fill="#475569">Recomputing r-bar over the survivors would crush the rare</text>
  <text x="638" y="568.8" font-size="9.5" fill="#475569">positive you spent 24 completions finding.</text>
  <text x="764" y="593.2" text-anchor="middle" font-size="11" fill="#047857" font-weight="700">A+ = 1 - r_bar_NGU</text>
  <text x="764" y="612.2" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="700">A- = - (n+ / n-)(1 - r_bar_NGU)</text>
  <text x="638" y="630.2" font-size="9.4" fill="#64748b">Positives keep their true magnitude; negatives absorb the</text>
  <text x="638" y="642.4" font-size="9.4" fill="#64748b">rebalance. The advantages still sum to zero and nothing is</text>
  <text x="638" y="654.6" font-size="9.4" fill="#64748b">thrown away.</text>
  <rect x="22" y="700" width="896" height="166" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="38" y="721" font-size="12.5" fill="#047857" font-weight="700">WHERE THE GAIN LANDS</text>
  <rect x="38" y="734" width="276" height="116" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="176" y="754" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-weight="700">GSM8k Platinum</text>
  <text x="176" y="768" text-anchor="middle" font-size="9.3" fill="#64748b">Qwen2.5 0.5B Instruct</text>
  <text x="51" y="790" font-size="9.5" fill="#64748b">extra-hard subset</text>
  <text x="51" y="804" font-size="11" fill="#1d4ed8" font-weight="700">~35%  -&gt;  &gt;55%</text>
  <text x="51" y="824" font-size="9.5" fill="#64748b">overall pass@1</text>
  <text x="51" y="838" font-size="11" fill="#1d4ed8" font-weight="700">best across all K</text>
  <rect x="332" y="734" width="276" height="116" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="470" y="754" text-anchor="middle" font-size="11.5" fill="#047857" font-weight="700">DeepScaler Math</text>
  <text x="470" y="768" text-anchor="middle" font-size="9.3" fill="#64748b">Qwen3 4B Base, 120 H100-hrs</text>
  <text x="345" y="790" font-size="9.5" fill="#64748b">overall pass@1</text>
  <text x="345" y="804" font-size="11" fill="#047857" font-weight="700">24.8%  -&gt;  26.5%</text>
  <text x="345" y="824" font-size="9.5" fill="#64748b">hard subset</text>
  <text x="345" y="838" font-size="11" fill="#047857" font-weight="700">+4.3 pp  vs  +1.6 pp</text>
  <rect x="626" y="734" width="276" height="116" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="764" y="754" text-anchor="middle" font-size="11.5" fill="#6d28d9" font-weight="700">Manufactoria Code RL</text>
  <text x="764" y="768" text-anchor="middle" font-size="9.3" fill="#64748b">Qwen3 4B Instruct, per-test reward</text>
  <text x="639" y="790" font-size="9.5" fill="#64748b">GRPO all-tests-pass</text>
  <text x="639" y="804" font-size="11" fill="#6d28d9" font-weight="700">0%  -  stalls completely</text>
  <text x="639" y="824" font-size="9.5" fill="#64748b">NGU all-tests-pass</text>
  <text x="639" y="838" font-size="11" fill="#6d28d9" font-weight="700">&gt;40%</text>
  <text x="470" y="892" text-anchor="middle" font-size="11" fill="#475569">Resuming a stalled 6000-step checkpoint with NGU restarts learning immediately - the network was never rigid, the sampler was starving it.</text>
  <defs>
    <marker id="a059669" markerWidth="6" markerHeight="5.2" refX="5.6" refY="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.4,0.5 L5.8,2.6 L0.4,4.7 Z" fill="#059669"/></marker>
    <marker id="a7c3aed" markerWidth="6" markerHeight="5.2" refX="5.6" refY="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.4,0.5 L5.8,2.6 L0.4,4.7 Z" fill="#7c3aed"/></marker>
    <marker id="adc2626" markerWidth="6" markerHeight="5.2" refX="5.6" refY="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.4,0.5 L5.8,2.6 L0.4,4.7 Z" fill="#dc2626"/></marker>
    <marker id="a94a3b8" markerWidth="6" markerHeight="5.2" refX="5.6" refY="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.4,0.5 L5.8,2.6 L0.4,4.7 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
