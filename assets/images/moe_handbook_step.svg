<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 658" width="940" height="658" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="658" fill="#ffffff"/><text x="24.0" y="34.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Where an MoE step goes: diagnose in order, then judge each lever by its own measurement</text><text x="24.0" y="54.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Each measured effect comes from its own setup and baseline, so do not add them together</text><rect x="24.0" y="74.0" width="470.0" height="570.6" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><text x="38.0" y="98.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">A. Diagnosis order for a slow step</text><rect x="38.0" y="114.0" width="442.0" height="71.3" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="48.0" y="134.6" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">1. Trace one step</text><text x="48.0" y="156.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">--profile at the node count you will run, then read the share of the step the</text><text x="48.0" y="171.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">all-to-all leaves exposed.</text><line x1="259.0" y1="187.3" x2="259.0" y2="205.3" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="38.0" y="207.3" width="442.0" height="71.3" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="48.0" y="227.9" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">2. Re-trace with forced balance</text><text x="48.0" y="249.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">--moe-router-force-load-balancing. Their traced step was half all-to-all; forced</text><text x="48.0" y="265.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">balance ran that iteration 40% faster.</text><line x1="259.0" y1="280.6" x2="145.0" y2="306.6" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="259.0" y1="280.6" x2="373.0" y2="306.6" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="38.0" y="308.6" width="214.0" height="86.8" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="48.0" y="329.2" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="start">All-to-all shrinks</text><text x="48.0" y="350.8" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Ranks were waiting on an</text><text x="48.0" y="366.3" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">overloaded one. Fix balancing first</text><text x="48.0" y="381.8" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">(section 3).</text><rect x="266.0" y="308.6" width="214.0" height="86.8" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="276.0" y="329.2" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="start">All-to-all stays</text><text x="276.0" y="350.8" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">It is the transfer: confirm Using</text><text x="276.0" y="366.3" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">network Libfabric, keep EP inside a</text><text x="276.0" y="381.8" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">node.</text><line x1="373.0" y1="397.4" x2="373.0" y2="415.4" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="266.0" y="417.4" width="214.0" height="86.8" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="276.0" y="438.1" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">3. Overlap</text><text x="276.0" y="459.6" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">--overlap-moe-expert-parallel-comm</text><text x="276.0" y="475.1" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">--delay-wgrad-compute; costs 5 to</text><text x="276.0" y="490.6" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">10 GB more on rank 0.</text><line x1="373.0" y1="506.2" x2="373.0" y2="524.2" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="266.0" y="526.2" width="214.0" height="102.3" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="276.0" y="546.9" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">4. If memory runs out</text><text x="276.0" y="568.4" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Recompute layernorm and</text><text x="276.0" y="583.9" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">moe_act, offload core_attn,</text><text x="276.0" y="599.4" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">attn_proj and expert_fc1, instead of</text><text x="276.0" y="615.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">full recompute.</text><text x="40.0" y="431.4" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">Also in the trace: if permute and copy</text><text x="40.0" y="445.9" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">kernels take a large share, add</text><text x="40.0" y="460.4" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">--moe-permute-fusion.</text><rect x="512.0" y="74.0" width="404.0" height="570.6" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><text x="526.0" y="98.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">B. Measured speed change vs own baseline</text><text x="526.0" y="116.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Percent; bar labels give the reported metric</text><text x="526.0" y="152.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Forced-even routing, same iteration</text><rect x="751.1" y="160.0" width="88.4" height="14.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="845.6" y="171.0" font-size="12" font-weight="700" fill="#14532d" text-anchor="start">+40%</text><text x="745.1" y="171.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">iteration 40% faster</text><text x="526.0" y="228.8" font-size="12" font-weight="700" fill="#334155" text-anchor="start">EP overlap on 2 nodes</text><rect x="751.1" y="236.8" width="77.4" height="14.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="834.5" y="247.8" font-size="12" font-weight="700" fill="#14532d" text-anchor="start">+35%</text><text x="745.1" y="247.8" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">up to +35% throughput</text><text x="526.0" y="305.5" font-size="12" font-weight="700" fill="#334155" text-anchor="start">--moe-permute-fusion</text><rect x="751.1" y="313.5" width="7.5" height="14.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="764.6" y="324.5" font-size="12" font-weight="700" fill="#14532d" text-anchor="start">+3.4%</text><text x="745.1" y="324.5" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">step time -3.3%</text><text x="526.0" y="382.3" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Full recompute, micro-batch 2</text><rect x="698.0" y="390.3" width="53.1" height="14.0" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="757.1" y="401.3" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">-24% throughput</text><text x="704.0" y="401.3" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="start">-24%</text><text x="526.0" y="459.1" font-size="12" font-weight="700" fill="#334155" text-anchor="start">EP16 over 2 nodes vs EP8 in 1</text><rect x="620.7" y="467.1" width="130.5" height="14.0" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="757.1" y="478.1" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">-59% throughput</text><text x="626.7" y="478.1" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="start">-59%</text><text x="526.0" y="535.8" font-size="12" font-weight="700" fill="#334155" text-anchor="start">NCCL fell back to sockets</text><rect x="538.8" y="543.8" width="212.3" height="14.0" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="757.1" y="554.8" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">1.7 vs 42.0 TFLOP/s</text><text x="544.8" y="554.8" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="start">-96%</text><line x1="751.1" y1="154.0" x2="751.1" y2="604.6" stroke="#64748b" stroke-width="1"/><line x1="530.0" y1="604.6" x2="861.7" y2="604.6" stroke="#64748b" stroke-width="1"/><line x1="530.0" y1="604.6" x2="530.0" y2="608.6" stroke="#64748b" stroke-width="1"/><text x="530.0" y="620.6" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">-100</text><line x1="640.6" y1="604.6" x2="640.6" y2="608.6" stroke="#64748b" stroke-width="1"/><text x="640.6" y="620.6" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">-50</text><line x1="751.1" y1="604.6" x2="751.1" y2="608.6" stroke="#64748b" stroke-width="1"/><text x="751.1" y="620.6" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">0</text><line x1="861.7" y1="604.6" x2="861.7" y2="608.6" stroke="#64748b" stroke-width="1"/><text x="861.7" y="620.6" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">+50</text></svg>