<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 456" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="780" height="456" fill="#ffffff"/>
  <text x="390" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Cake: Compiler–Agent Co-Design</text>
  <text x="390" y="48" text-anchor="middle" font-size="12" fill="#64748b">Two loops — the inner one evolves kernels, the outer one evolves the compiler</text>

  <!-- Inner loop box -->
  <rect x="24" y="66" width="732" height="140" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="42" y="88" font-size="13" font-weight="700" fill="#1d4ed8">1. KERNEL EVOLUTION (inner loop)</text>

  <g text-anchor="middle">
    <rect x="42" y="100" width="128" height="56" rx="8" fill="#ffffff" stroke="#60a5fa"/>
    <text x="106" y="124" font-size="12.5" font-weight="600" fill="#334155">Agent</text>
    <text x="106" y="142" font-size="10" fill="#64748b">proposes Cake IR</text>

    <rect x="196" y="100" width="150" height="56" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="271" y="124" font-size="12.5" font-weight="700" fill="#6d28d9">Static verifier</text>
    <text x="271" y="142" font-size="10" fill="#64748b">rejects before compiling</text>

    <rect x="372" y="100" width="128" height="56" rx="8" fill="#ffffff" stroke="#60a5fa"/>
    <text x="436" y="124" font-size="12.5" font-weight="600" fill="#334155">Lower → CUDA</text>
    <text x="436" y="142" font-size="10" fill="#64748b">layouts auto-derived</text>

    <rect x="526" y="100" width="212" height="56" rx="8" fill="#ecfdf5" stroke="#059669"/>
    <text x="632" y="124" font-size="12.5" font-weight="600" fill="#047857">On-device run + benchmark</text>
    <text x="632" y="142" font-size="10" fill="#64748b">B200 / GB300 / H100</text>
  </g>
  <g stroke="#2563eb" stroke-width="2" marker-end="url(#c1)">
    <line x1="170" y1="128" x2="192" y2="128"/>
    <line x1="346" y1="128" x2="368" y2="128"/>
    <line x1="500" y1="128" x2="522" y2="128"/>
  </g>
  <text x="42" y="176" font-size="10.5" fill="#475569"><tspan font-weight="700" fill="#7c3aed">Three pre-compile gates:</tspan>  program safety (races, phase bits) · hardware conformance (SKU surface) · data consistency (swizzle vs MMA)</text>
  <text x="42" y="194" font-size="10" fill="#64748b">Cake IR declares roles, barriers, pipelines, SMEM/TMEM views — but <tspan font-weight="700" fill="#6d28d9">layout is not a first-class citizen</tspan>. The verifier owns legality.</text>

  <!-- feedback band -->
  <path d="M 632 206 L 632 292" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#c2)"/>
  <g text-anchor="end" font-size="10.5" fill="#dc2626">
    <text x="622" y="228">runtime crash / silent mismatch</text>
    <text x="622" y="245">Compute Sanitizer violation</text>
    <text x="622" y="262">hang or timeout</text>
  </g>

  <path d="M 271 292 L 271 212" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#c3)"/>
  <g font-size="10.5" fill="#059669" font-weight="600">
    <text x="285" y="238">new hard gate blocks</text>
    <text x="285" y="255">the whole failure class</text>
  </g>

  <!-- Outer loop box -->
  <rect x="24" y="300" width="732" height="100" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="42" y="322" font-size="13" font-weight="700" fill="#b91c1c">2. COMPILER-HARNESS EVOLUTION (outer loop)</text>
  <g text-anchor="middle">
    <rect x="42" y="332" width="330" height="52" rx="8" fill="#ffffff" stroke="#f87171"/>
    <text x="207" y="353" font-size="12" font-weight="600" fill="#334155">Failure distillation</text>
    <text x="207" y="371" font-size="10.5" fill="#64748b">opaque GPU hang → structured compile-time check</text>

    <rect x="392" y="332" width="346" height="52" rx="8" fill="#ffffff" stroke="#f87171"/>
    <text x="565" y="353" font-size="12" font-weight="600" fill="#334155">Hardware-informed feature addition</text>
    <text x="565" y="371" font-size="10.5" fill="#64748b">tcgen05 variants, TMEM allocation, cluster barriers</text>
  </g>

  <!-- results strip -->
  <text x="24" y="424" font-size="11.5" fill="#334155"><tspan font-weight="700">Clean-start Flash-KMeans:</tspan>  raw CUDA/PTX <tspan fill="#dc2626" font-weight="700">0.928×</tspan> (never plateaued, 3.73 h)  vs  Cake IR <tspan fill="#059669" font-weight="700">1.144×</tspan> median, 3/3 plateau, 1.89 h</text>
  <text x="24" y="446" font-size="11.5" fill="#334155"><tspan font-weight="700">Upstreamed:</tspan>  KDA prefill <tspan fill="#059669" font-weight="700">2.05×</tspan>  ·  TinyGEMM <tspan fill="#059669" font-weight="700">18–23%</tspan>  ·  Alpha-MoE megakernel <tspan fill="#059669" font-weight="700">6.20×</tspan> API-level (1.22× pure GPU span)</text>

  <defs>
    <marker id="c1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker>
    <marker id="c2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/></marker>
    <marker id="c3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker>
  </defs>
</svg>
