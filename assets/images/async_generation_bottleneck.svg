<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 342" width="940" height="342" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="342" fill="#ffffff"/><text x="20.0" y="34.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Why synchronous RL stalls: generation alone, per GRPO step, on one H100</text><text x="20.0" y="56.0" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">512 rollouts per step (G = 8 x 64 prompts); vLLM bf16 aggregate throughput ~6,300 tok/s (7B) and ~1,200 tok/s (32B)</text><rect x="189.3" y="78.0" width="14.0" height="10.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="209.3" y="87.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">7B (DeepSeek-R1-Distill-Qwen-7B)</text><rect x="416.9" y="78.0" width="14.0" height="10.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="436.9" y="87.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">32B (DeepSeek-R1-Distill-Qwen-32B)</text><text x="20.0" y="124.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">2K tokens (short CoT)</text><text x="20.0" y="140.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">~1M tokens</text><rect x="189.3" y="108.0" width="8.9" height="16.0" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="204.2" y="121.0" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start">~3 min</text><rect x="189.3" y="128.0" width="41.7" height="16.0" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="237.0" y="141.0" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="start">~14 min</text><text x="20.0" y="182.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">8K tokens (medium CoT)</text><text x="20.0" y="198.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">~4M tokens</text><rect x="189.3" y="166.0" width="32.8" height="16.0" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="228.0" y="179.0" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start">~11 min</text><rect x="189.3" y="186.0" width="166.8" height="16.0" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="362.0" y="199.0" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="start">~56 min</text><text x="20.0" y="240.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">32K tokens (long CoT)</text><text x="20.0" y="256.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">~16M tokens</text><rect x="189.3" y="224.0" width="134.0" height="16.0" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="329.3" y="237.0" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start">~45 min</text><rect x="189.3" y="244.0" width="661.1" height="16.0" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="856.4" y="257.0" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="start">~3.7 h</text><line x1="189.3" y1="272.0" x2="874.2" y2="272.0" stroke="#64748b" stroke-width="1"/><line x1="189.3" y1="272.0" x2="189.3" y2="276.0" stroke="#64748b" stroke-width="1"/><text x="189.3" y="288.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">0 min</text><line x1="367.9" y1="272.0" x2="367.9" y2="276.0" stroke="#64748b" stroke-width="1"/><text x="367.9" y="288.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">60 min</text><line x1="546.6" y1="272.0" x2="546.6" y2="276.0" stroke="#64748b" stroke-width="1"/><text x="546.6" y="288.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">120 min</text><line x1="725.3" y1="272.0" x2="725.3" y2="276.0" stroke="#64748b" stroke-width="1"/><text x="725.3" y="288.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">180 min</text><text x="20.0" y="312.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">Eight inference GPUs divide these by about 8, and 32K rollouts on a 32B model still take ~28 minutes per step. On top of that, each GRPO group waits for its</text><text x="20.0" y="328.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">slowest completion, and lengths for one prompt range from 1K to 32K.</text></svg>