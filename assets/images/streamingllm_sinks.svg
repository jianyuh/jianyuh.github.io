" height="23.0" rx="3" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="499.3" y="230.0" width="15.0" height="23.0" rx="3" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="517.3" y="230.0" width="15.0" height="23.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="535.3" y="230.0" width="15.0" height="23.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="553.3" y="230.0" width="15.0" height="23.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="571.3" y="230.0" width="15.0" height="23.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="589.3" y="230.0" width="15.0" height="23.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="607.3" y="230.0" width="15.0" height="23.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="625.3" y="230.0" width="15.0" height="23.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="643.3" y="230.0" width="15.0" height="23.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="641.8" y="228.5" width="18.0" height="26.0" rx="4" fill="none" stroke="#0f172a" stroke-width="1.4"/><text x="684.3" y="238.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">O(TW) time · O(W) memory</text><text x="684.3" y="255.0" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="start">PPL 5.40, stable past 4M tokens</text><rect x="265.3" y="266.0" width="12.0" height="12.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="283.3" y="276.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">sink token (first 4)</text><rect x="395.8" y="266.0" width="12.0" height="12.0" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/><text x="413.8" y="276.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">kept in cache</text><rect x="503.5" y="266.0" width="12.0" height="12.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="2 2"/><text x="521.5" y="276.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">evicted</text><rect x="579.9" y="266.0" width="12.0" height="12.0" rx="2" fill="#fff" stroke="#0f172a" stroke-width="1.2"/><text x="597.9" y="276.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">current token T</text><text x="684.3" y="276.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">PPL: Llama-2-13B on PG-19</text><rect x="24.0" y="48.0" width="892.0" height="246.0" rx="10" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3"/><text x="38.0" y="336.0" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start">B · Why it works, and the one implementation detail that matters</text><rect x="38.0" y="352.0" width="389.2" height="158.5" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="48.0" y="372.6" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">Softmax must sum to 1</text><text x="48.0" y="394.1" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Deep heads with nothing useful to attend to park the leftover weight</text><text x="48.0" y="409.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">on the first tokens, which every later token can see. Evicting them</text><text x="48.0" y="425.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">removes the biggest term, exp(x₁), from the softmax denominator,</text><text x="48.0" y="440.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">and the whole attention distribution shifts out of distribution. Four</text><text x="48.0" y="456.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">newline tokens work almost as well as the real ones (PPL 5.60 vs</text><text x="48.0" y="471.8" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">5.40): position, not meaning.</text><rect x="445.2" y="352.0" width="456.8" height="158.5" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="457.2" y="373.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">Re-index positions inside the cache</text><rect x="457.2" y="400.0" width="40.5" height="26.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><rect x="503.7" y="400.0" width="40.5" height="26.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><rect x="550.2" y="400.0" width="40.5" height="26.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><rect x="596.8" y="400.0" width="40.5" height="26.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><rect x="663.3" y="400.0" width="40.5" height="26.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="709.8" y="400.0" width="40.5" height="26.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="756.4" y="400.0" width="40.5" height="26.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="802.9" y="400.0" width="40.5" height="26.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="849.5" y="400.0" width="40.5" height="26.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="650.3" y="417.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">…</text><text x="457.2" y="392.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">stream position</text><text x="477.4" y="417.0" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">0</text><text x="524.0" y="417.0" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">1</text><text x="570.5" y="417.0" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">2</text><text x="617.0" y="417.0" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">3</text><text x="683.6" y="417.0" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">100</text><text x="730.1" y="417.0" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">101</text><text x="776.7" y="417.0" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">102</text><text x="823.2" y="417.0" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">103</text><text x="869.7" y="417.0" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">104</text><text x="457.2" y="442.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">RoPE position used:</text><text x="477.4" y="459.0" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">0</text><text x="524.0" y="459.0" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">1</text><text x="570.5" y="459.0" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">2</text><text x="617.0" y="459.0" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">3</text><text x="683.6" y="459.0" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">4</text><text x="730.1" y="459.0" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">5</text><text x="776.7" y="459.0" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">6</text><text x="823.2" y="459.0" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">7</text><text x="869.7" y="459.0" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">8</text><text x="457.2" y="481.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Cache raw keys, then rotate them by their slot in the cache at each step, so the</text><text x="457.2" y="496.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">distances the model sees never exceed what it was trained on.</text><rect x="24.0" y="312.0" width="892.0" height="214.5" rx="10" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 3"/></svg>