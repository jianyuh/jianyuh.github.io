<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 551" width="940" height="551" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="551" fill="#ffffff"/><text x="20.0" y="34.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">The vocabulary the curriculum builds on</text><text x="20.0" y="56.0" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Agent = model + harness at deployment; at training, an environment, a reward and a trainer close the loop</text><rect x="20.0" y="78.0" width="420.0" height="459.2" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><text x="34.0" y="102.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">A. Anatomy of an agent</text><rect x="34.0" y="114.0" width="392.0" height="283.9" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="48.0" y="138.0" font-size="13.5" font-weight="700" fill="#14532d" text-anchor="start">Agent = model + harness</text><rect x="48.0" y="152.0" width="364.0" height="71.3" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="58.0" y="172.6" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">Scaffold: what the model works from</text><text x="58.0" y="194.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">System prompt, tool descriptions, output parsing, what is</text><text x="58.0" y="209.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">remembered across steps.</text><rect x="48.0" y="231.3" width="364.0" height="71.3" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="58.0" y="251.9" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">Model: text in, text out</text><text x="58.0" y="273.4" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">No memory between calls, no loop. Can express the intent to</text><text x="58.0" y="289.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">call a tool, not execute it.</text><rect x="48.0" y="310.6" width="364.0" height="71.3" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="58.0" y="331.2" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="start">Harness: what makes it run</text><text x="58.0" y="352.8" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Calls the model, executes tool calls, manages context, decides</text><text x="58.0" y="368.3" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">when to stop.</text><rect x="48.0" y="413.9" width="364.0" height="71.3" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="58.0" y="434.5" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">Sub-agent</text><text x="58.0" y="456.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Its own model, scaffold and harness; called like a tool, but can</text><text x="58.0" y="471.6" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">reason and call further sub-agents.</text><line x1="230.0" y1="397.9" x2="230.0" y2="411.9" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><text x="34.0" y="507.2" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">"If you're not the model, you're the harness." The split matters most when</text><text x="34.0" y="522.2" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">training.</text><rect x="462.0" y="78.0" width="458.0" height="459.2" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><text x="476.0" y="102.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">B. Every RL training system for LLMs</text><rect x="476.0" y="128.0" width="183.0" height="87.5" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="486.0" y="148.6" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">Policy (model in its</text><text x="486.0" y="165.5" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">harness)</text><text x="486.0" y="187.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">The behavior being trained;</text><text x="486.0" y="202.6" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">acts in the environment.</text><rect x="723.0" y="128.0" width="183.0" height="87.5" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="733.0" y="148.6" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="start">RL environment</text><text x="733.0" y="170.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Stateful: takes an action</text><text x="733.0" y="185.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">(usually a tool call), updates</text><text x="733.0" y="201.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">state, returns an observation.</text><rect x="476.0" y="372.9" width="183.0" height="102.3" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="486.0" y="393.5" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">Trainer</text><text x="486.0" y="415.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Runs many episodes, scores</text><text x="486.0" y="430.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">them, updates the weights</text><text x="486.0" y="446.1" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">(e.g. TRL GRPOTrainer).</text><rect x="723.0" y="372.9" width="183.0" height="102.3" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="733.0" y="393.5" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="start">Reward</text><text x="733.0" y="415.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Verifiable or learned, sparse</text><text x="733.0" y="430.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">or dense; rubrics split it into</text><text x="733.0" y="446.1" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">weighted parts</text><text x="733.0" y="461.6" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">(WeightedSum, Gate).</text><line x1="659.0" y1="171.8" x2="721.0" y2="171.8" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><text x="691.0" y="165.8" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">action</text><line x1="814.5" y1="215.6" x2="814.5" y2="370.9" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><text x="822.5" y="290.2" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">rollout</text><text x="822.5" y="304.2" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">(trajectory, trace)</text><line x1="723.0" y1="424.0" x2="661.0" y2="424.0" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><text x="691.0" y="418.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">score</text><line x1="567.5" y1="372.9" x2="567.5" y2="217.6" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><text x="575.5" y="290.2" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">updated</text><text x="575.5" y="304.2" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">weights</text><text x="476.0" y="501.2" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">A rollout is one full agent run: what it saw, what it did, what reward it got. It is the</text><text x="476.0" y="516.2" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">raw data RL learns from.</text></svg>