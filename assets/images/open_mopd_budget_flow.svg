<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="920" height="450" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="920" height="450" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="700">Open-MOPD: where the mixed-domain budget gets distorted</text>
  <rect x="22" y="62" width="272" height="342.36" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="158" y="94.14" text-anchor="middle" font-size="13" fill="#334155" font-weight="700">1. Prompt share is not token share</text>
  <text x="158" y="110.33" text-anchor="middle" font-size="10.5" fill="#64748b">same sampler, very different gradient volume</text>
  <text x="44" y="134.48" font-size="10" fill="#64748b">Prompt share — how often a domain is drawn</text>
  <rect x="44" y="141.48" width="228" height="20" rx="4" fill="#f1f5f9" stroke="none" stroke-width="1.4"/>
  <path d="M44,141.48 h90.744 v20 h-90.744 Z" fill="#2563eb"/>
  <text x="89.372" y="154.88" text-anchor="middle" font-size="9.5" fill="#ffffff" font-weight="700">39.8%</text>
  <path d="M134.744,141.48 h90.744 v20 h-90.744 Z" fill="#059669"/>
  <text x="180.116" y="154.88" text-anchor="middle" font-size="9.5" fill="#ffffff" font-weight="700">39.8%</text>
  <path d="M225.488,141.48 h46.284 v20 h-46.284 Z" fill="#7c3aed"/>
  <text x="248.63" y="154.88" text-anchor="middle" font-size="9.5" fill="#ffffff" font-weight="700">20.3%</text>
  <rect x="44" y="141.48" width="228" height="20" rx="4" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="192.48" font-size="10" fill="#64748b">Token share — what the token-mean loss sees</text>
  <rect x="44" y="199.48" width="228" height="20" rx="4" fill="#f1f5f9" stroke="none" stroke-width="1.4"/>
  <path d="M44,199.48 h113.316 v20 h-113.316 Z" fill="#2563eb"/>
  <text x="100.658" y="212.88" text-anchor="middle" font-size="9.5" fill="#ffffff" font-weight="700">49.7%</text>
  <path d="M157.316,199.48 h112.404 v20 h-112.404 Z" fill="#059669"/>
  <text x="213.518" y="212.88" text-anchor="middle" font-size="9.5" fill="#ffffff" font-weight="700">49.3%</text>
  <path d="M269.72,199.48 h2.2572 v20 h-2.2572 Z" fill="#7c3aed"/>
  <line x1="270.849" y1="220.48" x2="270.849" y2="228.48" stroke="#7c3aed" stroke-width="1.1" stroke-linecap="round"/>
  <text x="272" y="238.48" text-anchor="end" font-size="9.5" fill="#6d28d9" font-weight="700">IF 0.99%</text>
  <rect x="44" y="199.48" width="228" height="20" rx="4" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="82.99" y="252.48" width="12" height="10" rx="3" fill="#2563eb" stroke="none" stroke-width="1.4"/>
  <text x="99.99" y="261.48" font-size="10" fill="#475569">Math</text>
  <rect x="144.22" y="252.48" width="12" height="10" rx="3" fill="#059669" stroke="none" stroke-width="1.4"/>
  <text x="161.22" y="261.48" font-size="10" fill="#475569">Code</text>
  <rect x="207.12" y="252.48" width="12" height="10" rx="3" fill="#7c3aed" stroke="none" stroke-width="1.4"/>
  <text x="224.12" y="261.48" font-size="10" fill="#475569">IF</text>
  <rect x="44" y="281.48" width="228" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="56" y="293.48" width="9" height="9" rx="2.5" fill="#2563eb" stroke="none" stroke-width="1.4"/>
  <text x="72" y="301.48" font-size="10.5" fill="#475569">Math</text>
  <text x="164" y="301.48" text-anchor="end" font-size="10.5" fill="#64748b">39.8%</text>
  <line x1="174" y1="298.08" x2="190" y2="298.08" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arw94a3b8)"/>
  <text x="242" y="301.48" text-anchor="end" font-size="10.5" fill="#1d4ed8" font-weight="700">49.7%</text>
  <rect x="56" y="313.48" width="9" height="9" rx="2.5" fill="#059669" stroke="none" stroke-width="1.4"/>
  <text x="72" y="321.48" font-size="10.5" fill="#475569">Code</text>
  <text x="164" y="321.48" text-anchor="end" font-size="10.5" fill="#64748b">39.8%</text>
  <line x1="174" y1="318.08" x2="190" y2="318.08" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arw94a3b8)"/>
  <text x="242" y="321.48" text-anchor="end" font-size="10.5" fill="#047857" font-weight="700">49.3%</text>
  <rect x="56" y="333.48" width="9" height="9" rx="2.5" fill="#7c3aed" stroke="none" stroke-width="1.4"/>
  <text x="72" y="341.48" font-size="10.5" fill="#475569">IF</text>
  <text x="164" y="341.48" text-anchor="end" font-size="10.5" fill="#64748b">20.3%</text>
  <line x1="174" y1="338.08" x2="190" y2="338.08" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arw94a3b8)"/>
  <text x="242" y="341.48" text-anchor="end" font-size="10.5" fill="#6d28d9" font-weight="700">0.99%</text>
  <text x="158" y="368.06" text-anchor="middle" font-size="11" fill="#475569">Short instruction-following answers almost</text>
  <text x="158" y="383.06" text-anchor="middle" font-size="11" fill="#475569">disappear under a token-mean loss.</text>
  <rect x="314" y="62" width="306" height="342.36" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="467" y="94.14" text-anchor="middle" font-size="13" fill="#334155" font-weight="700">2. Budget correction pipeline</text>
  <text x="467" y="110.33" text-anchor="middle" font-size="10.5" fill="#64748b">three fixes applied to a single student</text>
  <rect x="334" y="125.48" width="266" height="66.62" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="467" y="145.45" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-weight="700">Token-share balancing</text>
  <text x="467" y="163.45" text-anchor="middle" font-size="10.5" fill="#475569">w_share = g* / s_tok, so every domain gets the</text>
  <text x="467" y="177.95" text-anchor="middle" font-size="10.5" fill="#475569">token budget it was meant to have</text>
  <rect x="334" y="220.61" width="266" height="66.62" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="467" y="240.58" text-anchor="middle" font-size="11.5" fill="#6d28d9" font-weight="700">Gap-following allocation</text>
  <text x="467" y="258.58" text-anchor="middle" font-size="10.5" fill="#475569">scale with m_d / m_ref rather than 1 / m_d, so</text>
  <text x="467" y="273.08" text-anchor="middle" font-size="10.5" fill="#475569">solved domains stop stealing budget</text>
  <rect x="334" y="315.74" width="266" height="66.62" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="467" y="335.71" text-anchor="middle" font-size="11.5" fill="#047857" font-weight="700">Student reward refresh</text>
  <text x="467" y="353.71" text-anchor="middle" font-size="10.5" fill="#475569">the teacher stays cached, but student-dependent</text>
  <text x="467" y="368.21" text-anchor="middle" font-size="10.5" fill="#475569">rewards are recomputed every inner step</text>
  <rect x="640" y="62" width="258" height="342.36" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="769" y="94.14" text-anchor="middle" font-size="13" fill="#334155" font-weight="700">3. Dynamic budget after correction</text>
  <text x="769" y="110.33" text-anchor="middle" font-size="10.5" fill="#64748b">measured over the first 25 optimizer steps</text>
  <rect x="658" y="125.48" width="222" height="66.62" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <text x="769" y="145.45" text-anchor="middle" font-size="11.5" fill="#b91c1c" font-weight="700">Without gap following</text>
  <text x="769" y="163.45" text-anchor="middle" font-size="10.5" fill="#475569">IF collapses from 48.7% to roughly 9%</text>
  <text x="769" y="177.95" text-anchor="middle" font-size="10.5" fill="#475569">while code climbs to 63.8%</text>
  <rect x="658" y="279.4" width="222" height="66.62" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.3"/>
  <text x="769" y="299.37" text-anchor="middle" font-size="11.5" fill="#047857" font-weight="700">With Open-MOPD</text>
  <text x="769" y="317.37" text-anchor="middle" font-size="10.5" fill="#475569">wide-gap domains keep receiving budget</text>
  <text x="769" y="331.87" text-anchor="middle" font-size="10.5" fill="#475569">and reward staleness is corrected inline</text>
  <text x="769" y="368.21" text-anchor="middle" font-size="10.5" fill="#047857" font-weight="700">83.4% recovery, within 0.31 points</text>
  <text x="769" y="383.21" text-anchor="middle" font-size="10.5" fill="#047857" font-weight="700">of the routed RouteOPD oracle</text>
  <line x1="467" y1="194.1" x2="467" y2="217.61" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw64748b)"/>
  <line x1="467" y1="289.23" x2="467" y2="312.74" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw64748b)"/>
  <line x1="769" y1="198.1" x2="769" y2="275.4" stroke="#059669" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw059669)"/>
  <rect x="703.263" y="226.75" width="131.473" height="18" rx="9" fill="#f8fafc" stroke="none" stroke-width="1.4"/>
  <text x="769" y="239.25" text-anchor="middle" font-size="9.8" fill="#64748b">apply the three corrections</text>
  <text x="460" y="434.36" text-anchor="middle" font-size="11.5" fill="#475569">One student, one sampler, near routed-oracle quality once the budget is measured in tokens rather than prompts.</text>
  <defs>
    <marker id="arw94a3b8" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.8 L8.5,4 L0.5,7.2 Z" fill="#94a3b8"/></marker>
    <marker id="arw64748b" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.8 L8.5,4 L0.5,7.2 Z" fill="#64748b"/></marker>
    <marker id="arw059669" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.8 L8.5,4 L0.5,7.2 Z" fill="#059669"/></marker>
  </defs>
</svg>
