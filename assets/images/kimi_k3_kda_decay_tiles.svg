<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="780" height="400" fill="#ffffff"/>
  <text x="390" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">KDA: bounding log-decay unlocks dense Tensor Core tiles</text>
  <text x="390" y="48" text-anchor="middle" font-size="12" fill="#64748b">scaled sigmoid caps cumulative decay to (−80, 0) over a 16-token tile → reciprocal stays in BF16 range</text>

  <!-- LEFT: unbounded softplus -->
  <rect x="36" y="80" width="330" height="286" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="201" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Before — unbounded neg-Softplus</text>
  <text x="201" y="124" text-anchor="middle" font-size="11" fill="#dc2626">log-decay ∈ (−∞, 0) → 1/Γ overflows in BF16</text>

  <!-- 4x4 tile grid, diagonal is slow position-pair -->
  <g font-size="9">
    <!-- row/col of a lower-triangular chunk -->
    <g>
      <rect x="96" y="150" width="42" height="42" fill="#fee2e2" stroke="#f87171"/><text x="117" y="176" text-anchor="middle" fill="#b91c1c">pair</text>
      <rect x="96" y="192" width="42" height="42" fill="#eff6ff" stroke="#93c5fd"/><text x="117" y="218" text-anchor="middle" fill="#1d4ed8">matmul</text>
      <rect x="138" y="192" width="42" height="42" fill="#fee2e2" stroke="#f87171"/><text x="159" y="218" text-anchor="middle" fill="#b91c1c">pair</text>
      <rect x="96" y="234" width="42" height="42" fill="#eff6ff" stroke="#93c5fd"/><text x="117" y="260" text-anchor="middle" fill="#1d4ed8">matmul</text>
      <rect x="138" y="234" width="42" height="42" fill="#eff6ff" stroke="#93c5fd"/><text x="159" y="260" text-anchor="middle" fill="#1d4ed8">matmul</text>
      <rect x="180" y="234" width="42" height="42" fill="#fee2e2" stroke="#f87171"/><text x="201" y="260" text-anchor="middle" fill="#b91c1c">pair</text>
      <rect x="96" y="276" width="42" height="42" fill="#eff6ff" stroke="#93c5fd"/><text x="117" y="302" text-anchor="middle" fill="#1d4ed8">matmul</text>
      <rect x="138" y="276" width="42" height="42" fill="#eff6ff" stroke="#93c5fd"/><text x="159" y="302" text-anchor="middle" fill="#1d4ed8">matmul</text>
      <rect x="180" y="276" width="42" height="42" fill="#eff6ff" stroke="#93c5fd"/><text x="201" y="302" text-anchor="middle" fill="#1d4ed8">matmul</text>
      <rect x="222" y="276" width="42" height="42" fill="#fee2e2" stroke="#f87171"/><text x="243" y="302" text-anchor="middle" fill="#b91c1c">pair</text>
    </g>
  </g>
  <text x="201" y="340" text-anchor="middle" font-size="10.5" fill="#b91c1c">diagonal tiles fall back to slow explicit</text>
  <text x="201" y="355" text-anchor="middle" font-size="10.5" fill="#b91c1c">position-pair computation</text>

  <!-- RIGHT: bounded sigmoid -->
  <rect x="414" y="80" width="330" height="286" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="579" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">After — scaled sigmoid, g_min = −5</text>
  <text x="579" y="124" text-anchor="middle" font-size="11" fill="#059669">g = g_min · σ(e^A z) ∈ (−5, 0);  α = exp(g)</text>

  <g font-size="9">
    <g>
      <rect x="474" y="150" width="42" height="42" fill="#d1fae5" stroke="#34d399"/><text x="495" y="176" text-anchor="middle" fill="#047857">matmul</text>
      <rect x="474" y="192" width="42" height="42" fill="#d1fae5" stroke="#34d399"/><text x="495" y="218" text-anchor="middle" fill="#047857">matmul</text>
      <rect x="516" y="192" width="42" height="42" fill="#d1fae5" stroke="#34d399"/><text x="537" y="218" text-anchor="middle" fill="#047857">matmul</text>
      <rect x="474" y="234" width="42" height="42" fill="#d1fae5" stroke="#34d399"/><text x="495" y="260" text-anchor="middle" fill="#047857">matmul</text>
      <rect x="516" y="234" width="42" height="42" fill="#d1fae5" stroke="#34d399"/><text x="537" y="260" text-anchor="middle" fill="#047857">matmul</text>
      <rect x="558" y="234" width="42" height="42" fill="#d1fae5" stroke="#34d399"/><text x="579" y="260" text-anchor="middle" fill="#047857">matmul</text>
      <rect x="474" y="276" width="42" height="42" fill="#d1fae5" stroke="#34d399"/><text x="495" y="302" text-anchor="middle" fill="#047857">matmul</text>
      <rect x="516" y="276" width="42" height="42" fill="#d1fae5" stroke="#34d399"/><text x="537" y="302" text-anchor="middle" fill="#047857">matmul</text>
      <rect x="558" y="276" width="42" height="42" fill="#d1fae5" stroke="#34d399"/><text x="579" y="302" text-anchor="middle" fill="#047857">matmul</text>
      <rect x="600" y="276" width="42" height="42" fill="#d1fae5" stroke="#34d399"/><text x="621" y="302" text-anchor="middle" fill="#047857">matmul</text>
    </g>
  </g>
  <text x="579" y="340" text-anchor="middle" font-size="10.5" fill="#047857">every tile — diagonal &amp; off-diagonal —</text>
  <text x="579" y="355" text-anchor="middle" font-size="10.5" fill="#047857">is a dense Tensor Core matmul</text>

  <!-- center arrow -->
  <path d="M370,220 L410,220" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
</svg>
