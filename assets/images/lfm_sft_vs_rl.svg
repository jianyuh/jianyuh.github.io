<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="470" fill="#ffffff"/><text x="20.0" y="34.0" font-size="16.5" font-weight="700" fill="#0f172a" text-anchor="start">LFM2.5-2.6B on four harnesses: RL beats imitation, and multi-harness training cuts the most calls</text><text x="20.0" y="56.0" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">250 held-out SmolDataEnvs tasks x 4 harnesses = 1,000 cells; RL at step 1,000, SFT after epoch 2; one seed each</text><rect x="20.0" y="78.0" width="500.0" height="338.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><text x="34.0" y="104.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">A. Overall accuracy (%)</text><text x="34.0" y="122.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">first graded attempt correct, averaged over the 4 harnesses</text><text x="34.0" y="155.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Base</text><rect x="159.1" y="142.0" width="213.4" height="18.0" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="378.4" y="156.0" font-size="12" font-weight="700" fill="#1e293b" text-anchor="start">42.2%</text><text x="34.0" y="195.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Multi-harness SFT</text><rect x="159.1" y="182.0" width="217.9" height="18.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="383.0" y="196.0" font-size="12" font-weight="700" fill="#78350f" text-anchor="start">43.1%</text><text x="34.0" y="235.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">OpenCode SFT</text><rect x="159.1" y="222.0" width="240.2" height="18.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="405.2" y="236.0" font-size="12" font-weight="700" fill="#78350f" text-anchor="start">47.5%</text><text x="34.0" y="275.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">OpenCode-only RL</text><rect x="159.1" y="262.0" width="264.4" height="18.0" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="429.5" y="276.0" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start">52.3%</text><text x="34.0" y="315.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Multi-harness RL</text><rect x="159.1" y="302.0" width="274.0" height="18.0" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="439.1" y="316.0" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="start">54.2%</text><line x1="159.1" y1="340.0" x2="462.4" y2="340.0" stroke="#64748b" stroke-width="1"/><line x1="159.1" y1="340.0" x2="159.1" y2="344.0" stroke="#64748b" stroke-width="1"/><text x="159.1" y="356.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">0</text><line x1="260.2" y1="340.0" x2="260.2" y2="344.0" stroke="#64748b" stroke-width="1"/><text x="260.2" y="356.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">20</text><line x1="361.3" y1="340.0" x2="361.3" y2="344.0" stroke="#64748b" stroke-width="1"/><text x="361.3" y="356.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">40</text><line x1="462.4" y1="340.0" x2="462.4" y2="344.0" stroke="#64748b" stroke-width="1"/><text x="462.4" y="356.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">60</text><text x="34.0" y="376.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">Multi-harness SFT hid gains of 4 to 9 points in three harnesses behind a 17-point drop</text><text x="34.0" y="391.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">under Mini-SWE-Agent (62.1 -&gt; 45.2).</text><rect x="538.0" y="78.0" width="382.0" height="338.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><text x="552.0" y="104.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">B. Fewer tool calls vs base (%)</text><text x="552.0" y="122.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">on tasks both the model and the base solved</text><text x="552.0" y="155.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">OpenCode SFT</text><rect x="677.1" y="142.0" width="45.0" height="18.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="728.1" y="156.0" font-size="12" font-weight="700" fill="#78350f" text-anchor="start">8.5%</text><text x="552.0" y="195.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">OpenCode-only RL</text><rect x="677.1" y="182.0" width="58.3" height="18.0" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="741.3" y="196.0" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start">11.0%</text><text x="552.0" y="235.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Multi-harness SFT</text><rect x="677.1" y="222.0" width="128.2" height="18.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="811.2" y="236.0" font-size="12" font-weight="700" fill="#78350f" text-anchor="start">24.2%</text><text x="552.0" y="275.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Multi-harness RL</text><rect x="677.1" y="262.0" width="164.7" height="18.0" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="847.8" y="276.0" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="start">31.1%</text><line x1="677.1" y1="300.0" x2="862.4" y2="300.0" stroke="#64748b" stroke-width="1"/><line x1="677.1" y1="300.0" x2="677.1" y2="304.0" stroke="#64748b" stroke-width="1"/><text x="677.1" y="316.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">0</text><line x1="730.0" y1="300.0" x2="730.0" y2="304.0" stroke="#64748b" stroke-width="1"/><text x="730.0" y="316.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">10</text><line x1="783.0" y1="300.0" x2="783.0" y2="304.0" stroke="#64748b" stroke-width="1"/><text x="783.0" y="316.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">20</text><line x1="836.0" y1="300.0" x2="836.0" y2="304.0" stroke="#64748b" stroke-width="1"/><text x="836.0" y="316.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">30</text><text x="552.0" y="336.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">SFT had no efficiency term; RL had a capped bonus (at most 0.1,</text><text x="552.0" y="351.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">paid only on correct answers). Training across harnesses cut calls</text><text x="552.0" y="366.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">under every harness.</text><text x="20.0" y="440.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">Best RL checkpoints on the test set: 54.6% (multi-harness, step 700) and within half a point of step 1,000 for OpenCode-only. The SFT and RL runs differ in data,</text><text x="20.0" y="456.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">objective and compute: observations, not a ranking.</text></svg>