<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Why K3 Keeps MLA — and Drops RoPE</text>

  <!-- four grail requirements -->
  <text x="380" y="56" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">The "grail" attention must clear all four — none does yet:</text>
  <rect x="60" y="66" width="150" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="135" y="84" text-anchor="middle" font-size="10.5" fill="#334155">① quality ≥ MLA</text>
  <text x="135" y="99" text-anchor="middle" font-size="9.5" fill="#64748b">no regression</text>
  <rect x="222" y="66" width="150" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="297" y="84" text-anchor="middle" font-size="10.5" fill="#334155">② train/prefill ≤ MLA</text>
  <text x="297" y="99" text-anchor="middle" font-size="9.5" fill="#64748b">agent/coding</text>
  <rect x="384" y="66" width="150" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="459" y="84" text-anchor="middle" font-size="10.5" fill="#334155">③ KV cache &lt; MLA</text>
  <text x="459" y="99" text-anchor="middle" font-size="9.5" fill="#64748b">long context</text>
  <rect x="546" y="66" width="154" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="623" y="84" text-anchor="middle" font-size="10.5" fill="#334155">④ decode &lt; MLA</text>
  <text x="623" y="99" text-anchor="middle" font-size="9.5" fill="#64748b">MTP-friendly</text>

  <!-- MLA weakness -->
  <rect x="120" y="140" width="240" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="240" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">MLA alone</text>
  <text x="240" y="184" text-anchor="middle" font-size="10.5" fill="#334155">very low KV cache, low prefill</text>
  <text x="240" y="200" text-anchor="middle" font-size="10.5" fill="#334155">✗ heavy decode compute (④)</text>

  <!-- KDA rescue -->
  <rect x="400" y="140" width="240" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="520" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">+ KDA (linear attn)</text>
  <text x="520" y="184" text-anchor="middle" font-size="10.5" fill="#334155">carries the bulk of compute</text>
  <text x="520" y="200" text-anchor="middle" font-size="10.5" fill="#334155">→ MLA decode weakness neutralized</text>

  <line x1="360" y1="175" x2="398" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>

  <!-- NoPE derivation -->
  <rect x="90" y="248" width="580" height="98" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="380" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">NoPE, derived: DeltaNet in Q/K ≡ generalized RoPE</text>
  <text x="380" y="296" text-anchor="middle" font-size="11.5" fill="#334155">Q̃ = Q − DeltaNet(Q,W,W),   K̃ = K − DeltaNet(K,W,W)   ≡   PaTH / rotary encoding</text>
  <text x="380" y="318" text-anchor="middle" font-size="11" fill="#475569">KDA ⊋ DeltaNet  ⇒  KDA+MLA already supplies complete implicit position encoding</text>
  <text x="380" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">⇒ explicit RoPE is redundant → drop it (NoPE)</text>

  <text x="380" y="376" text-anchor="middle" font-size="11" fill="#64748b">64-dim concat kept only for kernel compatibility + FLOP economy, not for position</text>

  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
  </defs>
</svg>
