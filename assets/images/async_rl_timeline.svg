<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 473" width="940" height="473" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="473" fill="#ffffff"/><text x="20.0" y="34.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Synchronous vs asynchronous RL: keep generation running and never make the trainer wait</text><text x="20.0" y="56.0" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Every one of the 16 surveyed libraries with real overlap is built on disaggregated GPU pools</text><text x="20.0" y="94.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">A. Synchronous, colocated (original TRL GRPOTrainer)</text><text x="20.0" y="124.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Shared GPUs</text><text x="20.0" y="139.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">take turns</text><rect x="158.0" y="108.0" width="250.0" height="32.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="283.0" y="128.0" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">generate G per prompt</text><rect x="412.0" y="108.0" width="52.0" height="32.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="438.0" y="128.0" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">score</text><rect x="468.0" y="108.0" width="92.0" height="32.0" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="514.0" y="128.0" font-size="11.5" font-weight="700" fill="#4c1d95" text-anchor="middle">train</text><rect x="564.0" y="108.0" width="44.0" height="32.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="586.0" y="128.0" font-size="11.5" font-weight="700" fill="#78350f" text-anchor="middle">sync</text><rect x="612.0" y="108.0" width="250.0" height="32.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="737.0" y="128.0" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">generate G per prompt</text><rect x="866.0" y="108.0" width="52.0" height="32.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="892.0" y="128.0" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">score</text><text x="158.0" y="154.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">The group waits for its slowest completion (1K to 32K tokens); the trainer idles during every generation phase.</text><text x="20.0" y="182.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">B. Asynchronous, disaggregated (AsyncGRPOTrainer, slime, verl, PipelineRL, ...)</text><text x="20.0" y="212.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Inference pool</text><text x="20.0" y="227.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">vLLM / SGLang</text><rect x="158.0" y="196.0" width="111.3" height="32.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="213.7" y="216.0" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">gen batch 1 (v0)</text><rect x="273.3" y="196.0" width="111.3" height="32.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="329.0" y="216.0" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">gen batch 2 (v0)</text><rect x="388.7" y="196.0" width="111.3" height="32.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="444.3" y="216.0" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">gen batch 3 (v1)</text><rect x="504.0" y="196.0" width="111.3" height="32.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="559.7" y="216.0" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">gen batch 4 (v2)</text><rect x="619.3" y="196.0" width="111.3" height="32.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="675.0" y="216.0" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">gen batch 5 (v3)</text><rect x="734.7" y="196.0" width="111.3" height="32.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="790.3" y="216.0" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">gen batch 6 (v4)</text><text x="20.0" y="258.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Rollout buffer</text><text x="20.0" y="273.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">bounded, tagged</text><rect x="158.0" y="242.0" width="688.0" height="32.0" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/><text x="168.0" y="262.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">each sample carries the policy version that generated it; depth = maximum staleness</text><text x="20.0" y="304.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Trainer pool</text><text x="20.0" y="319.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">FSDP / Megatron</text><rect x="247.1" y="288.0" width="116.6" height="32.0" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="305.4" y="308.0" font-size="11.5" font-weight="700" fill="#4c1d95" text-anchor="middle">train batch 1 -&gt; v1</text><rect x="367.7" y="288.0" width="116.6" height="32.0" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="425.9" y="308.0" font-size="11.5" font-weight="700" fill="#4c1d95" text-anchor="middle">train batch 2 -&gt; v2</text><rect x="488.2" y="288.0" width="116.6" height="32.0" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="546.5" y="308.0" font-size="11.5" font-weight="700" fill="#4c1d95" text-anchor="middle">train batch 3 -&gt; v3</text><rect x="608.8" y="288.0" width="116.6" height="32.0" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="667.1" y="308.0" font-size="11.5" font-weight="700" fill="#4c1d95" text-anchor="middle">train batch 4 -&gt; v4</text><rect x="729.4" y="288.0" width="116.6" height="32.0" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="787.7" y="308.0" font-size="11.5" font-weight="700" fill="#4c1d95" text-anchor="middle">train batch 5 -&gt; v5</text><line x1="213.7" y1="228.0" x2="213.7" y2="241.0" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="287.4" y1="274.0" x2="287.4" y2="287.0" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="329.0" y1="228.0" x2="329.0" y2="241.0" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="407.9" y1="274.0" x2="407.9" y2="287.0" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="444.3" y1="228.0" x2="444.3" y2="241.0" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="528.5" y1="274.0" x2="528.5" y2="287.0" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="559.7" y1="228.0" x2="559.7" y2="241.0" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="649.1" y1="274.0" x2="649.1" y2="287.0" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="675.0" y1="228.0" x2="675.0" y2="241.0" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="769.7" y1="274.0" x2="769.7" y2="287.0" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><path d="M846.0,304.0 L876.0,304.0 L876.0,212.0 L848.0,212.0" fill="none" stroke="#d97706" stroke-width="1.4" marker-end="url(#ah)"/><text x="882.0" y="250.0" font-size="11" font-weight="700" fill="#78350f" text-anchor="start">new</text><text x="882.0" y="264.0" font-size="11" font-weight="700" fill="#78350f" text-anchor="start">weights</text><text x="158.0" y="340.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">Black arrows: rollouts flow into the buffer and on to the trainer. Amber: weights flow back to inference by NCCL broadcast (~100 to 500</text><text x="158.0" y="356.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">ms; ~20 ms bucketed in verl).</text><rect x="20.0" y="378.0" width="293.3" height="79.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="32.0" y="404.0" font-size="14" font-weight="700" fill="#14532d" text-anchor="start">Gain</text><text x="32.0" y="426.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Neither side waits: generation for batch N+K</text><text x="32.0" y="443.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">overlaps training on batch N.</text><rect x="323.3" y="378.0" width="293.3" height="79.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/><text x="335.3" y="404.0" font-size="14" font-weight="700" fill="#7f1d1d" text-anchor="start">Cost</text><text x="335.3" y="426.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Staleness: rollouts arrive from a policy one or</text><text x="335.3" y="443.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">more versions old.</text><rect x="626.7" y="378.0" width="293.3" height="79.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="638.7" y="404.0" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start">Fixes</text><text x="638.7" y="426.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Version rejection, bounded depth, truncated</text><text x="638.7" y="443.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">importance sampling, or a hybrid.</text></svg>