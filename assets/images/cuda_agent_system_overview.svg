<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="920" height="390" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">CUDA Agent: data synthesis, tool-using search, and stable RL</text>

  <defs>
    <marker id="caa" markerWidth="7" markerHeight="7" refX="5.6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="36" y="66" width="254" height="194" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="163" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">1. CUDA-Agent-Ops-6K</text>
  <rect x="60" y="112" width="206" height="42" rx="8" fill="#ffffff" stroke="#60a5fa"/>
  <text x="163" y="130" text-anchor="middle" font-size="12.5" fill="#334155">Seed ops from PyTorch</text>
  <text x="163" y="145" text-anchor="middle" font-size="12.5" fill="#334155">and Transformers</text>
  <rect x="60" y="164" width="206" height="34" rx="8" fill="#ffffff" stroke="#60a5fa"/>
  <text x="163" y="186" text-anchor="middle" font-size="12.5" fill="#334155">LLM fusion of 1-5 primitives</text>
  <rect x="60" y="208" width="206" height="42" rx="8" fill="#ffffff" stroke="#60a5fa"/>
  <text x="163" y="226" text-anchor="middle" font-size="12.5" fill="#334155">1-100 ms filter</text>
  <text x="163" y="241" text-anchor="middle" font-size="12.5" fill="#334155">plus AST decontamination</text>

  <line x1="290" y1="163" x2="332" y2="163" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#caa)"/>

  <rect x="332" y="66" width="256" height="194" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="460" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">2. Skill-integrated agent loop</text>
  <rect x="356" y="112" width="208" height="34" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="460" y="134" text-anchor="middle" font-size="12.5" fill="#334155">Bash, edit, read, grep</text>
  <rect x="356" y="156" width="208" height="34" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="460" y="178" text-anchor="middle" font-size="12.5" fill="#334155">Compile, verify, profile</text>
  <rect x="356" y="200" width="208" height="34" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="460" y="222" text-anchor="middle" font-size="12.5" fill="#334155">CPU host + 128 H20 GPU workers</text>

  <line x1="588" y1="163" x2="630" y2="163" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#caa)"/>

  <rect x="630" y="66" width="254" height="194" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="757" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">3. Stable multi-turn RL</text>
  <rect x="654" y="112" width="206" height="34" rx="8" fill="#ffffff" stroke="#c084fc"/>
  <text x="757" y="134" text-anchor="middle" font-size="12.5" fill="#334155">Single-turn warm-up</text>
  <rect x="654" y="156" width="206" height="34" rx="8" fill="#ffffff" stroke="#c084fc"/>
  <text x="757" y="178" text-anchor="middle" font-size="12.5" fill="#334155">RFT actor init + GAE critic init</text>
  <rect x="654" y="200" width="206" height="34" rx="8" fill="#ffffff" stroke="#c084fc"/>
  <text x="757" y="222" text-anchor="middle" font-size="12.5" fill="#334155">150 PPO steps, batch size 1024</text>

  <rect x="120" y="292" width="680" height="58" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="233" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">98.8% pass rate</text>
  <text x="460" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">96.8% faster than compile</text>
  <text x="687" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">2.11x speedup</text>
  <line x1="347" y1="304" x2="347" y2="338" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="573" y1="304" x2="573" y2="338" stroke="#cbd5e1" stroke-width="1.5"/>
</svg>
