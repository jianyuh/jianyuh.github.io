<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">One SVD Unifies SOAP, Shampoo, and Muon</text>

  <!-- gradient SVD -->
  <rect x="270" y="52" width="220" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="81" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Gradient   G = U Σ Vᵀ</text>

  <!-- three paths -->
  <!-- SOAP -->
  <rect x="40" y="140" width="200" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">SOAP</text>
  <text x="140" y="186" text-anchor="middle" font-size="10.5" fill="#334155">whiten in eigenbasis</text>
  <text x="140" y="204" text-anchor="middle" font-size="10.5" fill="#64748b">Q_L=U, Q_R=V</text>
  <text x="140" y="219" text-anchor="middle" font-size="10.5" fill="#64748b">Q_LᵀG Q_R = Σ → sign(Σ)</text>

  <!-- Shampoo -->
  <rect x="280" y="140" width="200" height="86" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="380" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">Shampoo</text>
  <text x="380" y="186" text-anchor="middle" font-size="10.5" fill="#334155">inverse-Kronecker</text>
  <text x="380" y="204" text-anchor="middle" font-size="10.5" fill="#64748b">precondition on</text>
  <text x="380" y="219" text-anchor="middle" font-size="10.5" fill="#64748b">GGᵀ, GᵀG factors</text>

  <!-- Muon -->
  <rect x="520" y="140" width="200" height="86" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="620" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">Muon</text>
  <text x="620" y="186" text-anchor="middle" font-size="10.5" fill="#334155">Newton-Schulz</text>
  <text x="620" y="204" text-anchor="middle" font-size="10.5" fill="#64748b">orthogonalize</text>
  <text x="620" y="219" text-anchor="middle" font-size="10.5" fill="#64748b">momentum matrix</text>

  <line x1="330" y1="100" x2="150" y2="138" stroke="#2563eb" stroke-width="2" marker-end="url(#b1)"/>
  <line x1="380" y1="100" x2="380" y2="138" stroke="#7c3aed" stroke-width="2" marker-end="url(#b2)"/>
  <line x1="430" y1="100" x2="610" y2="138" stroke="#059669" stroke-width="2" marker-end="url(#b3)"/>

  <line x1="140" y1="226" x2="330" y2="286" stroke="#94a3b8" stroke-width="2" marker-end="url(#b4)"/>
  <line x1="380" y1="226" x2="380" y2="286" stroke="#94a3b8" stroke-width="2" marker-end="url(#b4)"/>
  <line x1="620" y1="226" x2="430" y2="286" stroke="#94a3b8" stroke-width="2" marker-end="url(#b4)"/>

  <!-- unified -->
  <rect x="200" y="290" width="360" height="60" rx="12" fill="#1e293b"/>
  <text x="380" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Same limit: the polar factor</text>
  <text x="380" y="338" text-anchor="middle" font-size="14" fill="#f1f5f9">ΔW = −η · U Vᵀ</text>

  <text x="380" y="378" text-anchor="middle" font-size="12" fill="#475569">damp over-large singular directions, amplify small ones — respect the operator structure of linear layers</text>

  <defs>
    <marker id="b1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker>
    <marker id="b2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/></marker>
    <marker id="b3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker>
    <marker id="b4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
  </defs>
</svg>
