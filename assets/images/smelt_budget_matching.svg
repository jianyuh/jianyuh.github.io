<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" width="940" height="510" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="940" height="510" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="700">SMELT: Compute-Matched Looped MoE</text>
  <text x="470" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">Loop the middle 50% of layers twice (r = 2), then pay back all three budgets before claiming a win</text>
  <rect x="22" y="68" width="896" height="128" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="38" y="89" font-size="12.5" fill="#1d4ed8" font-weight="700">THE JOINT CONSTRAINT TRIAD — looping breaks all three</text>
  <rect x="38" y="100" width="276" height="76" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="176" y="120" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-weight="700">1.  per-token FLOPs</text>
  <text x="176" y="140" text-anchor="middle" font-size="10" fill="#b91c1c">recurrence adds compute</text>
  <text x="176" y="162" text-anchor="middle" font-size="10" fill="#047857">narrow the hidden dim H</text>
  <line x1="176" y1="144" x2="176" y2="152" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" marker-end="url(#a94a3b8)"/>
  <rect x="332" y="100" width="276" height="76" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="470" y="120" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-weight="700">2.  non-embedding params</text>
  <text x="470" y="140" text-anchor="middle" font-size="10" fill="#b91c1c">narrowing H costs capacity</text>
  <text x="470" y="162" text-anchor="middle" font-size="10" fill="#047857">raise the MoE expert count</text>
  <line x1="470" y1="144" x2="470" y2="152" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" marker-end="url(#a94a3b8)"/>
  <rect x="626" y="100" width="276" height="76" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="764" y="120" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-weight="700">3.  KV cache size</text>
  <text x="764" y="140" text-anchor="middle" font-size="10" fill="#b91c1c">extra passes inflate activations</text>
  <text x="764" y="162" text-anchor="middle" font-size="10" fill="#047857">tune head size and GQA ratio</text>
  <line x1="764" y1="144" x2="764" y2="152" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round" marker-end="url(#a94a3b8)"/>
  <rect x="22" y="212" width="452" height="138" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="38" y="233" font-size="12.5" fill="#6d28d9" font-weight="700">PRELUDE — RECUR ×2 — CODA</text>
  <rect x="38" y="250" width="92" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="84" y="276" text-anchor="middle" font-size="10.5" fill="#334155" font-weight="700">prelude</text>
  <rect x="144" y="250" width="196" height="44" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="242" y="269" text-anchor="middle" font-size="11" fill="#6d28d9" font-weight="700">tied middle block</text>
  <text x="242" y="284" text-anchor="middle" font-size="9.8" fill="#64748b">pass 1  then  pass 2</text>
  <rect x="354" y="250" width="92" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="400" y="276" text-anchor="middle" font-size="10.5" fill="#334155" font-weight="700">coda</text>
  <line x1="132" y1="272" x2="141" y2="272" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a94a3b8)"/>
  <line x1="342" y1="272" x2="351" y2="272" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a94a3b8)"/>
  <path d="M 314 254 C 330 234, 154 234, 170 253" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a7c3aed)"/>
  <text x="38" y="312" font-size="10.2" fill="#475569">looped indices:  3–7 (100M)  ·  4–9 (200M)  ·  6–15 (600M)  ·  8–22 (1.6B)</text>
  <text x="38" y="327" font-size="10.2" fill="#475569">Δx = (1/r)·Attn(RMSNorm(x))   and   (1/r)·MoE(RMSNorm(x+Δx));  r = 3 or 4 goes too thin</text>
  <rect x="492" y="212" width="426" height="138" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="508" y="233" font-size="12.5" fill="#047857" font-weight="700">SCALING SURFACE   L = E + A(1−S)^b / F^a + K / D^c</text>
  <text x="508" y="258" font-size="10.2" fill="#475569">S = 1 − N_act^eq / N   with   N_act^eq = (F/F₀)·N₀</text>
  <text x="508" y="274" font-size="10.2" fill="#475569">frontier exponent γ = ac/(a+c):   baseline 0.237   vs   SMELT 0.250</text>
  <rect x="508" y="284" width="123.333" height="40" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="569.667" y="304.8" text-anchor="middle" font-size="13" fill="#047857" font-weight="700">6.8%</text>
  <text x="569.667" y="315" text-anchor="middle" font-size="9.3" fill="#64748b">at 10²⁰ FLOPs</text>
  <rect x="643.333" y="284" width="123.333" height="40" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="705" y="304.8" text-anchor="middle" font-size="13" fill="#047857" font-weight="700">14.7–18.0%</text>
  <text x="705" y="315" text-anchor="middle" font-size="9.3" fill="#64748b">at 10²¹ FLOPs</text>
  <rect x="778.667" y="284" width="123.333" height="40" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="840.333" y="304.8" text-anchor="middle" font-size="13" fill="#047857" font-weight="700">~23.5%</text>
  <text x="840.333" y="315" text-anchor="middle" font-size="9.3" fill="#64748b">at 10²² FLOPs</text>
  <text x="508" y="340" font-size="9.8" fill="#64748b">optimal TPP matched (56–91) at 10²¹, so the gain is not a data/parameter-split artifact</text>
  <rect x="22" y="366" width="286.667" height="84" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="165.333" y="387.44" text-anchor="middle" font-size="11.5" fill="#334155" font-weight="700">Refinement, not repetition</text>
  <text x="165.333" y="405.44" text-anchor="middle" font-size="10.3" fill="#475569">Second-pass updates are 1.2–3.5× larger yet stay</text>
  <text x="165.333" y="419.94" text-anchor="middle" font-size="10.3" fill="#475569">cosine-0.56 aligned with the first — causally tied to the</text>
  <text x="165.333" y="434.44" text-anchor="middle" font-size="10.3" fill="#475569">1/r scaling.</text>
  <rect x="326.667" y="366" width="286.667" height="84" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="470" y="394.69" text-anchor="middle" font-size="11.5" fill="#334155" font-weight="700">Same places, refined content</text>
  <text x="470" y="412.69" text-anchor="middle" font-size="10.3" fill="#475569">Q/K similarity ~0.90 against V ~0.70. The router reuses</text>
  <text x="470" y="427.19" text-anchor="middle" font-size="10.3" fill="#475569">2–3 core experts and diversifies the rest.</text>
  <rect x="631.333" y="366" width="286.667" height="84" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="774.667" y="394.69" text-anchor="middle" font-size="11.5" fill="#334155" font-weight="700">Attention-sink vanishing act</text>
  <text x="774.667" y="412.69" text-anchor="middle" font-size="10.3" fill="#475569">On Dyck, BOS mass drops 0.60 -&gt; 0.02 on the second</text>
  <text x="774.667" y="427.19" text-anchor="middle" font-size="10.3" fill="#475569">pass as attention moves to content tokens.</text>
  <text x="470" y="472" text-anchor="middle" font-size="11" fill="#475569">Downstream residuals at 1.6B active (54B non-embedding):   code CE gain 20.4%   ·   MMLU +1.6 pp   ·   DCLM Completion +12.3 mn</text>
  <text x="470" y="490" text-anchor="middle" font-size="11" fill="#475569">Long context 1.52× gain amplification (512–4096 tokens)   ·   Dyck at k=32 shots: 29.8% vs 26.4% baseline</text>
  <defs>
    <marker id="a94a3b8" markerWidth="6" markerHeight="5.2" refX="5.6" refY="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.4,0.5 L5.8,2.6 L0.4,4.7 Z" fill="#94a3b8"/></marker>
    <marker id="a7c3aed" markerWidth="6" markerHeight="5.2" refX="5.6" refY="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.4,0.5 L5.8,2.6 L0.4,4.7 Z" fill="#7c3aed"/></marker>
  </defs>
</svg>
