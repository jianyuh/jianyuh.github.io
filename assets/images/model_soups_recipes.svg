<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 596" width="940" height="596" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="940" height="596" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="700">Model Soups: average the sweep instead of discarding it</text>
  <text x="470" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">k fine-tunes from one shared θ₀, collapsed into a single weight vector — ensemble-grade accuracy at O(1) inference</text>
  <rect x="22" y="68" width="896" height="176" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="38" y="89" font-size="12.5" fill="#1d4ed8" font-weight="700">ONE HYPERPARAMETER SWEEP, THREE WAYS TO SPEND IT</text>
  <rect x="38" y="106" width="200" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="138" y="127" text-anchor="middle" font-size="11.5" fill="#334155" font-weight="700">pre-trained θ₀</text>
  <line x1="138" y1="142" x2="138" y2="156" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a94a3b8)"/>
  <rect x="38" y="158" width="200" height="52" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="138" y="178" text-anchor="middle" font-size="12.5" fill="#1d4ed8" font-weight="700">θ₁   θ₂   …   θ_k</text>
  <text x="138" y="196" text-anchor="middle" font-size="9.6" fill="#64748b">vary LR, augmentation, seed, epochs</text>
  <text x="138" y="230" text-anchor="middle" font-size="10" fill="#475569">θ_i = FineTune(θ₀, h_i)</text>
  <line x1="243" y1="158" x2="257" y2="158" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a94a3b8)"/>
  <rect x="264" y="106" width="196.667" height="104" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="362.333" y="128" text-anchor="middle" font-size="11.8" fill="#334155" font-weight="700">Best single model</text>
  <text x="362.333" y="150" text-anchor="middle" font-size="10" fill="#475569">keep argmax ValAcc,</text>
  <text x="362.333" y="164" text-anchor="middle" font-size="10" fill="#475569">discard the other k − 1</text>
  <text x="362.333" y="194" text-anchor="middle" font-size="10" fill="#047857" font-weight="700">inference O(1)  ·  val O(k)</text>
  <rect x="484.667" y="106" width="196.667" height="104" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
  <text x="583" y="128" text-anchor="middle" font-size="11.8" fill="#b45309" font-weight="700">Logit ensemble</text>
  <text x="583" y="150" text-anchor="middle" font-size="10" fill="#475569">average the k output</text>
  <text x="583" y="164" text-anchor="middle" font-size="10" fill="#475569">logits at test time</text>
  <text x="583" y="194" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="700">inference O(k)  ·  val O(k)</text>
  <text x="472.667" y="162" text-anchor="middle" font-size="9.6" fill="#64748b">or</text>
  <rect x="705.333" y="106" width="196.667" height="104" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.9"/>
  <text x="803.667" y="128" text-anchor="middle" font-size="11.8" fill="#047857" font-weight="700">Model soup</text>
  <text x="803.667" y="150" text-anchor="middle" font-size="10" fill="#475569">average the k weight</text>
  <text x="803.667" y="164" text-anchor="middle" font-size="10" fill="#475569">vectors, keep one model</text>
  <text x="803.667" y="194" text-anchor="middle" font-size="10" fill="#047857" font-weight="700">inference O(1)  ·  val O(k)</text>
  <text x="693.333" y="162" text-anchor="middle" font-size="9.6" fill="#64748b">or</text>
  <text x="264" y="230" font-size="10" fill="#475569">greedy soup:  sort by ValAcc, then accept θ_i only if ValAcc( (Σ_{j in S} θ_j + θ_i) / (|S|+1) ) ≥ ValAcc(θ_S)</text>
  <rect x="22" y="260" width="470" height="220" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="38" y="281" font-size="12.5" fill="#6d28d9" font-weight="700">WHY LINEAR AVERAGING SURVIVES HERE</text>
  <text x="54" y="348" text-anchor="middle" font-size="11.5" fill="#334155" font-weight="700">θ₀</text>
  <rect x="70" y="340" width="8" height="8" rx="4" fill="#334155"/>
  <line x1="81" y1="340" x2="199" y2="312" stroke="#7c3aed" stroke-width="1.3" stroke-linecap="round" marker-end="url(#a7c3aed)"/>
  <line x1="81" y1="348" x2="199" y2="376" stroke="#7c3aed" stroke-width="1.3" stroke-linecap="round" marker-end="url(#a7c3aed)"/>
  <text x="130" y="320" text-anchor="middle" font-size="10.5" fill="#6d28d9" font-weight="700">δ₁</text>
  <text x="130" y="378" text-anchor="middle" font-size="10.5" fill="#6d28d9" font-weight="700">δ₂</text>
  <text x="223" y="312" text-anchor="middle" font-size="11.5" fill="#6d28d9" font-weight="700">θ₁</text>
  <text x="223" y="384" text-anchor="middle" font-size="11.5" fill="#6d28d9" font-weight="700">θ₂</text>
  <line x1="206" y1="308" x2="206" y2="380" stroke="#cbd5e1" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <rect x="202" y="340" width="8" height="8" rx="4" fill="#059669"/>
  <text x="226" y="348" text-anchor="middle" font-size="11.5" fill="#047857" font-weight="700">θ_S</text>
  <text x="104" y="348" text-anchor="middle" font-size="11" fill="#64748b" font-weight="700">Φ</text>
  <text x="252" y="310" font-size="9.8" fill="#475569">Adv = Acc((θ₁+θ₂)/2) − mean[Acc(θ₁), Acc(θ₂)]</text>
  <text x="252" y="323.5" font-size="9.8" fill="#475569">grows with the angle Φ between δ₁ and δ₂.</text>
  <text x="252" y="364" font-size="9.8" fill="#64748b">Augmentation and LR push Φ toward 90 deg;</text>
  <text x="252" y="377.5" font-size="9.8" fill="#64748b">changing the seed alone barely moves it.</text>
  <text x="38" y="418" font-size="9.6" fill="#64748b">A moderate LR keeps every θ_i inside one shared basin. At LR ≥ 10⁻⁴ (AdamW on ViT) models leave</text>
  <text x="38" y="431" font-size="9.6" fill="#64748b">the linear mode-connected regime and an error barrier appears — the greedy filter rejects them</text>
  <text x="38" y="444" font-size="9.6" fill="#64748b">automatically.</text>
  <rect x="510" y="260" width="408" height="220" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="526" y="281" font-size="12.5" fill="#b45309" font-weight="700">SOUP MINUS ENSEMBLE — TWO COMPETING TERMS</text>
  <rect x="524" y="296" width="380" height="34" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
  <text x="714" y="317" text-anchor="middle" font-size="11" fill="#b45309" font-weight="700">L_soup − L_ens ≈ α(1−α)/2 · ( −d²L_soup/dα²  +  β²·E[Var(Δf_Y)] )</text>
  <rect x="524" y="340" width="184" height="76" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="616" y="366.242" text-anchor="middle" font-size="10.8" fill="#047857" font-weight="700">loss convexity</text>
  <text x="616" y="382.242" text-anchor="middle" font-size="9.8" fill="#475569">Negative whenever the loss is</text>
  <text x="616" y="395.242" text-anchor="middle" font-size="9.8" fill="#475569">convex along α. Favours the soup.</text>
  <rect x="720" y="340" width="184" height="77.364" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="812" y="360.424" text-anchor="middle" font-size="10.8" fill="#b91c1c" font-weight="700">logit variance</text>
  <text x="812" y="376.424" text-anchor="middle" font-size="9.8" fill="#475569">Always ≥ 0, so it favours the</text>
  <text x="812" y="389.424" text-anchor="middle" font-size="9.8" fill="#475569">ensemble — but vanishes when Δf ≈</text>
  <text x="812" y="402.424" text-anchor="middle" font-size="9.8" fill="#475569">0 or predictions are confident.</text>
  <text x="524" y="441.364" font-size="9.6" fill="#64748b">Soups do not inherit the ensemble's calibration: ECE still needs post-hoc temperature</text>
  <text x="524" y="454.364" font-size="9.6" fill="#64748b">scaling.</text>
  <rect x="22" y="498" width="168" height="48" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="106" y="522.96" text-anchor="middle" font-size="15" fill="#047857" font-weight="700">90.94%</text>
  <text x="106" y="537" text-anchor="middle" font-size="9.2" fill="#64748b">ImageNet top-1, ViT-G/14</text>
  <rect x="204" y="498" width="168" height="48" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="288" y="522.96" text-anchor="middle" font-size="15" fill="#047857" font-weight="700">14 of 58</text>
  <text x="288" y="537" text-anchor="middle" font-size="9.2" fill="#64748b">ingredients kept</text>
  <rect x="386" y="498" width="168" height="48" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="470" y="522.96" text-anchor="middle" font-size="15" fill="#1d4ed8" font-weight="700">85.02%</text>
  <text x="470" y="537" text-anchor="middle" font-size="9.2" fill="#64748b">avg over 5 shift sets</text>
  <rect x="568" y="498" width="168" height="48" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="652" y="522.96" text-anchor="middle" font-size="15" fill="#1d4ed8" font-weight="700">+0.65 pp</text>
  <text x="652" y="537" text-anchor="middle" font-size="9.2" fill="#64748b">CLIP B/32 vs best single</text>
  <rect x="750" y="498" width="168" height="48" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="834" y="522.96" text-anchor="middle" font-size="15" fill="#6d28d9" font-weight="700">+6.4 pp</text>
  <text x="834" y="537" text-anchor="middle" font-size="9.2" fill="#64748b">CIFAR-100 zero-shot</text>
  <text x="470" y="572" text-anchor="middle" font-size="11" fill="#475569">Beats CoAtNet-7 (90.88%) with 25% fewer inference FLOPs, and the best individual oracle fine-tune (90.78%)</text>
  <defs>
    <marker id="a94a3b8" markerWidth="6" markerHeight="5.2" refX="5.6" refY="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.4,0.5 L5.8,2.6 L0.4,4.7 Z" fill="#94a3b8"/></marker>
    <marker id="a7c3aed" markerWidth="6" markerHeight="5.2" refX="5.6" refY="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.4,0.5 L5.8,2.6 L0.4,4.7 Z" fill="#7c3aed"/></marker>
  </defs>
</svg>
