<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 408" width="940" height="408" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="408" fill="#ffffff"/><text x="24.0" y="34.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">From router logits to mixing weights: five stages, one that can change the winners</text><text x="24.0" y="54.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Plain top-k routing; the gating function, renormalization and scale reshape weights but keep the ranking</text><rect x="24.0" y="80.0" width="160.8" height="133.4" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/><text x="34.0" y="100.6" font-size="12.5" font-weight="700" fill="#7f1d1d" text-anchor="start">1. Logits, in fp32</text><text x="34.0" y="122.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">One logit per expert. A</text><text x="34.0" y="137.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">bf16 router can round</text><text x="34.0" y="153.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">close logits into ties and</text><text x="34.0" y="168.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">flip which experts win: the</text><text x="34.0" y="184.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">one setting here that</text><text x="34.0" y="199.8" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">changes winners.</text><rect x="206.8" y="80.0" width="160.8" height="133.4" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="216.8" y="100.6" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">2. Gating function</text><text x="216.8" y="122.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">softmax, sigmoid or</text><text x="216.8" y="137.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">sqrt(softplus): same</text><text x="216.8" y="153.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">ranking, different weights.</text><text x="216.8" y="168.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">The expert bias needs</text><text x="216.8" y="184.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">sigmoid or sqrt(softplus).</text><rect x="389.6" y="80.0" width="160.8" height="133.4" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="399.6" y="100.6" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">3. Top-k selection</text><text x="399.6" y="122.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Each token keeps its k</text><text x="399.6" y="137.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">best. A balancing bias is</text><text x="399.6" y="153.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">added to the scores here,</text><text x="399.6" y="168.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">for selection only.</text><rect x="572.4" y="80.0" width="160.8" height="133.4" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="582.4" y="100.6" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="start">4. Renormalize</text><text x="582.4" y="122.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Rescale the k weights to</text><text x="582.4" y="137.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">sum to 1: loss 2.219 to</text><text x="582.4" y="153.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">2.183. Softmax at top-1</text><text x="582.4" y="168.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">needs pre-softmax, or the</text><text x="582.4" y="184.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">router gets no gradient.</text><rect x="755.2" y="80.0" width="160.8" height="133.4" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="765.2" y="100.6" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="start">5. Scale and mix</text><text x="765.2" y="122.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Multiply by the routed</text><text x="765.2" y="137.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">scaling factor (2.5 at k = 8</text><text x="765.2" y="153.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">in DeepSeek-V3, 1.0 at k</text><text x="765.2" y="168.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">= 16 in Kimi K3); a shared</text><text x="765.2" y="184.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">expert adds at weight 1.</text><line x1="187.8" y1="146.7" x2="203.8" y2="146.7" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="370.6" y1="146.7" x2="386.6" y2="146.7" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="553.4" y1="146.7" x2="569.4" y2="146.7" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="736.2" y1="146.7" x2="752.2" y2="146.7" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><text x="104.4" y="239.4" font-size="11.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">changes WHICH experts win</text><text x="561.4" y="239.4" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="middle">change HOW MUCH each chosen expert counts, and how big the output is</text><line x1="206.8" y1="247.4" x2="916.0" y2="247.4" stroke="#64748b" stroke-width="1"/><line x1="24.0" y1="247.4" x2="184.8" y2="247.4" stroke="#dc2626" stroke-width="1"/><text x="24.0" y="265.4" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Signal to watch</text><rect x="24.0" y="277.4" width="160.8" height="80.1" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="34.0" y="297.3" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">z-loss: the root of its</text><text x="34.0" y="312.8" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">logged value is the RMS</text><text x="34.0" y="328.3" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">logsumexp (20.9 means</text><text x="34.0" y="343.9" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">about 4.6). Fp32 flip rate.</text><rect x="206.8" y="277.4" width="160.8" height="80.1" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="216.8" y="297.3" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Top expert weight, routing</text><text x="216.8" y="312.8" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">entropy, and Max1/Max2,</text><text x="216.8" y="328.3" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">which falls toward 1 for a</text><text x="216.8" y="343.9" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">flat gate.</text><rect x="389.6" y="277.4" width="160.8" height="80.1" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="399.6" y="297.3" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">MaxVio per layer, from the</text><text x="399.6" y="312.8" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">token counts saved every</text><text x="399.6" y="328.3" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">n iterations.</text><rect x="572.4" y="277.4" width="160.8" height="80.1" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="582.4" y="297.3" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Routed output size per</text><text x="582.4" y="312.8" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">token, sqrt of the sum of</text><text x="582.4" y="328.3" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">squared weights.</text><rect x="755.2" y="277.4" width="160.8" height="80.1" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="765.2" y="297.3" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Shared expert's share,</text><text x="765.2" y="312.8" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">1/(1 + factor): 29% at 2.5,</text><text x="765.2" y="328.3" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">50% at 1.0.</text><text x="24.0" y="381.5" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Two things act on the gated scores before top-k and so can change the winners too: the expert bias (section 3) and group-limited routing (section 7). Recommendation:</text><text x="24.0" y="396.5" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">always --moe-router-dtype fp32; add --moe-z-loss-coeff 1e-3 for a softmax router whose logits drift up.</text></svg>