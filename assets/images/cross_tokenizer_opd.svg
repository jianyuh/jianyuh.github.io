<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="780" height="470" fill="#ffffff"/>
  <text x="390" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Three Ways to Bridge a Tokenizer Mismatch</text>

  <!-- the mismatch -->
  <rect x="30" y="46" width="720" height="96" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="68" font-size="13" font-weight="700" fill="#334155">Same bytes, different cuts</text>
  <text x="46" y="94" font-size="12" font-weight="600" fill="#dc2626">teacher</text>
  <g font-size="12" fill="#1e293b">
    <rect x="112" y="80" width="86" height="20" rx="4" fill="#fef2f2" stroke="#dc2626"/><text x="155" y="94" text-anchor="middle">un</text>
    <rect x="200" y="80" width="150" height="20" rx="4" fill="#fef2f2" stroke="#dc2626"/><text x="275" y="94" text-anchor="middle">amb</text>
    <rect x="352" y="80" width="118" height="20" rx="4" fill="#fef2f2" stroke="#dc2626"/><text x="411" y="94" text-anchor="middle">igu</text>
    <rect x="472" y="80" width="150" height="20" rx="4" fill="#fef2f2" stroke="#dc2626"/><text x="547" y="94" text-anchor="middle">ous</text>
  </g>
  <text x="46" y="126" font-size="12" font-weight="600" fill="#2563eb">student</text>
  <g font-size="12" fill="#1e293b">
    <rect x="112" y="112" width="140" height="20" rx="4" fill="#eff6ff" stroke="#2563eb"/><text x="182" y="126" text-anchor="middle">unam</text>
    <rect x="254" y="112" width="96" height="20" rx="4" fill="#eff6ff" stroke="#2563eb"/><text x="302" y="126" text-anchor="middle">b</text>
    <rect x="352" y="112" width="270" height="20" rx="4" fill="#eff6ff" stroke="#2563eb"/><text x="487" y="126" text-anchor="middle">iguous</text>
  </g>
  <text x="700" y="108" text-anchor="middle" font-size="11" fill="#64748b">no 1:1</text>
  <text x="700" y="122" text-anchor="middle" font-size="11" fill="#64748b">alignment</text>

  <line x1="390" y1="142" x2="390" y2="164" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- three columns -->
  <g>
    <rect x="24" y="170" width="236" height="212" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="142" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">SimCT</text>
    <text x="142" y="212" text-anchor="middle" font-size="11" fill="#7c3aed">minimal aligned units</text>
    <g font-size="11" fill="#1e293b">
      <rect x="42" y="226" width="46" height="18" rx="3" fill="#ffffff" stroke="#a78bfa"/><text x="65" y="239" text-anchor="middle">un</text>
      <rect x="92" y="226" width="46" height="18" rx="3" fill="#ffffff" stroke="#a78bfa"/><text x="115" y="239" text-anchor="middle">amb</text>
      <rect x="142" y="226" width="46" height="18" rx="3" fill="#ffffff" stroke="#a78bfa"/><text x="165" y="239" text-anchor="middle">igu</text>
      <rect x="192" y="226" width="46" height="18" rx="3" fill="#ffffff" stroke="#a78bfa"/><text x="215" y="239" text-anchor="middle">ous</text>
    </g>
    <text x="142" y="266" text-anchor="middle" font-size="11" fill="#475569">union boundaries → graph</text>
    <text x="142" y="282" text-anchor="middle" font-size="11" fill="#475569">connected components</text>
    <text x="142" y="304" text-anchor="middle" font-size="11.5" fill="#334155">softmax over</text>
    <text x="142" y="320" text-anchor="middle" font-size="11.5" fill="#334155">length-normalized logL</text>
    <text x="142" y="346" text-anchor="middle" font-size="11" fill="#64748b">coarsening = provable KL loss</text>
    <text x="142" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">+5.0 avg@8</text>
  </g>

  <g>
    <rect x="272" y="170" width="236" height="212" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="390" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Chunk Alignment</text>
    <text x="390" y="212" text-anchor="middle" font-size="11" fill="#2563eb">dual-pointer sync points</text>
    <g font-size="11" fill="#1e293b">
      <rect x="290" y="226" width="96" height="18" rx="3" fill="#ffffff" stroke="#60a5fa"/><text x="338" y="239" text-anchor="middle">chunk 1</text>
      <rect x="392" y="226" width="98" height="18" rx="3" fill="#ffffff" stroke="#60a5fa"/><text x="441" y="239" text-anchor="middle">chunk 2</text>
    </g>
    <text x="390" y="266" text-anchor="middle" font-size="11" fill="#475569">teacher gives one scalar</text>
    <text x="390" y="282" text-anchor="middle" font-size="11" fill="#475569">budget per chunk</text>
    <text x="390" y="304" text-anchor="middle" font-size="11.5" fill="#334155">Lagrange projection onto</text>
    <text x="390" y="320" text-anchor="middle" font-size="11.5" fill="#334155">student log-prior</text>
    <text x="390" y="346" text-anchor="middle" font-size="11" fill="#64748b">collapses to per-token at m=1</text>
    <text x="390" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">+5.6 avg@8</text>
  </g>

  <g>
    <rect x="520" y="170" width="236" height="212" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="638" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Byte-Prefix Marg.</text>
    <text x="638" y="212" text-anchor="middle" font-size="11" fill="#059669">scatter onto all of V_S</text>
    <g font-size="10.5" fill="#1e293b">
      <rect x="538" y="226" width="150" height="18" rx="3" fill="#ffffff" stroke="#34d399"/><text x="613" y="239" text-anchor="middle">V_S  (every coordinate)</text>
      <rect x="694" y="226" width="44" height="18" rx="3" fill="#ffffff" stroke="#94a3b8"/><text x="716" y="239" text-anchor="middle">∅</text>
    </g>
    <text x="638" y="266" text-anchor="middle" font-size="11" fill="#475569">longest byte-prefix trie φ</text>
    <text x="638" y="282" text-anchor="middle" font-size="11" fill="#475569">+ chain-rule spanning fix</text>
    <text x="638" y="304" text-anchor="middle" font-size="11.5" fill="#334155">complete (D1) &amp; mass-</text>
    <text x="638" y="320" text-anchor="middle" font-size="11.5" fill="#334155">preserving (D3)</text>
    <text x="638" y="346" text-anchor="middle" font-size="11" fill="#dc2626">needs whitespace-row mask</text>
    <text x="638" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">+5.9 to +6.6 avg@8</text>
  </g>

  <!-- bottom note -->
  <rect x="24" y="398" width="732" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="42" y="420" font-size="12.5" font-weight="700" fill="#b91c1c">Shared pitfall: the stop token</text>
  <text x="42" y="440" font-size="11.5" fill="#475569">If "teacher wants to stop" is not mapped to the student's realized EOS, the student runs to the max-token cap. Fix: a forward-KL stop bridge.</text>
</svg>
