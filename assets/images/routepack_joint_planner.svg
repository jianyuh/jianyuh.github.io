<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 546" width="920" height="546" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="920" height="546" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="700">RoutePack: joint planning for attention and expert balance</text>
  <rect x="278" y="62" width="620" height="193.82" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="588" y="88" text-anchor="middle" font-size="13" fill="#334155" font-weight="700">Hierarchical control plane</text>
  <text x="588" y="106" text-anchor="middle" font-size="10.5" fill="#64748b">one pass, three nested decisions, all before the step runs</text>
  <rect x="22" y="62" width="236" height="193.82" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="140" y="94.14" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="700">Rollout metadata</text>
  <text x="140" y="110.33" text-anchor="middle" font-size="10.5" fill="#64748b">R3 exposes the exact future training</text>
  <text x="140" y="124.33" text-anchor="middle" font-size="10.5" fill="#64748b">batch before the optimizer step begins</text>
  <rect x="40" y="139.48" width="200" height="30" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="140" y="158.155" text-anchor="middle" font-size="10.5" fill="#1d4ed8">sequence lengths  t_i</text>
  <rect x="40" y="175.48" width="200" height="30" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="140" y="194.155" text-anchor="middle" font-size="10.5" fill="#1d4ed8">routing decisions  a_i,l,e</text>
  <text x="140" y="219.67" text-anchor="middle" font-size="10.5" fill="#475569">Perfect foresight: the planner optimises</text>
  <text x="140" y="234.67" text-anchor="middle" font-size="10.5" fill="#475569">before the step, not after it.</text>
  <rect x="288" y="118" width="192" height="121.82" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="384" y="145.36" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="700">1. Expert placement</text>
  <text x="384" y="163.316" text-anchor="middle" font-size="10.2" fill="#475569">layer-wise LPT on per-expert load</text>
  <text x="384" y="178.332" text-anchor="middle" font-size="10.2" fill="#475569">fix the placement π before packing</text>
  <text x="384" y="193.348" text-anchor="middle" font-size="10.2" fill="#475569">copy params and optimizer state</text>
  <text x="384" y="208.364" text-anchor="middle" font-size="10.2" fill="#475569">rebuild the dispatch inverse map</text>
  <rect x="492" y="118" width="192" height="121.82" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="588" y="145.36" text-anchor="middle" font-size="12" fill="#6d28d9" font-weight="700">2. Minimum row finder</text>
  <text x="588" y="163.316" text-anchor="middle" font-size="10.2" fill="#475569">find the smallest feasible R*</text>
  <text x="588" y="178.332" text-anchor="middle" font-size="10.2" fill="#475569">respect the token capacity C</text>
  <text x="588" y="193.348" text-anchor="middle" font-size="10.2" fill="#475569">score max U_g, then Σ U_g,</text>
  <text x="588" y="208.364" text-anchor="middle" font-size="10.2" fill="#475569">then the worst tail J_r,g</text>
  <rect x="696" y="118" width="192" height="121.82" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="792" y="145.36" text-anchor="middle" font-size="12" fill="#047857" font-weight="700">3. Packing search</text>
  <text x="792" y="163.316" text-anchor="middle" font-size="10.2" fill="#475569">seed from length + EDP heuristics</text>
  <text x="792" y="178.332" text-anchor="middle" font-size="10.2" fill="#475569">sliced-Wasserstein de-duplication</text>
  <text x="792" y="193.348" text-anchor="middle" font-size="10.2" fill="#475569">Population-SA moves stragglers</text>
  <text x="792" y="208.364" text-anchor="middle" font-size="10.2" fill="#475569">best-layout archive, no regression</text>
  <line x1="261" y1="178.91" x2="284" y2="178.91" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw94a3b8)"/>
  <line x1="482" y1="178.91" x2="489" y2="178.91" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw94a3b8)"/>
  <line x1="686" y1="178.91" x2="693" y2="178.91" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw94a3b8)"/>
  <rect x="22" y="275.82" width="236" height="248.74" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="140" y="307.96" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="700">If the two are packed separately</text>
  <text x="140" y="324.15" text-anchor="middle" font-size="10.5" fill="#64748b">an attention tail or an expert-parallel</text>
  <text x="140" y="338.15" text-anchor="middle" font-size="10.5" fill="#64748b">hotspot always survives</text>
  <line x1="38" y1="363.3" x2="242" y2="363.3" stroke="#dc2626" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="4 3"/>
  <text x="242" y="358.3" text-anchor="end" font-size="9.2" fill="#b91c1c" font-weight="700">step time</text>
  <rect x="50" y="406.5" width="20" height="36.8" rx="3" fill="#cbd5e1" stroke="none" stroke-width="1.4"/>
  <rect x="82" y="396.9" width="20" height="46.4" rx="3" fill="#cbd5e1" stroke="none" stroke-width="1.4"/>
  <rect x="114" y="401.7" width="20" height="41.6" rx="3" fill="#cbd5e1" stroke="none" stroke-width="1.4"/>
  <rect x="146" y="363.3" width="20" height="80" rx="3" fill="#dc2626" stroke="none" stroke-width="1.4"/>
  <rect x="178" y="404.1" width="20" height="39.2" rx="3" fill="#cbd5e1" stroke="none" stroke-width="1.4"/>
  <rect x="210" y="393.7" width="20" height="49.6" rx="3" fill="#cbd5e1" stroke="none" stroke-width="1.4"/>
  <line x1="38" y1="443.3" x2="242" y2="443.3" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <text x="140" y="457.3" text-anchor="middle" font-size="9.5" fill="#64748b">cost per rank</text>
  <text x="140" y="479.49" text-anchor="middle" font-size="10.5" fill="#475569">Local heuristics only move the bottleneck</text>
  <text x="140" y="494.49" text-anchor="middle" font-size="10.5" fill="#475569">from one resource to the other.</text>
  <rect x="278" y="275.82" width="620" height="248.74" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="588" y="307.96" text-anchor="middle" font-size="13" fill="#334155" font-weight="700">Joint cost model</text>
  <text x="588" y="324.15" text-anchor="middle" font-size="10.5" fill="#64748b">one layout is scored against both costs at once</text>
  <text x="588" y="350.27" text-anchor="middle" font-size="11.5" fill="#475569">Attention cost A = max over microbatches of (α T + β Q)</text>
  <text x="588" y="366.69" text-anchor="middle" font-size="11.5" fill="#475569">Expert cost E = Σ over layers of max over ranks of W</text>
  <text x="424" y="402.74" text-anchor="end" font-size="10.5" fill="#475569">Packed separately</text>
  <rect x="436" y="386.14" width="125.842" height="26" rx="4" fill="#2563eb" stroke="none" stroke-width="1.4"/>
  <rect x="561.842" y="386.14" width="232.158" height="26" rx="4" fill="#059669" stroke="none" stroke-width="1.4"/>
  <text x="498.921" y="402.54" text-anchor="middle" font-size="9.5" fill="#ffffff" font-weight="700">attention</text>
  <text x="677.921" y="402.54" text-anchor="middle" font-size="9.5" fill="#ffffff" font-weight="700">expert-parallel</text>
  <text x="804" y="402.74" font-size="10" fill="#94a3b8" font-weight="700">total 330</text>
  <text x="424" y="444.74" text-anchor="end" font-size="10.5" fill="#475569">RoutePack layout</text>
  <rect x="436" y="428.14" width="143.2" height="26" rx="4" fill="#2563eb" stroke="none" stroke-width="1.4"/>
  <rect x="579.2" y="428.14" width="151.879" height="26" rx="4" fill="#059669" stroke="none" stroke-width="1.4"/>
  <text x="507.6" y="444.54" text-anchor="middle" font-size="9.5" fill="#ffffff" font-weight="700">attention</text>
  <text x="655.139" y="444.54" text-anchor="middle" font-size="9.5" fill="#ffffff" font-weight="700">expert-parallel</text>
  <text x="741.079" y="444.74" font-size="10" fill="#059669" font-weight="700">total 272</text>
  <text x="588" y="474.14" text-anchor="middle" font-size="9.5" fill="#64748b">schematic: a little more attention, much less expert tail</text>
  <text x="588" y="499.11" text-anchor="middle" font-size="11.5" fill="#047857" font-weight="700">The best layout may spend a little more attention time to cut the expert-parallel tail by much more.</text>
  <defs>
    <marker id="arw94a3b8" markerWidth="9" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.8 L8.5,4 L0.5,7.2 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
