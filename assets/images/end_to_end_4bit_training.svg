<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 357" width="940" height="357" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="357" fill="#ffffff"/><text x="20.0" y="32.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">A mixed-precision recipe for end-to-end training</text><text x="20.0" y="54.0" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">Use 4-bit where it buys the most, preserve gradient quality, and compress the traffic around the experts</text><rect x="20.0" y="76.0" width="436.0" height="78.6" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="32.0" y="99.9" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start">1. MoE forward</text><text x="32.0" y="122.1" font-size="12" font-weight="400" fill="#334155" text-anchor="start">NVFP4 block-scaled GEMMs with 16 values per scale block, running on</text><text x="32.0" y="138.3" font-size="12" font-weight="400" fill="#334155" text-anchor="start">specialized GB300 kernels</text><line x1="460.0" y1="115.3" x2="480.0" y2="115.3" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="484.0" y="76.0" width="436.0" height="78.6" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="496.0" y="99.9" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="start">2. Backward pass</text><text x="496.0" y="122.1" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Dequantize saved tensors, transpose in higher precision, then</text><text x="496.0" y="138.3" font-size="12" font-weight="400" fill="#334155" text-anchor="start">stochastically re-quantize to MXFP8 for gradient GEMMs</text><rect x="20.0" y="172.6" width="900.0" height="76.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="32.0" y="195.7" font-size="13" font-weight="700" fill="#14532d" text-anchor="start">3. Expert communication spans both passes</text><text x="32.0" y="217.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Dispatch tokens in NVFP4 and send quantized forward activations for weight gradients. For combine, apply a 32D random Hadamard transform, quantize to</text><text x="32.0" y="232.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">block-scaled S2F6, then invert the transform after aggregation.</text><text x="30.0" y="270.6" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">At up to 15 PFLOPS and 900 GB/s NVLink, compute can outrun incoming bytes. Smaller dispatch payloads and an 8.25-bit combine reduce idle time.</text><rect x="20.0" y="285.6" width="441.0" height="55.8" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="30.0" y="306.2" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="start">Pretraining</text><text x="30.0" y="327.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">8% wall-clock speedup vs. full MXFP8; about 2% lower compute efficiency</text><rect x="479.0" y="285.6" width="441.0" height="55.8" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="489.0" y="306.2" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="start">RL</text><text x="489.0" y="327.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">20% speedup vs. full MXFP8, with no discernible reward difference</text></svg>