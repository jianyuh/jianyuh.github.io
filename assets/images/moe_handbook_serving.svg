<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 488" width="940" height="488" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="488" fill="#ffffff"/><text x="24.0" y="34.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">After training: what serving changes for an MoE</text><text x="24.0" y="54.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Fewer experts per token, fewer bits per expert, and more GPUs per expert group</text><rect x="24.0" y="74.0" width="450.0" height="400.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><text x="38.0" y="98.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">A. Serve top-4 on a model trained at top-8</text><text x="38.0" y="116.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Qwen3.6-35B-A3B, 256 experts, 81.65% MMLU at top-8. The denominator</text><text x="38.0" y="131.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">sets each survivor's weight.</text><text x="38.0" y="176.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Renormalize over the 4 survivors</text><rect x="396.6" y="184.0" width="57.4" height="14.0" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="390.6" y="195.0" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="end">-4.65</text><text x="38.0" y="230.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Divide by the top-8 softmax mass</text><rect x="415.7" y="238.0" width="38.3" height="14.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="409.7" y="249.0" font-size="12" font-weight="700" fill="#78350f" text-anchor="end">-3.10</text><text x="38.0" y="284.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Divide by the top-16 softmax mass</text><rect x="449.7" y="292.0" width="4.3" height="14.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="443.7" y="303.0" font-size="12" font-weight="700" fill="#14532d" text-anchor="end">-0.35</text><text x="405.1" y="303.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">not significant (p = 0.66)</text><text x="38.0" y="338.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">No renormalization, at top-6</text><rect x="115.1" y="346.0" width="338.9" height="14.0" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="109.1" y="357.0" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="end">-27.45</text><line x1="83.6" y1="380.0" x2="454.0" y2="380.0" stroke="#64748b" stroke-width="1"/><line x1="83.6" y1="380.0" x2="83.6" y2="384.0" stroke="#64748b" stroke-width="1"/><text x="83.6" y="396.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">-30</text><line x1="207.0" y1="380.0" x2="207.0" y2="384.0" stroke="#64748b" stroke-width="1"/><text x="207.0" y="396.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">-20</text><line x1="330.5" y1="380.0" x2="330.5" y2="384.0" stroke="#64748b" stroke-width="1"/><text x="330.5" y="396.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">-10</text><line x1="454.0" y1="380.0" x2="454.0" y2="384.0" stroke="#64748b" stroke-width="1"/><text x="454.0" y="396.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">0</text><text x="268.8" y="412.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">MMLU points vs trained top-8</text><text x="38.0" y="434.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Top-4 halves activated routed parameters, 1.006B to 0.503B per token. The</text><text x="38.0" y="449.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">router is flat: its top 8 hold only 0.182 of the softmax mass.</text><rect x="492.0" y="74.0" width="424.0" height="178.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><text x="506.0" y="98.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">B. Routed experts in 4 bits (gpt-oss-20b)</text><text x="506.0" y="116.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Memory shrinks 3x; bytes read per decode token only halve</text><text x="506.0" y="161.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Model size</text><rect x="655.7" y="145.0" width="172.3" height="12.0" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="834.0" y="155.0" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="start">39 GiB bf16</text><rect x="655.7" y="161.0" width="56.6" height="12.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="718.2" y="171.0" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="start">12.8 GiB 4-bit</text><text x="506.0" y="207.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Read per decode token</text><rect x="655.7" y="191.0" width="29.7" height="12.0" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="691.3" y="201.0" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="start">6.72 GiB bf16</text><rect x="655.7" y="207.0" width="15.2" height="12.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="676.9" y="217.0" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="start">3.45 GiB 4-bit</text><rect x="492.0" y="266.0" width="424.0" height="208.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><text x="506.0" y="290.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">C. Decode at EP64 vs EP8 (DeepSeek-V4.1-Flash)</text><text x="506.0" y="308.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">64 requests/GPU; 7 routed experts per GPU at EP64, 52 at EP8</text><text x="506.0" y="353.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Tokens/s per GPU</text><rect x="625.8" y="337.0" width="198.6" height="12.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="830.4" y="347.0" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="start">EP64 15,700</text><rect x="625.8" y="353.0" width="159.4" height="12.0" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="791.2" y="363.0" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="start">EP8 12,600</text><text x="506.0" y="399.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">Tokens/s per user</text><rect x="625.8" y="383.0" width="198.6" height="12.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="830.4" y="393.0" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="start">EP64 246</text><rect x="625.8" y="399.0" width="159.8" height="12.0" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="791.6" y="409.0" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="start">EP8 198</text><text x="506.0" y="433.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Both about 25% higher at EP64. At 256 requests per GPU they nearly</text><text x="506.0" y="448.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">meet: 26,300 vs 24,900.</text></svg>