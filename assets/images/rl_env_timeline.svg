<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 457" width="940" height="457" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="457" fill="#ffffff"/><text x="20.0" y="34.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">RL environments: the environment comes first, the breakthrough later</text><text x="20.0" y="56.0" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">From Atari to terminals, everything still speaks some version of Gym's reset() / step() contract</text><text x="124.0" y="84.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">time -&gt;</text><rect x="20.0" y="94.0" width="92.0" height="46.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="66.0" y="122.0" font-size="13.5" font-weight="700" fill="#1e293b" text-anchor="middle">Games</text><rect x="124.0" y="94.0" width="191.5" height="46.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><text x="132.0" y="113.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">2012 ALE</text><text x="132.0" y="130.0" font-size="11" font-weight="400" fill="#334155" text-anchor="start">Atari as a platform</text><rect x="325.5" y="94.0" width="191.5" height="46.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><text x="333.5" y="113.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">2013 DQN</text><text x="333.5" y="130.0" font-size="11" font-weight="400" fill="#334155" text-anchor="start">learns from pixels</text><rect x="527.0" y="94.0" width="191.5" height="46.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><text x="535.0" y="113.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">2016 OpenAI Gym</text><text x="535.0" y="130.0" font-size="11" font-weight="400" fill="#334155" text-anchor="start">reset() / step()</text><rect x="728.5" y="94.0" width="191.5" height="46.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><text x="736.5" y="113.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">2016 Universe</text><text x="736.5" y="130.0" font-size="11" font-weight="400" fill="#334155" text-anchor="start">pixels, keyboard, mouse</text><rect x="20.0" y="150.0" width="92.0" height="46.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="66.0" y="178.0" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Web</text><rect x="267.3" y="150.0" width="155.7" height="46.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="275.3" y="169.0" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">2017 World of Bits</text><text x="275.3" y="186.0" font-size="11" font-weight="400" fill="#334155" text-anchor="start">web part of Universe</text><rect x="433.0" y="150.0" width="155.7" height="46.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="441.0" y="169.0" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">2018 MiniWoB++</text><text x="441.0" y="186.0" font-size="11" font-weight="400" fill="#334155" text-anchor="start">harder tasks, demos</text><rect x="598.6" y="150.0" width="155.7" height="46.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="606.6" y="169.0" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">2022 WebShop</text><text x="606.6" y="186.0" font-size="11" font-weight="400" fill="#334155" text-anchor="start">page as text</text><rect x="764.3" y="150.0" width="155.7" height="46.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="772.3" y="169.0" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">2023 WebArena</text><text x="772.3" y="186.0" font-size="11" font-weight="400" fill="#334155" text-anchor="start">self-hosted sites</text><rect x="20.0" y="206.0" width="92.0" height="46.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="66.0" y="234.0" font-size="13.5" font-weight="700" fill="#14532d" text-anchor="middle">Code</text><rect x="442.4" y="206.0" width="152.5" height="46.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="450.4" y="225.0" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="start">2023 SWE-bench</text><text x="450.4" y="242.0" font-size="11" font-weight="400" fill="#334155" text-anchor="start">real issues, repo tests</text><rect x="604.9" y="206.0" width="152.5" height="46.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="612.9" y="225.0" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="start">2024 SWE-Gym</text><text x="612.9" y="242.0" font-size="11" font-weight="400" fill="#334155" text-anchor="start">benchmark -&gt; gym</text><rect x="767.5" y="206.0" width="152.5" height="46.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/><text x="775.5" y="225.0" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="start">2025 Terminal-Bench</text><text x="775.5" y="242.0" font-size="11" font-weight="400" fill="#334155" text-anchor="start">the terminal</text><rect x="20.0" y="266.0" width="900.0" height="44.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="32.0" y="284.0" font-size="13.5" font-weight="700" fill="#78350f" text-anchor="start">October 2025: OpenEnv</text><text x="32.0" y="301.0" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Gym's reset() / step() for LLM agents, served over HTTP and shared on the Hub; open governance, 20+ organizations</text><text x="20.0" y="344.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">What Universe was missing in 2016, and what arrived separately over the next decade</text><rect x="20.0" y="358.0" width="172.0" height="83.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="30.0" y="379.0" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">A model worth starting</text><text x="30.0" y="395.0" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">from</text><text x="30.0" y="415.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">pretrained, already follows</text><text x="30.0" y="430.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">instructions and calls tools</text><rect x="202.0" y="358.0" width="172.0" height="83.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="212.0" y="379.0" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">Tasks within reach</text><text x="212.0" y="399.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">some attempts succeed, so</text><text x="212.0" y="414.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">sparse rewards carry signal</text><rect x="384.0" y="358.0" width="172.0" height="83.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="394.0" y="379.0" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">Text and tool interfaces</text><text x="394.0" y="399.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">not pixels: easier to explore,</text><text x="394.0" y="414.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">read and verify</text><rect x="566.0" y="358.0" width="172.0" height="83.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="576.0" y="379.0" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">A sparse-reward recipe</text><text x="576.0" y="399.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">GRPO family plus verifiable</text><text x="576.0" y="414.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">rewards, 2024 to 2025</text><rect x="748.0" y="358.0" width="172.0" height="83.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="758.0" y="379.0" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">Cheap sandboxes at</text><text x="758.0" y="395.0" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">scale</text><text x="758.0" y="415.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">thousands of long, stateful</text><text x="758.0" y="430.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">rollouts in a training loop</text></svg>