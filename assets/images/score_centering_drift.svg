<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 722" width="940" height="722" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="940" height="722" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="17.5" fill="#0f172a" font-weight="700">Score Centering: the off-policy gradient contains a hidden distillation term</text>
  <text x="470" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">Subtract the sampler's expected score at every prefix and the drift cancels exactly - no ratios, no clipping, no hyperparameters</text>
  <rect x="22" y="68" width="896" height="258" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="38" y="89" font-size="12.5" fill="#b91c1c" font-weight="700">WHY OFF-POLICY RL COLLAPSES AND SFT DOES NOT</text>
  <rect x="38" y="102" width="864" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="470" y="126" text-anchor="middle" font-size="11" fill="#334155" font-weight="700">on-policy:   E_p[s] = sum_v p_v grad log p_v = grad ( sum_v p_v ) = grad(1) = 0        so a constant reward moves nothing</text>
  <rect x="38" y="152" width="864" height="40" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.7"/>
  <text x="470" y="177" text-anchor="middle" font-size="12.5" fill="#b91c1c" font-weight="700">off-policy under mismatch:   E_q[ R s ]  =  E_q[R] s-bar   +   Cov_q(R, s)</text>
  <line x1="545.369" y1="195" x2="545.369" y2="201" stroke="#dc2626" stroke-width="1.1" stroke-linecap="round"/>
  <text x="545.369" y="213" text-anchor="middle" font-size="10.5" fill="#b91c1c" font-weight="700">DRIFT</text>
  <line x1="644.712" y1="195" x2="644.712" y2="201" stroke="#059669" stroke-width="1.1" stroke-linecap="round"/>
  <text x="644.712" y="213" text-anchor="middle" font-size="10.5" fill="#047857" font-weight="700">SIGNAL</text>
  <rect x="38" y="224" width="277.333" height="86" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="50" y="243" font-size="10.6" fill="#b91c1c" font-weight="700">the drift term is an SFT loss</text>
  <text x="50" y="260.5" font-size="9.5" fill="#475569">s-bar = sum_v q_v grad log p_v is exactly the negative</text>
  <text x="50" y="272.9" font-size="9.5" fill="#475569">gradient of cross-entropy with q as the teacher. RL quietly</text>
  <text x="50" y="285.3" font-size="9.5" fill="#475569">distils the trainer toward the sampler at every prefix, scaled</text>
  <text x="50" y="297.7" font-size="9.5" fill="#475569">by E_q[R].</text>
  <rect x="331.333" y="224" width="277.333" height="86" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
  <text x="343.333" y="243" font-size="10.6" fill="#b45309" font-weight="700">and the teacher is refreshed from the student</text>
  <text x="343.333" y="260.5" font-size="9.5" fill="#475569">sampler bias -&gt; distilled into trainer -&gt; synced back into</text>
  <text x="343.333" y="272.9" font-size="9.5" fill="#475569">sampler -&gt; amplified. Offline distillation has a fixed teacher;</text>
  <text x="343.333" y="285.3" font-size="9.5" fill="#475569">here the loop is positive feedback, so collapse is sudden.</text>
  <rect x="624.667" y="224" width="277.333" height="86" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="636.667" y="243" font-size="10.6" fill="#6d28d9" font-weight="700">group centering does not reach it</text>
  <text x="636.667" y="260.5" font-size="9.5" fill="#475569">GRPO makes R sum to zero over a prompt group. The drift</text>
  <text x="636.667" y="272.9" font-size="9.5" fill="#475569">uses E_q[R] conditioned on one prefix, which stays</text>
  <text x="636.667" y="285.3" font-size="9.5" fill="#475569">non-zero exactly where the prefix discriminates good from</text>
  <text x="636.667" y="297.7" font-size="9.5" fill="#475569">bad continuations.</text>
  <rect x="22" y="342" width="470" height="252" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="38" y="363" font-size="12.5" fill="#047857" font-weight="700">THE CORRECTION</text>
  <rect x="38" y="378" width="438" height="96" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
  <text x="257" y="400" text-anchor="middle" font-size="13" fill="#047857" font-weight="700">s-tilde = s - s-bar</text>
  <text x="257" y="422" text-anchor="middle" font-size="11.5" fill="#475569">E_q[ s-tilde ] = s-bar - s-bar = 0</text>
  <text x="257" y="446" text-anchor="middle" font-size="11.5" fill="#047857" font-weight="700">E_q[ R s-tilde ] = Cov_q(R, s)</text>
  <text x="257" y="464" text-anchor="middle" font-size="9.6" fill="#64748b">drift gone exactly, at every prefix</text>
  <text x="38" y="496" font-size="9.6" fill="#64748b" font-weight="700"></text>
  <text x="212" y="496" font-size="9.6" fill="#b45309" font-weight="700">importance sampling</text>
  <text x="470" y="496" text-anchor="end" font-size="9.6" fill="#047857" font-weight="700">score centering</text>
  <line x1="38" y1="502" x2="476" y2="502" stroke="#cbd5e1" stroke-width="1.1" stroke-linecap="round"/>
  <text x="38" y="518" font-size="9.5" fill="#64748b">correction</text>
  <text x="212" y="518" font-size="9.5" fill="#b45309">ratio p_v / q_v</text>
  <text x="470" y="518" text-anchor="end" font-size="9.5" fill="#047857">subtract s-bar</text>
  <text x="38" y="535" font-size="9.5" fill="#64748b">variance</text>
  <text x="212" y="535" font-size="9.5" fill="#b45309">blows up on rare tokens</text>
  <text x="470" y="535" text-anchor="end" font-size="9.5" fill="#047857">none added</text>
  <text x="38" y="552" font-size="9.5" fill="#64748b">clipping</text>
  <text x="212" y="552" font-size="9.5" fill="#b45309">needed - and reintroduces drift</text>
  <text x="470" y="552" text-anchor="end" font-size="9.5" fill="#047857">not needed</text>
  <text x="38" y="573" font-size="9.5" fill="#475569">They compose: IS corrects the shift, SC removes the residual pull.</text>
  <rect x="510" y="342" width="408" height="252" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="526" y="363" font-size="12.5" fill="#1d4ed8" font-weight="700">MAKING IT AFFORDABLE</text>
  <text x="524" y="384" font-size="9.8" fill="#64748b">s-bar sums over a 152K vocabulary at every token. Storing full sampler logprobs for</text>
  <text x="524" y="397" font-size="9.8" fill="#64748b">one RL batch is tens of terabytes.</text>
  <rect x="524" y="416" width="380" height="112" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="714" y="438" text-anchor="middle" font-size="9.8" fill="#64748b">log only the top k sampler probs (k = 32 or 128); call that head H</text>
  <text x="714" y="454" text-anchor="middle" font-size="9.8" fill="#475569">model the tail with trainer probs, rescaled:  q-hat_v = rho p_v  for v in T</text>
  <text x="714" y="470" text-anchor="middle" font-size="10.2" fill="#475569">E_qhat[s] = sum_H q_v s_v + rho ( sum_V p_v s_v  -  sum_H p_v s_v )</text>
  <text x="714" y="486" text-anchor="middle" font-size="9.8" fill="#6d28d9">and sum_V p_v s_v = 0  -  the same identity that created the drift</text>
  <text x="714" y="502" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-weight="700">E_qhat[s] = sum_H ( q_v - rho p_v ) s_v</text>
  <text x="714" y="521" text-anchor="middle" font-size="9.6" fill="#64748b">the full-vocabulary sum collapses to k head terms</text>
  <rect x="524" y="544" width="380" height="40" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="714" y="562" text-anchor="middle" font-size="10.8" fill="#6d28d9" font-weight="700">L_SC = - R ( log p_yt  -  sum_H sg[ q_v - rho p_v ] log p_v )</text>
  <text x="714" y="577" text-anchor="middle" font-size="9.4" fill="#64748b">a scalar loss; autograd recovers R ( s - s-bar )</text>
  <text x="22" y="614" font-size="10.5" fill="#0f172a" font-weight="700">Qwen3-30B-A3B, INTELLECT-2 math, INT8 W/A + INT4 KV cache</text>
  <rect x="22" y="628" width="168" height="48" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="106" y="652.96" text-anchor="middle" font-size="15" fill="#b91c1c" font-weight="700">~0%</text>
  <text x="106" y="667" text-anchor="middle" font-size="9" fill="#64748b">PPO, DAPO, GSPO, TOPR, DPPO</text>
  <rect x="204" y="628" width="168" height="48" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
  <text x="288" y="652.96" text-anchor="middle" font-size="15" fill="#b45309" font-weight="700">12%</text>
  <text x="288" y="667" text-anchor="middle" font-size="9" fill="#64748b">truncated IS</text>
  <rect x="386" y="628" width="168" height="48" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="470" y="652.96" text-anchor="middle" font-size="15" fill="#047857" font-weight="700">30%</text>
  <text x="470" y="667" text-anchor="middle" font-size="9" fill="#64748b">score centering</text>
  <rect x="568" y="628" width="168" height="48" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="652" y="652.96" text-anchor="middle" font-size="15" fill="#1d4ed8" font-weight="700">TIS + SC</text>
  <text x="652" y="667" text-anchor="middle" font-size="9" fill="#64748b">best under staleness</text>
  <rect x="750" y="628" width="168" height="48" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="834" y="652.96" text-anchor="middle" font-size="15" fill="#6d28d9" font-weight="700">&lt;1%</text>
  <text x="834" y="667" text-anchor="middle" font-size="9" fill="#64748b">wall-clock overhead</text>
  <text x="470" y="700" text-anchor="middle" font-size="11" fill="#475569">The failure mode is a compounding bias, not gradient variance - which is why every variance-reduction fix underperforms here.</text>
</svg>
