  <text x="470" y="32" text-anchor="middle" font-size="17.5" fill="#0f172a" font-weight="700">TailSFT: stop fitting what SFT already fit, keep the tail for RL</text>
  <text x="470" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">Mask the examples whose loss fell furthest below their base-model loss; train on the rest</text>
  <rect x="22" y="68" width="896" height="232" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="38" y="89" font-size="12.5" fill="#1d4ed8" font-weight="700">ONE STEP: RANK THE BATCH BY m = l_t - l_0, MASK THE MOST NEGATIVE γ</text>
  <text x="38" y="120" font-size="10.2" fill="#1d4ed8" font-weight="700">once</text>
  <text x="108" y="120" font-size="9.6" fill="#475569">score D with the base model: l_0(x) =</text>
  <text x="108" y="133.4" font-size="9.6" fill="#475569">per-token loss under π₀</text>
  <text x="38" y="152.8" font-size="10.2" fill="#1d4ed8" font-weight="700">each step</text>
  <text x="108" y="152.8" font-size="9.6" fill="#475569">l_t(x) from the SFT forward pass; margin</text>
  <text x="108" y="166.2" font-size="9.6" fill="#475569">m = l_t - l_0</text>
  <text x="38" y="185.6" font-size="10.2" fill="#1d4ed8" font-weight="700">mask</text>
  <text x="108" y="185.6" font-size="9.6" fill="#475569">drop the γ_t fraction with most negative m</text>
  <text x="108" y="199" font-size="9.6" fill="#475569">(fit hardest vs. base)</text>
  <text x="38" y="218.4" font-size="10.2" fill="#1d4ed8" font-weight="700">train</text>
  <text x="108" y="218.4" font-size="9.6" fill="#475569">token-averaged cross-entropy on the</text>
  <text x="108" y="231.8" font-size="9.6" fill="#475569">retained examples only</text>
