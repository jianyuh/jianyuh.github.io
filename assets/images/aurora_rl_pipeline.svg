<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 492" width="940" height="492" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="940" height="492" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="700">AuroraRL: Collapsing the Weight-Sync Payload</text>
  <text x="470" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">Qwen3-8B policy: a 16 GB dense BF16 broadcast becomes a ~200 MB lossless sparse delta</text>
  <rect x="22" y="68" width="896" height="92" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="38" y="89" font-size="12.5" fill="#b91c1c" font-weight="700">THE NETWORK WALL  (dense broadcast, PrimeRL-Full)</text>
  <rect x="38" y="108" width="210" height="38" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="143" y="132" text-anchor="middle" font-size="11.5" fill="#475569">16 GB BF16 checkpoint</text>
  <line x1="254" y1="127" x2="284" y2="127" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" marker-end="url(#adc2626)"/>
  <rect x="294" y="102" width="150" height="50" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="369" y="128" text-anchor="middle" font-size="15.5" fill="#047857" font-weight="700">1.3 s</text>
  <text x="369" y="143" text-anchor="middle" font-size="9.8" fill="#64748b">100 Gbps RDMA fabric</text>
  <rect x="456" y="102" width="150" height="50" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="531" y="128" text-anchor="middle" font-size="15.5" fill="#b91c1c" font-weight="700">128 s</text>
  <text x="531" y="143" text-anchor="middle" font-size="9.8" fill="#64748b">1 Gbps commodity link</text>
  <text x="622" y="120" font-size="11" fill="#475569">rollout window is only ~45 s,</text>
  <text x="622" y="136" font-size="11" fill="#475569">so the sync no longer hides</text>
  <rect x="22" y="176" width="286.667" height="68.62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="165.333" y="196.97" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-weight="700">1.  WHITE-BOX SPARSITY</text>
  <text x="165.333" y="214.97" text-anchor="middle" font-size="10.5" fill="#475569">RL learning rate ~1e-6, versus ~1e-4 for pretraining, so</text>
  <text x="165.333" y="229.47" text-anchor="middle" font-size="10.5" fill="#475569">behavioural alignment barely moves the weights.</text>
  <rect x="326.667" y="176" width="286.667" height="68.62" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="470" y="196.97" text-anchor="middle" font-size="11.5" fill="#6d28d9" font-weight="700">2.  LOSSLESS DELTA FILE</text>
  <text x="470" y="214.97" text-anchor="middle" font-size="10.5" fill="#475569">Immutable versioned D_v unifies checkpoint and</text>
  <text x="470" y="229.47" text-anchor="middle" font-size="10.5" fill="#475569">transport: a partial transfer is never ambiguous.</text>
  <rect x="631.333" y="176" width="286.667" height="68.62" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="774.667" y="196.97" text-anchor="middle" font-size="11.5" fill="#047857" font-weight="700">3.  STREAM AND RELAY</text>
  <text x="774.667" y="214.97" text-anchor="middle" font-size="10.5" fill="#475569">Cut-through pipelining overlaps extraction with</text>
  <text x="774.667" y="229.47" text-anchor="middle" font-size="10.5" fill="#475569">transmission across S striped TCP streams.</text>
  <rect x="22" y="252.62" width="286.667" height="74" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="34" y="274.62" font-size="10.3" fill="#475569">algorithmic sparsity   0.96%</text>
  <text x="34" y="292.62" font-size="10.3" fill="#475569">BF16 floor:  ULP ≈ |W| · 2⁻⁷</text>
  <text x="34" y="310.62" font-size="10.3" fill="#475569">r &lt; 0.5 rounds away:  1.27% nonzero</text>
  <rect x="326.667" y="252.62" width="286.667" height="74" rx="9" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="338.667" y="274.62" font-size="10.3" fill="#475569">delta offsets, not absolute indices</text>
  <text x="338.667" y="292.62" font-size="10.3" fill="#475569">LEB128 varints: 30–50% less metadata</text>
  <text x="338.667" y="310.62" font-size="10.3" fill="#475569">bit-exact:  zero accuracy cost</text>
  <rect x="631.333" y="252.62" width="286.667" height="74" rx="9" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="643.333" y="274.62" font-size="10.3" fill="#475569">two-tier push: O(N) cross-region -&gt; O(1)</text>
  <text x="643.333" y="292.62" font-size="10.3" fill="#475569">stage in background, activate at</text>
  <text x="643.333" y="310.62" font-size="10.3" fill="#475569">end-of-batch safe points only</text>
  <line x1="311.667" y1="210.31" x2="323.667" y2="210.31" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" marker-end="url(#a2563eb)"/>
  <line x1="616.333" y1="210.31" x2="628.333" y2="210.31" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" marker-end="url(#a2563eb)"/>
  <rect x="22" y="342.62" width="896" height="84" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="38" y="363.62" font-size="12.5" fill="#334155" font-weight="700">HETEROGENEITY AND ELASTICITY</text>
  <text x="38" y="388.62" font-size="10.5" fill="#475569">throughput EMA:  τ &lt;- β τ + (1−β) · tokens/elapsed      then      B_a = B · τ_a / T</text>
  <text x="38" y="403.62" font-size="10.5" fill="#475569">lease settlement: admit r iff  t_r ≤ t_expire  and  v_r = v_j  and  h_r = h(v_j)</text>
  <text x="38" y="418.62" font-size="10.5" fill="#475569">version gate: actor must hold v or v−1; re-entry share is decayed by α</text>
  <rect x="606" y="372.62" width="296" height="42" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="754" y="390.62" text-anchor="middle" font-size="10.5" fill="#64748b">delta catch-up on recovery</text>
  <text x="754" y="406.62" text-anchor="middle" font-size="12" fill="#047857" font-weight="700">202 MB replayed, not 15.6 GB</text>
  <text x="470" y="452.62" text-anchor="middle" font-size="11.5" fill="#475569">Throughput vs PrimeRL-Full:   Qwen3-4B 2.4–3.7×   ·   Qwen3-8B 3.1×   ·   Qwen3-14B 7.7–9.5×</text>
  <text x="470" y="471.62" text-anchor="middle" font-size="11.5" fill="#475569">Tokens per dollar vs reserved RDMA:   Qwen3-8B 1.21×   ·   Qwen3-14B 1.59×   ·   DeepScaleR reward curves show zero degradation</text>
  <defs>
    <marker id="adc2626" markerWidth="6" markerHeight="5.2" refX="5.6" refY="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.4,0.5 L5.8,2.6 L0.4,4.7 Z" fill="#dc2626"/></marker>
    <marker id="a2563eb" markerWidth="6" markerHeight="5.2" refX="5.6" refY="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.4,0.5 L5.8,2.6 L0.4,4.7 Z" fill="#2563eb"/></marker>
  </defs>
</svg>
