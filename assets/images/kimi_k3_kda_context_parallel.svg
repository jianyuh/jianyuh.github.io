<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="390" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">KDA Context Parallelism: local fragments + prefix scan</text>
  <text x="390" y="48" text-anchor="middle" font-size="12" fill="#64748b">Sₜ^[i+1] = S̃ₜ^[i+1] + M_{t←1}^[i+1] · S_{Tᵢ}^[i]   —  fixed-size all-gather, no KV exchange</text>

  <!-- three ranks each holding a sequence segment -->
  <g>
    <rect x="40"  y="90" width="216" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="282" y="90" width="216" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="524" y="90" width="216" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="148" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Rank 0 · tokens 0–T₀</text>
    <text x="390" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Rank 1 · tokens T₀–T₁</text>
    <text x="632" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Rank 2 · tokens T₁–T₂</text>

    <!-- each rank computes two local fragments from ZERO state -->
    <g font-size="10" text-anchor="middle">
      <rect x="60"  y="128" width="80" height="30" rx="5" fill="#ffffff" stroke="#60a5fa"/><text x="100" y="147" fill="#1e293b">S̃  (local)</text>
      <rect x="156" y="128" width="80" height="30" rx="5" fill="#ffffff" stroke="#60a5fa"/><text x="196" y="147" fill="#1e293b">M_{t←1}</text>
      <rect x="302" y="128" width="80" height="30" rx="5" fill="#ffffff" stroke="#60a5fa"/><text x="342" y="147" fill="#1e293b">S̃  (local)</text>
      <rect x="398" y="128" width="80" height="30" rx="5" fill="#ffffff" stroke="#60a5fa"/><text x="438" y="147" fill="#1e293b">M_{t←1}</text>
      <rect x="544" y="128" width="80" height="30" rx="5" fill="#ffffff" stroke="#60a5fa"/><text x="584" y="147" fill="#1e293b">S̃  (local)</text>
      <rect x="640" y="128" width="80" height="30" rx="5" fill="#ffffff" stroke="#60a5fa"/><text x="680" y="147" fill="#1e293b">M_{t←1}</text>
    </g>
    <text x="148" y="180" text-anchor="middle" font-size="9.5" fill="#64748b">computed from zero state, in parallel</text>
    <text x="390" y="180" text-anchor="middle" font-size="9.5" fill="#64748b">computed from zero state, in parallel</text>
    <text x="632" y="180" text-anchor="middle" font-size="9.5" fill="#64748b">computed from zero state, in parallel</text>
  </g>

  <!-- all-gather band -->
  <rect x="40" y="228" width="700" height="30" rx="6" fill="#faf5ff" stroke="#7c3aed"/>
  <text x="390" y="248" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b21b6">single fixed-size all-gather of (S̃, M) fragments</text>
  <g stroke="#7c3aed" stroke-width="1.5" fill="none">
    <line x1="148" y1="210" x2="148" y2="228" marker-end="url(#ap)"/>
    <line x1="390" y1="210" x2="390" y2="228" marker-end="url(#ap)"/>
    <line x1="632" y1="210" x2="632" y2="228" marker-end="url(#ap)"/>
  </g>

  <!-- prefix scan reconstruction -->
  <text x="390" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">prefix scan across ranks → true carried state</text>
  <g>
    <rect x="40"  y="300" width="216" height="46" rx="8" fill="#ecfdf5" stroke="#059669"/>
    <rect x="282" y="300" width="216" height="46" rx="8" fill="#ecfdf5" stroke="#059669"/>
    <rect x="524" y="300" width="216" height="46" rx="8" fill="#ecfdf5" stroke="#059669"/>
    <text x="148" y="322" text-anchor="middle" font-size="10.5" fill="#065f46">S⁰ = S̃⁰</text>
    <text x="148" y="338" text-anchor="middle" font-size="9" fill="#047857">(no carry in)</text>
    <text x="390" y="322" text-anchor="middle" font-size="10.5" fill="#065f46">S¹ = S̃¹ + M¹·S_{T₀}⁰</text>
    <text x="390" y="338" text-anchor="middle" font-size="9" fill="#047857">carries rank-0 state</text>
    <text x="632" y="322" text-anchor="middle" font-size="10.5" fill="#065f46">S² = S̃² + M²·S_{T₁}¹</text>
    <text x="632" y="338" text-anchor="middle" font-size="9" fill="#047857">carries rank-1 state</text>
  </g>
  <g stroke="#059669" stroke-width="2" fill="none">
    <path d="M256,323 L282,323" marker-end="url(#ag)"/>
    <path d="M498,323 L524,323" marker-end="url(#ag)"/>
  </g>
  <text x="390" y="372" text-anchor="middle" font-size="10.5" fill="#334155">linear compute scaling; state reconstructed exactly, no massive KV blocks moved</text>

  <defs>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker>
  </defs>
</svg>
