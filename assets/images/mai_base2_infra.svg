<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 509" width="940" height="509" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="509" fill="#ffffff"/><text x="24.0" y="30.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Two pieces of co-design that made MoE-everywhere and Muon affordable at 16K GPUs</text><text x="38.0" y="72.0" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start">A · Muon under ZeRO sharding: gather whole matrices, orthogonalize, scatter back</text><rect x="38.0" y="88.0" width="130.7" height="99.7" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="48.0" y="108.6" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">ZeRO shard</text><text x="48.0" y="129.5" font-size="11" font-weight="400" fill="#334155" text-anchor="start">each GPU holds an</text><text x="48.0" y="144.3" font-size="11" font-weight="400" fill="#334155" text-anchor="start">FP32 slice of the</text><text x="48.0" y="159.2" font-size="11" font-weight="400" fill="#334155" text-anchor="start">momentum</text><rect x="184.7" y="88.0" width="130.7" height="99.7" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="194.7" y="108.6" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">Cast to BF16</text><text x="194.7" y="129.5" font-size="11" font-weight="400" fill="#334155" text-anchor="start">halves the bytes that</text><text x="194.7" y="144.3" font-size="11" font-weight="400" fill="#334155" text-anchor="start">will move</text><line x1="170.7" y1="137.8" x2="181.7" y2="137.8" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="331.3" y="88.0" width="130.7" height="99.7" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="341.3" y="108.6" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">All-to-all #1</text><text x="341.3" y="129.5" font-size="11" font-weight="400" fill="#334155" text-anchor="start">batched; whole</text><text x="341.3" y="144.3" font-size="11" font-weight="400" fill="#334155" text-anchor="start">matrices land on</text><text x="341.3" y="159.2" font-size="11" font-weight="400" fill="#334155" text-anchor="start">GPUs grouped by</text><text x="341.3" y="174.0" font-size="11" font-weight="400" fill="#334155" text-anchor="start">shape</text><line x1="317.3" y1="137.8" x2="328.3" y2="137.8" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="478.0" y="88.0" width="130.7" height="99.7" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="488.0" y="108.6" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">Newton–Schulz</text><text x="488.0" y="129.5" font-size="11" font-weight="400" fill="#334155" text-anchor="start">symmetry-aware, on</text><text x="488.0" y="144.3" font-size="11" font-weight="400" fill="#334155" text-anchor="start">the full matrix, locally</text><line x1="464.0" y1="137.8" x2="475.0" y2="137.8" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="624.7" y="88.0" width="130.7" height="99.7" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="634.7" y="108.6" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">All-to-all #2</text><text x="634.7" y="129.5" font-size="11" font-weight="400" fill="#334155" text-anchor="start">updates go back to</text><text x="634.7" y="144.3" font-size="11" font-weight="400" fill="#334155" text-anchor="start">their original shards</text><line x1="610.7" y1="137.8" x2="621.7" y2="137.8" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="771.3" y="88.0" width="130.7" height="99.7" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="781.3" y="108.6" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">FP32 apply</text><text x="781.3" y="129.5" font-size="11" font-weight="400" fill="#334155" text-anchor="start">cast back and update</text><text x="781.3" y="144.3" font-size="11" font-weight="400" fill="#334155" text-anchor="start">the sharded weights</text><line x1="757.3" y1="137.8" x2="768.3" y2="137.8" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><text x="38.0" y="211.7" font-size="12" font-weight="700" fill="#14532d" text-anchor="start">With batch prefetching and metadata caching: Muon costs 2.1% of step time (165 ms).</text><rect x="24.0" y="48.0" width="892.0" height="179.7" rx="10" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3"/><text x="38.0" y="269.6" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start">B · Multi-round dropless MoE: a fixed buffer per expert group, extra rounds instead of dropped tokens</text><text x="124.4" y="289.6" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">group buffer, capacity fixed at allocation time (each cell = one token slot)</text><text x="38.0" y="314.6" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">Typical step</text><text x="38.0" y="330.6" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">21 tokens ≤ 24</text><rect x="124.4" y="299.6" width="17.0" height="22.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><rect x="143.4" y="299.6" width="17.0" height="22.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><rect x="162.4" y="299.6" width="17.0" height="22.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><rect x="181.5" y="299.6" width="17.0" height="22.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><rect x="200.5" y="299.6" width="17.0" height="22.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><rect x="219.5" y="299.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="238.5" y="299.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="257.6" y="299.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="276.6" y="299.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="295.6" y="299.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="314.6" y="299.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="333.7" y="299.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="352.7" y="299.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="371.7" y="299.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="390.7" y="299.6" width="17.0" height="22.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="409.8" y="299.6" width="17.0" height="22.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="428.8" y="299.6" width="17.0" height="22.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="447.8" y="299.6" width="17.0" height="22.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="466.8" y="299.6" width="17.0" height="22.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><rect x="485.9" y="299.6" width="17.0" height="22.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><rect x="504.9" y="299.6" width="17.0" height="22.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><rect x="523.9" y="299.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="542.9" y="299.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="562.0" y="299.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><text x="589.0" y="314.6" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">round 1</text><text x="38.0" y="354.6" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">Hot group</text><text x="38.0" y="370.6" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">30 tokens &gt; 24</text><rect x="124.4" y="339.6" width="17.0" height="22.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><rect x="143.4" y="339.6" width="17.0" height="22.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><rect x="162.4" y="339.6" width="17.0" height="22.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><rect x="181.5" y="339.6" width="17.0" height="22.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><rect x="200.5" y="339.6" width="17.0" height="22.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><rect x="219.5" y="339.6" width="17.0" height="22.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><rect x="238.5" y="339.6" width="17.0" height="22.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><rect x="257.6" y="339.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="276.6" y="339.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="295.6" y="339.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="314.6" y="339.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="333.7" y="339.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="352.7" y="339.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="371.7" y="339.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="390.7" y="339.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="409.8" y="339.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="428.8" y="339.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="447.8" y="339.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="466.8" y="339.6" width="17.0" height="22.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><rect x="485.9" y="339.6" width="17.0" height="22.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="504.9" y="339.6" width="17.0" height="22.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="523.9" y="339.6" width="17.0" height="22.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="542.9" y="339.6" width="17.0" height="22.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="562.0" y="339.6" width="17.0" height="22.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="589.0" y="354.6" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">round 1</text><rect x="124.4" y="369.6" width="17.0" height="22.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="143.4" y="369.6" width="17.0" height="22.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><rect x="162.4" y="369.6" width="17.0" height="22.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><rect x="181.5" y="369.6" width="17.0" height="22.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><rect x="200.5" y="369.6" width="17.0" height="22.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><rect x="219.5" y="369.6" width="17.0" height="22.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><rect x="238.5" y="369.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="257.6" y="369.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="276.6" y="369.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="295.6" y="369.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="314.6" y="369.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="333.7" y="369.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="352.7" y="369.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="371.7" y="369.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="390.7" y="369.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="409.8" y="369.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="428.8" y="369.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="447.8" y="369.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="466.8" y="369.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="485.9" y="369.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="504.9" y="369.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="523.9" y="369.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="542.9" y="369.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><rect x="562.0" y="369.6" width="17.0" height="22.0" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/><text x="589.0" y="384.6" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">round 2</text><rect x="124.4" y="401.6" width="12.0" height="12.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="141.4" y="411.6" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">tokens for E0</text><rect x="227.1" y="401.6" width="12.0" height="12.0" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="244.1" y="411.6" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">tokens for E1</text><rect x="329.8" y="401.6" width="12.0" height="12.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="346.8" y="411.6" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">tokens for E2</text><rect x="432.6" y="401.6" width="12.0" height="12.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="449.6" y="411.6" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">tokens for E3</text><rect x="652.0" y="281.6" width="250.0" height="173.9" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="662.0" y="302.3" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">Dispatch -&gt; Compute -&gt; Collect</text><text x="662.0" y="323.1" font-size="11" font-weight="400" fill="#334155" text-anchor="start">Pipelined per round over NVLink symmetric</text><text x="662.0" y="338.0" font-size="11" font-weight="400" fill="#334155" text-anchor="start">memory (no host staging); token metadata</text><text x="662.0" y="352.8" font-size="11" font-weight="400" fill="#334155" text-anchor="start">stays on device. Overflowing experts borrow</text><text x="662.0" y="367.7" font-size="11" font-weight="400" fill="#334155" text-anchor="start">spare slots in their group; only a group that</text><text x="662.0" y="382.5" font-size="11" font-weight="400" fill="#334155" text-anchor="start">still overflows runs another round, and at</text><text x="662.0" y="397.4" font-size="11" font-weight="400" fill="#334155" text-anchor="start">steady state everything finishes in one.</text><text x="662.0" y="412.2" font-size="11" font-weight="400" fill="#334155" text-anchor="start">Load-balancing statistics use one batched</text><text x="662.0" y="427.1" font-size="11" font-weight="400" fill="#334155" text-anchor="start">reduction for all layers instead of an</text><text x="662.0" y="441.9" font-size="11" font-weight="400" fill="#334155" text-anchor="start">all-reduce per layer.</text><text x="38.0" y="475.5" font-size="12" font-weight="700" fill="#14532d" text-anchor="start">MoE-layer MFU: 24% -&gt; 35%, which is what made an MoE in every layer affordable.</text><rect x="24.0" y="245.7" width="892.0" height="245.9" rx="10" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 3"/></svg>