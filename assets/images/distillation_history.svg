<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 437" width="940" height="437" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="437" fill="#ffffff"/><text x="20.0" y="34.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">A short history of distillation: same mechanic, bigger goals</text><text x="20.0" y="56.0" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Compress a model, then copy behavior it never had, then post-train the frontier on its own tokens</text><rect x="20.0" y="80.0" width="292.0" height="303.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="32.0" y="108.0" font-size="15" font-weight="700" fill="#1e293b" text-anchor="start">Compression</text><text x="32.0" y="130.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">make an existing model smaller and faster</text><rect x="32.0" y="146.0" width="268.0" height="65.0" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="32.0" y="146.0" width="4.0" height="65.0" rx="0" fill="#64748b" stroke="none" stroke-width="1"/><text x="44.0" y="166.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">2006 · Model Compression</text><text x="44.0" y="184.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">a small model reproduces a big model's</text><text x="44.0" y="199.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">predictions; no new capability</text><rect x="32.0" y="219.0" width="268.0" height="65.0" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="32.0" y="219.0" width="4.0" height="65.0" rx="0" fill="#64748b" stroke="none" stroke-width="1"/><text x="44.0" y="239.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">2015 · Hinton, Vinyals, Dean</text><text x="44.0" y="257.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">match the teacher's softened distribution: "dark</text><text x="44.0" y="272.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">knowledge"</text><rect x="32.0" y="292.0" width="268.0" height="50.0" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="32.0" y="292.0" width="4.0" height="50.0" rx="0" fill="#64748b" stroke="none" stroke-width="1"/><text x="44.0" y="312.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">2019 · DistilBERT</text><text x="44.0" y="330.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">most of BERT's quality at 40% less size</text><line x1="313.0" y1="231.5" x2="323.0" y2="231.5" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="324.0" y="80.0" width="292.0" height="303.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="336.0" y="108.0" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="start">Transfer</text><text x="336.0" y="130.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">copy behavior the student did not have</text><rect x="336.0" y="146.0" width="268.0" height="65.0" rx="5" fill="#ffffff" stroke="#dbeafe" stroke-width="1"/><rect x="336.0" y="146.0" width="4.0" height="65.0" rx="0" fill="#2563eb" stroke="none" stroke-width="1"/><text x="348.0" y="166.0" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">2023 · Alpaca, Self-Instruct</text><text x="348.0" y="184.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">capability pulled from a bigger model's text for</text><text x="348.0" y="199.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">a few hundred dollars</text><rect x="336.0" y="219.0" width="268.0" height="65.0" rx="5" fill="#ffffff" stroke="#dbeafe" stroke-width="1"/><rect x="336.0" y="219.0" width="4.0" height="65.0" rx="0" fill="#2563eb" stroke="none" stroke-width="1"/><text x="348.0" y="239.0" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">2025 · DeepSeek-R1-Distill</text><text x="348.0" y="257.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">R1's reasoning traces distilled into compact</text><text x="348.0" y="272.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Qwen and Llama students</text><line x1="617.0" y1="231.5" x2="627.0" y2="231.5" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="628.0" y="80.0" width="292.0" height="303.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="640.0" y="108.0" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="start">Frontier post-training</text><text x="640.0" y="130.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">the student generates, the teacher grades its</text><text x="640.0" y="146.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">tokens</text><rect x="640.0" y="162.0" width="268.0" height="65.0" rx="5" fill="#ffffff" stroke="#ede9fe" stroke-width="1"/><rect x="640.0" y="162.0" width="4.0" height="65.0" rx="0" fill="#7c3aed" stroke="none" stroke-width="1"/><text x="652.0" y="182.0" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">2023-24 · On-policy (MiniLLM, GKD)</text><text x="652.0" y="200.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">the teacher scores the student's own tokens;</text><text x="652.0" y="215.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">now used by GLM-5.2, Qwen3</text><rect x="640.0" y="235.0" width="268.0" height="65.0" rx="5" fill="#ffffff" stroke="#ede9fe" stroke-width="1"/><rect x="640.0" y="235.0" width="4.0" height="65.0" rx="0" fill="#7c3aed" stroke="none" stroke-width="1"/><text x="652.0" y="255.0" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">2026 · MOPD</text><text x="652.0" y="273.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">same-size RL experts merged into one student</text><text x="652.0" y="288.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">(DeepSeek-V4, MiMo, Nemotron 3 Ultra)</text><rect x="640.0" y="308.0" width="268.0" height="65.0" rx="5" fill="#ffffff" stroke="#ede9fe" stroke-width="1"/><rect x="640.0" y="308.0" width="4.0" height="65.0" rx="0" fill="#7c3aed" stroke="none" stroke-width="1"/><text x="652.0" y="328.0" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">2026 · Self-distillation</text><text x="652.0" y="346.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">hint-conditioned or earlier-checkpoint teacher</text><text x="652.0" y="361.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">(Composer 2.5)</text><text x="20.0" y="407.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">Distillation is also contested: learning from a stronger model's outputs is how open models get built and what the terms-of-service disputes are about. Permission</text><text x="20.0" y="423.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">and access separate the tool from the attack.</text></svg>