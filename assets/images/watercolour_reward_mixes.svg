<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 394" width="940" height="394" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="394" fill="#ffffff"/><text x="20.0" y="34.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">RL over taste: three reward mixes, same base model, same 178-painting pool</text><text x="20.0" y="56.0" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">Qwen3.5-35B-A3B with LoRA, GRPO in TRL; the pairwise judge encodes the author's taste, HPSv3 the average person's</text><rect x="20.0" y="78.0" width="450.0" height="300.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><text x="34.0" y="104.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">A. Reward weights per run</text><text x="34.0" y="153.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">hps-only</text><rect x="105.8" y="134.0" width="17.5" height="28.0" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><rect x="123.4" y="134.0" width="17.5" height="28.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><rect x="140.9" y="134.0" width="315.1" height="28.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="144.9" y="152.0" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="start">HPSv3 0.90</text><text x="34.0" y="199.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">judge-led</text><rect x="105.8" y="180.0" width="17.5" height="28.0" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><rect x="123.4" y="180.0" width="17.5" height="28.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><rect x="140.9" y="180.0" width="210.1" height="28.0" rx="2" fill="#ede9fe" stroke=