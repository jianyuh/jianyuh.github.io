<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 547" width="940" height="547" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="547" fill="#ffffff"/><text x="20.0" y="34.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">GRPO became a family: most labs that describe their algorithm change one piece</text><text x="20.0" y="56.0" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Each descendant keeps the group-relative advantage and fixes one failure mode</text><rect x="360.0" y="80.0" width="560.0" height="80.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="372.0" y="103.9" font-size="14" font-weight="700" fill="#78350f" text-anchor="start">DAPO</text><text x="372.0" y="126.8" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Clip-Higher against entropy collapse; dynamic sampling; token-level loss for long CoT;</text><text x="372.0" y="143.7" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">overlong reward shaping.</text><rect x="360.0" y="169.9" width="560.0" height="80.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/><text x="372.0" y="193.8" font-size="14" font-weight="700" fill="#7f1d1d" text-anchor="start">Dr. GRPO</text><text x="372.0" y="216.7" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Removes an optimization bias that artificially increases response length, especially for</text><text x="372.0" y="233.6" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">incorrect outputs.</text><rect x="360.0" y="259.9" width="560.0" height="80.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="372.0" y="283.8" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="start">GSPO</text><text x="372.0" y="306.7" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Importance ratio from sequence likelihood; sequence-level clipping, rewarding and</text><text x="372.0" y="323.5" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">optimization (Qwen3).</text><rect x="360.0" y="349.8" width="560.0" height="63.1" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="372.0" y="373.7" font-size="14" font-weight="700" fill="#14532d" text-anchor="start">CISPO</text><text x="372.0" y="396.6" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Clips the importance-sampling weights rather than the token updates (MiniMax).</text><rect x="360.0" y="422.9" width="560.0" height="63.1" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="372.0" y="446.8" font-size="14" font-weight="700" fill="#1e293b" text-anchor="start">Magistral</text><text x="372.0" y="469.7" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Filters out every group with zero advantage before forming training batches.</text><rect x="20.0" y="226.2" width="270.0" height="113.7" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="32.0" y="250.1" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start">GRPO (original)</text><text x="32.0" y="272.9" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Sample G answers per prompt, score</text><text x="32.0" y="289.8" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">them, and push up answers above the</text><text x="32.0" y="306.7" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">group mean. No value model. From</text><text x="32.0" y="323.6" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">DeepSeekMath; used by DeepSeek-R1.</text><path d="M290.0,283.0 L324.0,283.0 L324.0,120.0 L358.0,120.0" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><path d="M290.0,283.0 L324.0,283.0 L324.0,209.9 L358.0,209.9" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><path d="M290.0,283.0 L324.0,283.0 L324.0,299.9 L358.0,299.9" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><path d="M290.0,283.0 L324.0,283.0 L324.0,381.4 L358.0,381.4" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><path d="M290.0,283.0 L324.0,283.0 L324.0,454.5 L358.0,454.5" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><text x="20.0" y="516.0" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">In TRL, GRPOTrainer's loss_type now defaults to "dapo"; the "grpo" loss is documented as not recommended due to length bias, and GSPO is</text><text x="20.0" y="533.0" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">importance_sampling_level="sequence".</text></svg>