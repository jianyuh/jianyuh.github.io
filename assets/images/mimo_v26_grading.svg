<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 638" width="940" height="638" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="940" height="638" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="17.5" fill="#0f172a" font-weight="700">MiMo-V2.6: grade within the group, move credit, keep its total</text>
  <text x="470" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">Groupwise grading decides WHICH passes get credit; the tests still decide HOW MUCH credit there is</text>
  <rect x="22" y="68" width="439" height="241.6" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="38" y="89" font-size="12" fill="#b45309" font-weight="700">GRS - OFFLINE RUBRICS (REWARD SHAPING)</text>
  <text x="38" y="112" font-size="9.8" fill="#475569">High-pass-rate groups, where pass/fail carries almost no signal. Offline agentic analysis</text>
  <text x="38" y="125.4" font-size="9.8" fill="#475569">writes reusable task rubrics for solution quality and behavior.</text>
  <rect x="38" y="144.8" width="407" height="26" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
  <text x="241.5" y="161.8" text-anchor="middle" font-size="11.5" fill="#b45309" font-weight="700">R_i  =  R_i^test  ·  S_i^sol  ·  S_i^beh</text>
  <text x="38" y="188.8" font-size="9.8" fill="#475569">pass, clean and well tested</text>
  <text x="265.92" y="188.8" font-size="9.8" fill="#64748b">1 · 0.9 · 0.9</text>
  <text x="445" y="188.8" text-anchor="end" font-size="10.4" fill="#047857" font-weight="700">= 0.81</text>
  <text x="38" y="210.8" font-size="9.8" fill="#475569">pass, bloated workaround</text>
  <text x="265.92" y="210.8" font-size="9.8" fill="#64748b">1 · 0.5 · 0.7</text>
  <text x="445" y="210.8" text-anchor="end" font-size="10.4" fill="#b45309" font-weight="700">= 0.35</text>
  <text x="38" y="232.8" font-size="9.8" fill="#475569">fail, but polished</text>
  <text x="265.92" y="232.8" font-size="9.8" fill="#64748b">0 · 0.9 · 0.9</text>
  <text x="445" y="232.8" text-anchor="end" font-size="10.4" fill="#b91c1c" font-weight="700">= 0</text>
  <text x="38" y="258.8" font-size="9.6" fill="#64748b">Multiplicative: a rubric can only rank among passes. It can never rescue a failure, so tests stay</text>
  <text x="38" y="272.2" font-size="9.6" fill="#64748b">the ground truth. (Example scores are illustrative.)</text>
  <rect x="479" y="68" width="439" height="241.6" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="495" y="89" font-size="12" fill="#1d4ed8" font-weight="700">GAR - ONLINE GRADING (ADVANTAGE SHAPING)</text>
  <text x="495" y="112" font-size="9.8" fill="#475569">Mixed-outcome online code groups. An agentic grader scores passing patches on suitability,</text>
  <text x="495" y="125.4" font-size="9.8" fill="#475569">precision, minimality, side effects and style.</text>
  <line x1="495" y1="228.8" x2="902" y2="228.8" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>
  <rect x="515" y="179.467" width="26" height="49.3333" rx="3" fill="#cbd5e1"/>
  <text x="528" y="174.467" text-anchor="middle" font-size="9.2" fill="#334155" font-weight="700">1.00</text>
  <rect x="547" y="158.324" width="26" height="70.4762" rx="3" fill="#2563eb"/>
  <text x="560" y="153.324" text-anchor="middle" font-size="9.2" fill="#1d4ed8" font-weight="700">1.43</text>
  <text x="544" y="242.8" text-anchor="middle" font-size="9.4" fill="#64748b">p1  f=1.0</text>
  <rect x="600.667" y="179.467" width="26" height="49.3333" rx="3" fill="#cbd5e1"/>
  <text x="613.667" y="174.467" text-anchor="middle" font-size="9.2" fill="#334155" font-weight="700">1.00</text>
  <rect x="632.667" y="172.419" width="26" height="56.381" rx="3" fill="#2563eb"/>
  <text x="645.667" y="167.419" text-anchor="middle" font-size="9.2" fill="#1d4ed8" font-weight="700">1.14</text>
  <text x="629.667" y="242.8" text-anchor="middle" font-size="9.4" fill="#64748b">p2  f=0.8</text>
  <rect x="686.333" y="179.467" width="26" height="49.3333" rx="3" fill="#cbd5e1"/>
  <text x="699.333" y="174.467" text-anchor="middle" font-size="9.2" fill="#334155" font-weight="700">1.00</text>
  <rect x="718.333" y="207.657" width="26" height="21.1429" rx="3" fill="#2563eb"/>
  <text x="731.333" y="202.657" text-anchor="middle" font-size="9.2" fill="#1d4ed8" font-weight="700">0.43</text>
  <text x="715.333" y="242.8" text-anchor="middle" font-size="9.4" fill="#64748b">p3  f=0.3</text>
  <rect x="782" y="162.8" width="10" height="10" rx="2" fill="#cbd5e1"/>
  <text x="798" y="171.8" font-size="9.4" fill="#475569">A (GRPO)</text>
  <rect x="782" y="182.8" width="10" height="10" rx="2" fill="#2563eb"/>
  <text x="798" y="191.8" font-size="9.4" fill="#475569">A' = λ f A</text>
  <text x="782" y="216.8" font-size="9.8" fill="#1d4ed8" font-weight="700">sum: 3.00 -&gt; 3.00</text>
  <text x="495" y="260.8" font-size="9.6" fill="#64748b">Illustrative. Hacks (leakage, env exploits) reset to R = 0 first. Then λ = sum A / sum fA = 1.43</text>
  <text x="495" y="274.2" font-size="9.6" fill="#64748b">rescales the passes, so their total advantage is unchanged.</text>
  <rect x="22" y="323.6" width="439" height="228.8" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="38" y="344.6" font-size="12" fill="#b91c1c" font-weight="700">FREEZE THE MoE ROUTER DURING RL</text>
  <text x="282.2" y="371.6" font-size="9.8" fill="#b91c1c" font-weight="700">trainable</text>
  <text x="445" y="371.6" text-anchor="end" font-size="9.8" fill="#047857" font-weight="700">frozen</text>
  <line x1="38" y1="378.6" x2="445" y2="378.6" stroke="#fca5a5" stroke-width="1" stroke-linecap="round"/>
  <text x="38" y="395.6" font-size="9.8" fill="#475569">coefficient of variation</text>
  <text x="282.2" y="395.6" font-size="10" fill="#b91c1c" font-weight="700">0.78 -&gt; 2.0</text>
  <text x="445" y="395.6" text-anchor="end" font-size="10" fill="#047857" font-weight="700">~0.7</text>
  <text x="38" y="417.6" font-size="9.8" fill="#475569">peak load (max / mean)</text>
  <text x="282.2" y="417.6" font-size="10" fill="#b91c1c" font-weight="700">6.0x -&gt; 16.0x</text>
  <text x="445" y="417.6" text-anchor="end" font-size="10" fill="#047857" font-weight="700">~5.5x</text>
  <text x="38" y="439.6" font-size="9.8" fill="#475569">cold experts (&lt; 0.1x mean)</text>
  <text x="282.2" y="439.6" font-size="10" fill="#b91c1c" font-weight="700">0.5% -&gt; 22%</text>
  <text x="445" y="439.6" text-anchor="end" font-size="10" fill="#047857" font-weight="700">&lt; 1%</text>
  <text x="38" y="465.6" font-size="9.6" fill="#64748b">Reverting the router to its pre-RL weights restored balance with no benchmark loss: the drift</text>
  <text x="38" y="479" font-size="9.6" fill="#64748b">was producing imbalance, not capability. So freeze it for RL.</text>
  <text x="38" y="502.4" font-size="9.6" fill="#475569">Why it matters: a 16x hotspot puts 16 times the mean token load on one expert-parallel rank,</text>
  <text x="38" y="515.8" font-size="9.6" fill="#475569">which then OOMs; 22% cold experts leave a fifth of the capacity unused.</text>
  <rect x="479" y="323.6" width="439" height="228.8" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="495" y="344.6" font-size="12" fill="#6d28d9" font-weight="700">PAYLOAD PORTER - SPLIT CONTROL AND DATA</text>
  <rect x="495" y="365.6" width="189.5" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="589.75" y="387.6" text-anchor="middle" font-size="10.4" fill="#334155" font-weight="700">control plane (driver)</text>
  <text x="589.75" y="406.6" text-anchor="middle" font-size="9.4" fill="#64748b">keys · rewards · lengths</text>
  <rect x="712.5" y="365.6" width="189.5" height="58" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="807.25" y="387.6" text-anchor="middle" font-size="10.4" fill="#6d28d9" font-weight="700">data plane (object store)</text>
  <text x="807.25" y="406.6" text-anchor="middle" font-size="9.4" fill="#64748b">routing ids · top-p sets · pixels</text>
  <line x1="688.5" y1="394.6" x2="708.5" y2="394.6" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a94a3b8)"/>
  <rect x="495" y="441.6" width="407" height="58" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="698.5" y="463.6" text-anchor="middle" font-size="10.4" fill="#6d28d9" font-weight="700">TP packers fetch only their unpadded CP slice</text>
  <text x="698.5" y="482.6" text-anchor="middle" font-size="9.4" fill="#64748b">heavy tensors written once, never routed through the driver</text>
  <line x1="807.25" y1="425.6" x2="807.25" y2="438.6" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a7c3aed)"/>
  <text x="495" y="517.6" font-size="9.6" fill="#64748b">Rollout time varies 66x and length 90x across 25 sources. Sample Mixer: adaptive</text>
  <text x="495" y="531" font-size="9.6" fill="#64748b">oversampling, deficit-aware scheduling, KV-aware dispatch, sample replay.</text>
  <rect x="22" y="568.4" width="168" height="50" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="106" y="594.4" text-anchor="middle" font-size="14.5" fill="#334155" font-weight="700">~25K</text>
  <text x="106" y="609.4" text-anchor="middle" font-size="9" fill="#64748b">sequences per RL step</text>
  <rect x="204" y="568.4" width="168" height="50" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="288" y="594.4" text-anchor="middle" font-size="14.5" fill="#1d4ed8" font-weight="700">+31.3%</text>
  <text x="288" y="609.4" text-anchor="middle" font-size="9" fill="#64748b">DFlash accepted length</text>
  <rect x="386" y="568.4" width="168" height="50" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="470" y="594.4" text-anchor="middle" font-size="14.5" fill="#047857" font-weight="700">~50% -&gt; 66%</text>
  <text x="470" y="609.4" text-anchor="middle" font-size="9" fill="#64748b">DeepSWE, held-out harness</text>
  <rect x="568" y="568.4" width="168" height="50" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="652" y="594.4" text-anchor="middle" font-size="14.5" fill="#6d28d9" font-weight="700">71.9</text>
  <text x="652" y="609.4" text-anchor="middle" font-size="9" fill="#64748b">DeepSWE v1.1, V2.6-Pro</text>
  <rect x="750" y="568.4" width="168" height="50" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
  <text x="834" y="594.4" text-anchor="middle" font-size="14.5" fill="#b45309" font-weight="700">~7K</text>
  <text x="834" y="609.4" text-anchor="middle" font-size="9" fill="#64748b">open RL tasks released</text>
  <defs>
    <marker id="a94a3b8" markerWidth="6" markerHeight="5.2" refX="5.6" refY="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.4,0.5 L5.8,2.6 L0.4,4.7 Z" fill="#94a3b8"/></marker>
    <marker id="a7c3aed" markerWidth="6" markerHeight="5.2" refX="5.6" refY="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.4,0.5 L5.8,2.6 L0.4,4.7 Z" fill="#7c3aed"/></marker>
  </defs>
</svg>
