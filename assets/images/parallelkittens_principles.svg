<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 655" width="940" height="655" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="940" height="655" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="17.5" fill="#0f172a" font-weight="700">ParallelKittens: three principles for multi-GPU kernels</text>
  <text x="470" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">Pick the transfer mechanism, check the overlap bound, strip library overheads - then each kernel is under 50 lines</text>
  <rect x="22" y="68" width="896" height="208" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="38" y="89" font-size="12.5" fill="#1d4ed8" font-weight="700">1 · CHOOSE THE TRANSFER MECHANISM BY GRANULARITY</text>
  <rect x="38" y="106" width="277.333" height="150" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="176.667" y="127" text-anchor="middle" font-size="11.5" fill="#334155" font-weight="700">Copy Engine</text>
  <text x="50" y="148" font-size="9.6" fill="#64748b">peak BW achieved</text>
  <text x="303.333" y="148" text-anchor="end" font-size="9.8" fill="#0f172a" font-weight="700">81-82%</text>
  <text x="50" y="165" font-size="9.6" fill="#64748b">message to saturate</text>
  <text x="303.333" y="165" text-anchor="end" font-size="9.8" fill="#0f172a" font-weight="700">&gt;= 256 MB</text>
  <text x="50" y="182" font-size="9.6" fill="#64748b">in-fabric reduction</text>
  <text x="303.333" y="182" text-anchor="end" font-size="9.8" fill="#0f172a" font-weight="700">no</text>
  <text x="50" y="203" font-size="9.6" fill="#64748b">SMs to saturate: 0 of 132</text>
  <rect x="50" y="210" width="253.333" height="9" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="176.667" y="244" text-anchor="middle" font-size="9.8" fill="#334155" font-weight="700">use for: bulk, contiguous transfers</text>
  <rect x="331.333" y="106" width="277.333" height="150" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470" y="127" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-weight="700">TMA</text>
  <text x="343.333" y="148" font-size="9.6" fill="#64748b">peak BW achieved</text>
  <text x="596.667" y="148" text-anchor="end" font-size="9.8" fill="#0f172a" font-weight="700">74-78%</text>
  <text x="343.333" y="165" font-size="9.6" fill="#64748b">message to saturate</text>
  <text x="596.667" y="165" text-anchor="end" font-size="9.8" fill="#0f172a" font-weight="700">~2 KB</text>
  <text x="343.333" y="182" font-size="9.6" fill="#64748b">in-fabric reduction</text>
  <text x="596.667" y="182" text-anchor="end" font-size="9.8" fill="#0f172a" font-weight="700">no</text>
  <text x="343.333" y="203" font-size="9.6" fill="#64748b">SMs to saturate: 15 of 132</text>
  <rect x="343.333" y="210" width="253.333" height="9" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="343.333" y="210" width="28.7879" height="9" rx="4" fill="#2563eb"/>
  <text x="470" y="244" text-anchor="middle" font-size="9.8" fill="#1d4ed8" font-weight="700">use for: tile-granular point-to-point</text>
  <rect x="624.667" y="106" width="277.333" height="150" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="763.333" y="127" text-anchor="middle" font-size="11.5" fill="#6d28d9" font-weight="700">Register ld / st</text>
  <text x="636.667" y="148" font-size="9.6" fill="#64748b">peak BW achieved</text>
  <text x="890" y="148" text-anchor="end" font-size="9.8" fill="#0f172a" font-weight="700">70-76%</text>
  <text x="636.667" y="165" font-size="9.6" fill="#64748b">message to saturate</text>
  <text x="890" y="165" text-anchor="end" font-size="9.8" fill="#0f172a" font-weight="700">128 B</text>
  <text x="636.667" y="182" font-size="9.6" fill="#64748b">in-fabric reduction</text>
  <text x="890" y="182" text-anchor="end" font-size="9.8" fill="#0f172a" font-weight="700">yes (NVSwitch)</text>
  <text x="636.667" y="203" font-size="9.6" fill="#64748b">SMs to saturate: 76 of 132</text>
  <rect x="636.667" y="210" width="253.333" height="9" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="636.667" y="210" width="145.859" height="9" rx="4" fill="#7c3aed"/>
  <text x="763.333" y="244" text-anchor="middle" font-size="9.8" fill="#6d28d9" font-weight="700">use for: in-network reductions</text>
  <rect x="22" y="290" width="439" height="279.8" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="38" y="311" font-size="12" fill="#b45309" font-weight="700">2 · WHEN CAN COMM HIDE BEHIND COMPUTE?</text>
  <rect x="68" y="334" width="98.46" height="150" rx="0" fill="#fef2f2"/>
  <rect x="166.46" y="334" width="268.54" height="150" rx="0" fill="#ecfdf5"/>
  <line x1="68" y1="484" x2="435" y2="484" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="68" y1="334" x2="68" y2="484" stroke="#94a3b8" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="68" y1="416.5" x2="435" y2="416.5" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="68" y1="484" x2="280.965" y2="338" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="166.46" y1="334" x2="166.46" y2="484" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/>
  <text x="172.46" y="348" font-size="10" fill="#b45309" font-weight="700">K* = sR/2B = 2198</text>
  <text x="172.46" y="362" font-size="9.2" fill="#64748b">(H100, BF16)</text>
  <text x="425" y="432.5" text-anchor="end" font-size="9.6" fill="#6d28d9" font-weight="700">T_comm per tile = s·mn/B</text>
  <text x="288.965" y="350" font-size="9.6" fill="#1d4ed8" font-weight="700">T_comp per tile = 2mnK/R</text>
  <text x="117.23" y="391" text-anchor="middle" font-size="9.4" fill="#b91c1c" font-weight="700">comm exposed</text>
  <text x="300.73" y="474" text-anchor="middle" font-size="9.4" fill="#047857" font-weight="700">comm hidden (measured &lt;1% at K = 4096)</text>
  <text x="68" y="498" text-anchor="middle" font-size="9" fill="#64748b">0</text>
  <text x="159.75" y="498" text-anchor="middle" font-size="9" fill="#64748b">2048</text>
  <text x="251.5" y="498" text-anchor="middle" font-size="9" fill="#64748b">4096</text>
  <text x="435" y="498" text-anchor="middle" font-size="9" fill="#64748b">8192</text>
  <text x="251.5" y="512" text-anchor="middle" font-size="9.4" fill="#64748b">reduction dimension K</text>
  <text x="38" y="532" font-size="9.6" fill="#475569">Per output tile, compute grows with K while communication is fixed, so tile sizes cancel. R</text>
  <text x="38" y="545.4" font-size="9.6" fill="#475569">outgrows B each generation, so the threshold keeps rising.</text>
  <rect x="479" y="290" width="439" height="279.8" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="495" y="311" font-size="12" fill="#6d28d9" font-weight="700">SCHEDULING AND OVERHEADS (PRINCIPLES 2 + 3)</text>
  <text x="633.38" y="338" font-size="10" fill="#1d4ed8" font-weight="700">intra-SM</text>
  <text x="771.76" y="338" font-size="10" fill="#6d28d9" font-weight="700">inter-SM</text>
  <line x1="495" y1="344" x2="902" y2="344" stroke="#c4b5fd" stroke-width="1" stroke-linecap="round"/>
  <text x="495" y="360" font-size="9.6" fill="#64748b">sync</text>
  <text x="633.38" y="360" font-size="9.6" fill="#475569">mbarrier ~64 ns</text>
  <text x="771.76" y="360" font-size="9.6" fill="#475569">via HBM ~832 ns</text>
  <text x="495" y="379" font-size="9.6" fill="#64748b">in-network reduce</text>
  <text x="633.38" y="379" font-size="9.6" fill="#475569">no: per-port writes</text>
  <text x="771.76" y="379" font-size="9.6" fill="#475569">yes: 3.62x GEMM+AR</text>
  <text x="495" y="398" font-size="9.6" fill="#64748b">use when</text>
  <text x="633.38" y="398" font-size="9.6" fill="#475569">K clears the bound</text>
  <text x="771.76" y="398" font-size="9.6" fill="#475569">you need NVSwitch</text>
  <text x="495" y="435" font-size="10.2" fill="#6d28d9" font-weight="700">principle 3: replace generic runtimes on the hot path</text>
  <rect x="495" y="447" width="407" height="28" rx="7" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="505" y="465" font-size="9.4" fill="#475569">NCCL handshakes + staging -&gt; one-way zero-copy into peer buffers</text>
  <text x="892" y="465" text-anchor="end" font-size="11" fill="#047857" font-weight="700">1.79x</text>
  <rect x="495" y="481" width="407" height="28" rx="7" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="505" y="499" font-size="9.4" fill="#475569">NVSHMEM pointer lookups -&gt; peer pointers cached in registers</text>
  <text x="892" y="499" text-anchor="end" font-size="11" fill="#047857" font-weight="700">4.5x</text>
  <text x="495" y="529" font-size="9.6" fill="#64748b">All of it sits on one Load-Compute-Store-Communicate template and 8 primitives: store_async,</text>
  <text x="495" y="542.4" font-size="9.6" fill="#64748b">store_add_async, reduce, all_reduce move data; signal, signal_all, wait, barrier synchronize.</text>
  <rect x="22" y="585.8" width="168" height="50" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="106" y="611.8" text-anchor="middle" font-size="14.5" fill="#1d4ed8" font-weight="700">727</text>
  <text x="106" y="626.8" text-anchor="middle" font-size="9" fill="#64748b">TFLOP/s AG+GEMM, 8x H100</text>
  <rect x="204" y="585.8" width="168" height="50" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="288" y="611.8" text-anchor="middle" font-size="14.5" fill="#1d4ed8" font-weight="700">1,409</text>
  <text x="288" y="626.8" text-anchor="middle" font-size="9" fill="#64748b">TFLOP/s GEMM+RS, 8x B200</text>
  <rect x="386" y="585.8" width="168" height="50" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="470" y="611.8" text-anchor="middle" font-size="14.5" fill="#6d28d9" font-weight="700">1.28x</text>
  <text x="470" y="626.8" text-anchor="middle" font-size="9" fill="#64748b">ring attn vs xDiT, 393K seq</text>
  <rect x="568" y="585.8" width="168" height="50" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="652" y="611.8" text-anchor="middle" font-size="14.5" fill="#6d28d9" font-weight="700">2.6x</text>
  <text x="652" y="626.8" text-anchor="middle" font-size="9" fill="#64748b">ring attn vs xDiT, 12K seq</text>
  <rect x="750" y="585.8" width="168" height="50" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
  <text x="834" y="611.8" text-anchor="middle" font-size="14.5" fill="#b45309" font-weight="700">0.92-1.22x</text>
  <text x="834" y="626.8" text-anchor="middle" font-size="9" fill="#64748b">MoE vs Comet, &lt; 40 lines</text>
</svg>
