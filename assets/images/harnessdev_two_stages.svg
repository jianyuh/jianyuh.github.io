<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 544" width="940" height="544" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="940" height="544" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="700">HarnessDev: Creation, Evolution, and the Held-Out Gap</text>
  <text x="470" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">(L_C, D) -&gt; H     then     (H, L_E, x) -&gt; y -&gt; J -&gt; score</text>
  <rect x="22" y="68" width="896" height="178" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="38" y="89" font-size="12.5" fill="#1d4ed8" font-weight="700">STAGE 1 — CREATION</text>
  <rect x="38" y="100" width="200" height="48" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="138" y="121" text-anchor="middle" font-size="11.5" fill="#334155" font-weight="700">H_seed</text>
  <text x="138" y="137" text-anchor="middle" font-size="9.8" fill="#64748b">runnable, no orchestration</text>
  <rect x="262" y="100" width="200" height="48" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="362" y="121" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-weight="700">Creator L_C in D</text>
  <text x="362" y="137" text-anchor="middle" font-size="9.8" fill="#64748b">1–3 visible dev tasks</text>
  <rect x="486" y="100" width="200" height="48" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="586" y="121" text-anchor="middle" font-size="11.5" fill="#6d28d9" font-weight="700">H = (E,T,C,S,L,V)</text>
  <text x="586" y="137" text-anchor="middle" font-size="9.8" fill="#64748b">loop, tools, context, state</text>
  <rect x="710" y="100" width="200" height="48" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="810" y="121" text-anchor="middle" font-size="11.5" fill="#047857" font-weight="700">Frozen H + executor L_E</text>
  <text x="810" y="137" text-anchor="middle" font-size="9.8" fill="#64748b">2,207 tasks, 5 benchmarks</text>
  <line x1="242" y1="124" x2="258" y2="124" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a2563eb)"/>
  <line x1="466" y1="124" x2="482" y2="124" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a2563eb)"/>
  <line x1="690" y1="124" x2="706" y2="124" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a2563eb)"/>
  <rect x="38" y="160" width="422" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="249" y="181.69" text-anchor="middle" font-size="11.5" fill="#b91c1c" font-weight="700">Co-adaptation plunge</text>
  <text x="249" y="199.69" text-anchor="middle" font-size="10.3" fill="#475569">Opus 4.8 on SWE-Pro falls 69.3 -&gt; 33.0 when the executor swaps to Gemini:</text>
  <text x="249" y="214.19" text-anchor="middle" font-size="10.3" fill="#475569">hardcoded 120-step limits and Opus-shaped ReAct.</text>
  <rect x="480" y="160" width="422" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="691" y="181.69" text-anchor="middle" font-size="11.5" fill="#047857" font-weight="700">Executor bottleneck release</text>
  <text x="691" y="199.69" text-anchor="middle" font-size="10.3" fill="#475569">Qwen 3.7 Max rises 44.0 -&gt; 52.8 and Seed 2.0 Pro 22.8 -&gt; 29.8: sound harness, weak</text>
  <text x="691" y="214.19" text-anchor="middle" font-size="10.3" fill="#475569">native runtime.</text>
  <rect x="22" y="262" width="896" height="158" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="38" y="283" font-size="12.5" fill="#b91c1c" font-weight="700">STAGE 2 — EVOLUTION  (10 budgeted commits)</text>
  <rect x="38" y="298" width="74" height="32" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <text x="75" y="318" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="700">H_0</text>
  <line x1="114" y1="314" x2="122" y2="314" stroke="#dc2626" stroke-width="1.2" stroke-linecap="round" marker-end="url(#adc2626)"/>
  <rect x="124" y="298" width="74" height="32" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="161" y="318" text-anchor="middle" font-size="11" fill="#334155" font-weight="700">T_1</text>
  <line x1="200" y1="314" x2="208" y2="314" stroke="#dc2626" stroke-width="1.2" stroke-linecap="round" marker-end="url(#adc2626)"/>
  <rect x="210" y="298" width="74" height="32" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="247" y="318" text-anchor="middle" font-size="11" fill="#334155" font-weight="700">T_2</text>
  <line x1="286" y1="314" x2="294" y2="314" stroke="#dc2626" stroke-width="1.2" stroke-linecap="round" marker-end="url(#adc2626)"/>
  <rect x="296" y="298" width="74" height="32" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="333" y="318" text-anchor="middle" font-size="11" fill="#334155" font-weight="700">...</text>
  <line x1="372" y1="314" x2="380" y2="314" stroke="#dc2626" stroke-width="1.2" stroke-linecap="round" marker-end="url(#adc2626)"/>
  <rect x="382" y="298" width="74" height="32" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <text x="419" y="318" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="700">H_dec</text>
  <text x="38" y="352" font-size="10.5" fill="#475569">feedback set:  100 SWE-Pro  +  89 Terminal-Bench</text>
  <text x="38" y="368" font-size="10.5" fill="#475569">held-out:  disjoint post-freeze 630-task SWE-Pro, never shown to the model</text>
  <text x="38" y="384" font-size="10.5" fill="#475569">only 2 of 64 version switches cleared the ±4.75 pt noise band; 24 regressed</text>
  <rect x="492" y="294" width="410" height="114" rx="9" fill="#ffffff" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="506" y="314" font-size="10" fill="#64748b" font-weight="700">creator (runtime)</text>
  <text x="706" y="314" font-size="10" fill="#64748b" font-weight="700">feedback</text>
  <text x="822" y="314" font-size="10" fill="#64748b" font-weight="700">held-out</text>
  <line x1="504" y1="320" x2="890" y2="320" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <text x="506" y="340" font-size="10.3" fill="#475569">Opus 4.8 (self)</text>
  <text x="706" y="340" font-size="10.3" fill="#475569">+3.0 pp</text>
  <text x="822" y="340" font-size="10.3" fill="#047857" font-weight="700">+4.44 pp</text>
  <text x="506" y="362" font-size="10.3" fill="#475569">Qwen 3.7 Max (self)</text>
  <text x="706" y="362" font-size="10.3" fill="#475569">+13.9 pp</text>
  <text x="822" y="362" font-size="10.3" fill="#b45309" font-weight="700">+1.43 pp</text>
  <text x="506" y="384" font-size="10.3" fill="#475569">GPT-5.5 (fixed Gemini)</text>
  <text x="706" y="384" font-size="10.3" fill="#475569">+2.4 pp</text>
  <text x="822" y="384" font-size="10.3" fill="#b91c1c" font-weight="700">−10.32 pp</text>
  <text x="506" y="402" font-size="10" fill="#64748b">feedback and held-out agree only 53.1% of the time</text>
  <rect x="22" y="436" width="286.667" height="86" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="165.333" y="458.44" text-anchor="middle" font-size="11.5" fill="#6d28d9" font-weight="700">Dead code</text>
  <text x="165.333" y="476.44" text-anchor="middle" font-size="10.3" fill="#475569">18 of 108 components never triggered — all 18 were</text>
  <text x="165.333" y="490.94" text-anchor="middle" font-size="10.3" fill="#475569">State and Memory. 56 of 169 new functions dead in</text>
  <text x="165.333" y="505.44" text-anchor="middle" font-size="10.3" fill="#475569">Evolution.</text>
  <rect x="326.667" y="436" width="286.667" height="86" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="470" y="465.69" text-anchor="middle" font-size="11.5" fill="#6d28d9" font-weight="700">Verification that verifies nothing</text>
  <text x="470" y="483.69" text-anchor="middle" font-size="10.3" fill="#475569">441 of 2,325 MLE-bench runs self-reported success on</text>
  <text x="470" y="498.19" text-anchor="middle" font-size="10.3" fill="#475569">degenerate output. 0 of 64 switches touched a verifier.</text>
  <rect x="631.333" y="436" width="286.667" height="86" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="774.667" y="465.69" text-anchor="middle" font-size="11.5" fill="#6d28d9" font-weight="700">Diagnosis beats local search</text>
  <text x="774.667" y="483.69" text-anchor="middle" font-size="10.3" fill="#475569">Opus read traces (99% reported vs 48% actual) and won</text>
  <text x="774.667" y="498.19" text-anchor="middle" font-size="10.3" fill="#475569">held-out; GPT-5.5 chased score and missed by 16.51 pp.</text>
  <defs>
    <marker id="a2563eb" markerWidth="6" markerHeight="5.2" refX="5.6" refY="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.4,0.5 L5.8,2.6 L0.4,4.7 Z" fill="#2563eb"/></marker>
    <marker id="adc2626" markerWidth="6" markerHeight="5.2" refX="5.6" refY="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.4,0.5 L5.8,2.6 L0.4,4.7 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
