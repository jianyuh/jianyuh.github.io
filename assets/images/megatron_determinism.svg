<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 622" width="940" height="622" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="622" fill="#ffffff"/><text x="24.0" y="30.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Finding the first bit that flips, then removing the cause</text><text x="38.0" y="74.0" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start">A · Localize: trace progressively finer (Megatron-LM PR #7262)</text><rect x="38.0" y="88.0" width="156.8" height="102.3" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="48.0" y="108.6" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">1 · End-to-end</text><text x="48.0" y="130.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">loss, LM, load-balance,</text><text x="48.0" y="145.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">MTP, grad-norm</text><text x="48.0" y="161.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">fingerprints: which step?</text><rect x="214.8" y="88.0" width="156.8" height="102.3" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="224.8" y="108.6" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">2 · Semantic</text><text x="224.8" y="130.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">collectives, pipeline</text><text x="224.8" y="145.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">sends, recompute,</text><text x="224.8" y="161.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">optimizer, grad</text><text x="224.8" y="176.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">reductions</text><line x1="197.8" y1="139.2" x2="211.8" y2="139.2" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="391.6" y="88.0" width="156.8" height="102.3" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="401.6" y="108.6" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">3 · Module / layer</text><text x="401.6" y="130.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">which Transformer, MoE</text><text x="401.6" y="145.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">routing, or SSM block?</text><line x1="374.6" y1="139.2" x2="388.6" y2="139.2" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="568.4" y="88.0" width="156.8" height="102.3" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="578.4" y="108.6" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">4 · ATen op</text><text x="578.4" y="130.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">TorchDispatchMode</text><text x="578.4" y="145.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">digests of every op and</text><text x="578.4" y="161.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">extension</text><line x1="551.4" y1="139.2" x2="565.4" y2="139.2" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="745.2" y="88.0" width="156.8" height="102.3" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="755.2" y="108.6" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">5 · Kernel</text><text x="755.2" y="130.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">the CUDA / Triton kernel</text><text x="755.2" y="145.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">or race that produced it</text><line x1="728.2" y1="139.2" x2="742.2" y2="139.2" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><text x="38.0" y="210.3" font-size="12" font-weight="400" fill="#334155" text-anchor="start">First mismatch on a rank, comparing hash(input) and hash(output) of runs A and B:</text><rect x="38.0" y="220.3" width="278.7" height="71.3" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="48.0" y="241.0" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="start">inputs match, outputs differ</text><text x="48.0" y="262.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Origin candidate: this op, or a hidden kernel</text><text x="48.0" y="278.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">feeding it</text><rect x="330.7" y="220.3" width="278.7" height="71.3" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="340.7" y="241.0" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="start">inputs differ, outputs differ</text><text x="340.7" y="262.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Downstream receiver: keep tracing upstream</text><rect x="623.3" y="220.3" width="278.7" height="71.3" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="633.3" y="241.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">no origin on traced ranks</text><text x="633.3" y="262.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Outside the capture: widen the step window or</text><text x="633.3" y="278.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">rank set</text><rect x="24.0" y="52.0" width="892.0" height="255.6" rx="10" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3"/><text x="38.0" y="347.6" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start">B · Fix without serializing: the grouped-GEMM epilogue writing dprob[token]</text><text x="38.0" y="375.6" font-size="12.5" font-weight="700" fill="#7f1d1d" text-anchor="start">Before: atomic add into one shared address</text><text x="485.0" y="375.6" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="start">After: private slot per N-tile, then a fixed tree</text><rect x="38.0" y="393.6" width="74.0" height="26.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="75.0" y="410.6" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="middle">N-tile 0</text><rect x="38.0" y="429.6" width="74.0" height="26.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="75.0" y="446.6" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="middle">N-tile 1</text><rect x="38.0" y="465.6" width="74.0" height="26.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="75.0" y="482.6" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="middle">N-tile 2</text><rect x="38.0" y="501.6" width="74.0" height="26.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="75.0" y="518.6" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="middle">N-tile 3</text><rect x="182.0" y="433.6" width="150.0" height="54.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/><text x="257.0" y="456.6" font-size="12.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">atomicAdd</text><text x="257.0" y="473.6" font-size="11.5" font-weight="400" fill="#334155" text-anchor="middle">dprob[token]</text><line x1="114.0" y1="406.6" x2="179.0" y2="441.8" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="114.0" y1="442.6" x2="179.0" y2="454.3" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="114.0" y1="478.6" x2="179.0" y2="466.9" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="114.0" y1="514.6" x2="179.0" y2="479.5" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="485.0" y="393.6" width="74.0" height="26.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="522.0" y="410.6" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="middle">N-tile 0</text><rect x="485.0" y="429.6" width="74.0" height="26.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="522.0" y="446.6" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="middle">N-tile 1</text><rect x="485.0" y="465.6" width="74.0" height="26.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="522.0" y="482.6" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="middle">N-tile 2</text><rect x="485.0" y="501.6" width="74.0" height="26.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="522.0" y="518.6" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="middle">N-tile 3</text><rect x="585.0" y="393.6" width="64.0" height="26.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="617.0" y="410.6" font-size="11.5" font-weight="400" fill="#14532d" text-anchor="middle">slot 0</text><line x1="561.0" y1="406.6" x2="582.0" y2="406.6" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="585.0" y="429.6" width="64.0" height="26.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="617.0" y="446.6" font-size="11.5" font-weight="400" fill="#14532d" text-anchor="middle">slot 1</text><line x1="561.0" y1="442.6" x2="582.0" y2="442.6" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="585.0" y="465.6" width="64.0" height="26.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="617.0" y="482.6" font-size="11.5" font-weight="400" fill="#14532d" text-anchor="middle">slot 2</text><line x1="561.0" y1="478.6" x2="582.0" y2="478.6" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="585.0" y="501.6" width="64.0" height="26.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="617.0" y="518.6" font-size="11.5" font-weight="400" fill="#14532d" text-anchor="middle">slot 3</text><line x1="561.0" y1="514.6" x2="582.0" y2="514.6" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><circle cx="683.0" cy="424.6" r="13" fill="#fff" stroke="#16a34a" stroke-width="1.2"/><text x="683.0" y="429.6" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">+</text><line x1="651.0" y1="406.6" x2="668.0" y2="417.4" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="651.0" y1="442.6" x2="668.0" y2="431.8" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><circle cx="683.0" cy="496.6" r="13" fill="#fff" stroke="#16a34a" stroke-width="1.2"/><text x="683.0" y="501.6" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">+</text><line x1="651.0" y1="478.6" x2="668.0" y2="489.4" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="651.0" y1="514.6" x2="668.0" y2="503.8" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><circle cx="729.0" cy="460.6" r="13" fill="#fff" stroke="#16a34a" stroke-width="1.2"/><text x="729.0" y="465.6" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">+</text><line x1="697.0" y1="424.6" x2="714.0" y2="446.2" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="697.0" y1="496.6" x2="714.0" y2="475.0" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="766.0" y="438.6" width="136.0" height="44.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="834.0" y="464.6" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">dprob[token]</text><line x1="743.0" y1="460.6" x2="763.0" y2="460.6" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><text x="38.0" y="553.6" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Tiles finish in a different order every run, and in floating point (a+b)+c can</text><text x="38.0" y="569.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">differ from a+(b+c), so the low bits change. Serializing the writers restores the</text><text x="38.0" y="584.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">bits but throws away the parallelism.</text><text x="485.0" y="553.6" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Writers stay fully parallel inside the kernel. The slots are combined only after</text><text x="485.0" y="569.2" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">every writer finishes, in an order fixed by the tree, so every run produces the</text><text x="485.0" y="584.7" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">same bits.</text><rect x="24.0" y="325.6" width="892.0" height="277.0" rx="10" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 3"/></svg>