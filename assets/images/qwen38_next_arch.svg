<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 438" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="780" height="438" fill="#ffffff"/>
  <text x="390" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Qwen3.8-Flash-Next: 125B total / 6B active</text>
  <text x="390" y="48" text-anchor="middle" font-size="12" fill="#64748b">3:1 GDN–attention hybrid over a four-branch gated residual stream</text>

  <!-- Residual branches -->
  <text x="24" y="82" font-size="11.5" font-weight="700" fill="#7c3aed">Gated Residual (FP8, no cross-branch mixing)</text>
  <g stroke-width="3">
    <line x1="24" y1="96"  x2="726" y2="96"  stroke="#7c3aed"/>
    <line x1="24" y1="110" x2="726" y2="110" stroke="#c4b5fd"/>
    <line x1="24" y1="124" x2="726" y2="124" stroke="#c4b5fd"/>
    <line x1="24" y1="138" x2="726" y2="138" stroke="#c4b5fd"/>
  </g>
  <text x="734" y="99"  font-size="10" fill="#7c3aed">b0</text>
  <text x="734" y="128" font-size="10" fill="#94a3b8">b1–b3</text>
  <text x="30" y="158" font-size="10.5" fill="#7c3aed">b0 = long-range highway (median skip 10.9 layers)</text>
  <text x="420" y="158" font-size="10.5" fill="#64748b">b1–b3 = local accumulators (1.2–3.5 layers)</text>

  <!-- read/write gates -->
  <g font-size="9.5" fill="#7c3aed" text-anchor="middle">
    <text x="120" y="182">read: x = (1/n)·Σ G⊙R̂</text>
    <text x="600" y="182">write: R'ᵢ = Rᵢ + sᵢ·y</text>
  </g>

  <!-- Block: 3 GDN + 1 QSA -->
  <g>
    <rect x="40" y="192" width="140" height="80" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
    <text x="110" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">GDN ×3</text>
    <text x="110" y="234" text-anchor="middle" font-size="10.5" fill="#475569">gated delta recurrence</text>
    <text x="110" y="250" text-anchor="middle" font-size="10.5" fill="#475569">O(1) state per token</text>
    <text x="110" y="262" text-anchor="middle" font-size="9.5" fill="#64748b">no RoPE</text>
  </g>
  <line x1="180" y1="229" x2="216" y2="229" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <g>
    <rect x="218" y="192" width="150" height="80" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="293" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">QSA ×1</text>
    <text x="293" y="234" text-anchor="middle" font-size="10.5" fill="#475569">top-512 of r=4 blocks</text>
    <text x="293" y="250" text-anchor="middle" font-size="10.5" fill="#475569">K = 2048 token budget</text>
    <text x="293" y="262" text-anchor="middle" font-size="9.5" fill="#64748b">keeps RoPE · reads b0 most</text>
  </g>

  <!-- Recurrence math -->
  <rect x="404" y="192" width="336" height="80" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="572" y="214" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">Gated delta transition</text>
  <text x="572" y="238" text-anchor="middle" font-size="12.5" fill="#1e293b">S_t = α_t ( I − β_t k_t k_tᵀ ) S_{t−1} + β_t k_t v_tᵀ</text>
  <text x="572" y="257" text-anchor="middle" font-size="10" fill="#64748b">decay gate α · rank-one erase · write gate β</text>

  <!-- indexer pipeline -->
  <text x="24" y="300" font-size="11.5" font-weight="700" fill="#1d4ed8">QSA indexer: compress before you rotate</text>
  <g font-size="10.5" fill="#334155" text-anchor="middle">
    <rect x="24"  y="310" width="112" height="34" rx="7" fill="#ffffff" stroke="#60a5fa"/><text x="80"  y="331">keys kᵢ</text>
    <rect x="152" y="310" width="122" height="34" rx="7" fill="#ffffff" stroke="#60a5fa"/><text x="213" y="331">AvgPool r=4</text>
    <rect x="290" y="310" width="132" height="34" rx="7" fill="#ffffff" stroke="#60a5fa"/><text x="356" y="331">partial RoPE 64/128</text>
    <rect x="438" y="310" width="132" height="34" rx="7" fill="#ffffff" stroke="#60a5fa"/><text x="504" y="331">ReLU block score</text>
    <rect x="586" y="310" width="130" height="34" rx="7" fill="#eff6ff" stroke="#2563eb"/><text x="651" y="331">TopK → Expand</text>
  </g>
  <g stroke="#60a5fa" stroke-width="1.8" marker-end="url(#ab)">
    <line x1="136" y1="327" x2="150" y2="327"/><line x1="274" y1="327" x2="288" y2="327"/>
    <line x1="422" y1="327" x2="436" y2="327"/><line x1="570" y1="327" x2="584" y2="327"/>
  </g>

  <!-- n-gram layer -->
  <rect x="24" y="360" width="356" height="60" rx="9" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="202" y="381" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">n-gram embedding @ Layer 2 — 51B params</text>
  <text x="202" y="399" text-anchor="middle" font-size="10.5" fill="#475569">host memory; prefetch overlaps Layer 1 compute</text>
  <text x="202" y="411" text-anchor="middle" font-size="9.5" fill="#64748b">loss ↓ monotonically to 200V · EN acc saturates at 50–100V</text>

  <!-- stability box -->
  <rect x="396" y="360" width="344" height="60" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="568" y="381" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">Stress test @ 4× optimal LR</text>
  <text x="568" y="399" text-anchor="middle" font-size="10.5" fill="#475569">Qwen3.5 + AdamW: 183 spikes / 10k steps</text>
  <text x="568" y="411" text-anchor="middle" font-size="10.5" fill="#059669">Muon + Gated Residual: 0 spikes, no clipping</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#60a5fa"/></marker>
  </defs>
</svg>
