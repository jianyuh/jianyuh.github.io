<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 438" width="940" height="438" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="438" fill="#ffffff"/><text x="20.0" y="34.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Autoresearch case study: Inkling 2 Small fine-tunes Qwen3.5-4B on its own</text><text x="20.0" y="56.0" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">Forecast skill on 100 held-out windows (fraction less error than copying the last values forward), in run order</text><text x="20.0" y="101.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">base Qwen3.5-4B</text><rect x="142.0" y="88.0" width="191.0" height="18.0" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="339.0" y="101.0" font-size="12" font-weight="700" fill="#1e293b" text-anchor="start">0.191</text><text x="506.0" y="101.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">after fixing its own eval bug (one seed for 8 samples) that first read 0.038</text><line x1="20.0" y1="115.0" x2="920.0" y2="115.0" stroke="#eef1f5" stroke-width="1"/><text x="20.0" y="135.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">SFT 1</text><rect x="142.0" y="122.0" width="250.0" height="18.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="398.0" y="135.0" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start">≈0.25</text><text x="506.0" y="128.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">first SFT on 12,500 windows through May; better than copying on every</text><text x="506.0" y="142.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">source</text><line x1="20.0" y1="149.0" x2="920.0" y2="149.0" stroke="#eef1f5" stroke-width="1"/><text x="20.0" y="169.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">SFT 2</text><rect x="142.0" y="156.0" width="269.0" height="18.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="417.0" y="169.0" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start">0.269</text><text x="506.0" y="169.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">all history to July 31; saved as provisional submission</text><line x1="20.0" y1="183.0" x2="920.0" y2="183.0" stroke="#eef1f5" stroke-width="1"/><text x="20.0" y="203.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">RL from SFT 2</text><rect x="142.0" y="190.0" width="256.0" height="18.0" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="404.0" y="203.0" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="start">0.256</text><text x="506.0" y="203.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">task score as reward; forecasts turn overconfident</text><line x1="20.0" y1="217.0" x2="920.0" y2="217.0" stroke="#eef1f5" stroke-width="1"/><text x="20.0" y="237.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">RL, later</text><rect x="142.0" y="224.0" width="230.0" height="18.0" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="378.0" y="237.0" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="start">0.230</text><text x="506.0" y="237.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">still dropping, so it kills the run: SFT 2 spread was already calibrated</text><line x1="20.0" y1="251.0" x2="920.0" y2="251.0" stroke="#eef1f5" stroke-width="1"/><text x="20.0" y="271.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">SFT 3</text><rect x="142.0" y="258.0" width="250.0" height="18.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="398.0" y="271.0" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start">≈0.25</text><text x="506.0" y="271.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">second epoch over the same data, no gain</text><line x1="20.0" y1="285.0" x2="920.0" y2="285.0" stroke="#eef1f5" stroke-width="1"/><text x="20.0" y="305.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">SFT 4</text><rect x="142.0" y="292.0" width="289.0" height="18.0" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="437.0" y="305.0" font-size="12" font-weight="700" fill="#14532d" text-anchor="start">0.289</text><text x="506.0" y="305.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">short top-up on the last 12 months only: best, submitted</text><line x1="20.0" y1="319.0" x2="920.0" y2="319.0" stroke="#eef1f5" stroke-width="1"/><line x1="142.0" y1="322.0" x2="142.0" y2="326.0" stroke="#64748b" stroke-width="1"/><text x="142.0" y="339.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">0</text><line x1="242.0" y1="322.0" x2="242.0" y2="326.0" stroke="#64748b" stroke-width="1"/><text x="242.0" y="339.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">0.1</text><line x1="342.0" y1="322.0" x2="342.0" y2="326.0" stroke="#64748b" stroke-width="1"/><text x="342.0" y="339.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">0.2</text><line x1="442.0" y1="322.0" x2="442.0" y2="326.0" stroke="#64748b" stroke-width="1"/><text x="442.0" y="339.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">0.3</text><line x1="142.0" y1="322.0" x2="442.0" y2="322.0" stroke="#64748b" stroke-width="1"/><line x1="333.0" y1="86.0" x2="333.0" y2="322.0" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/><rect x="20.0" y="366.0" width="214.5" height="56.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="32.0" y="390.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">4 h 17 min</text><text x="32.0" y="410.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">of a 12 h limit</text><rect x="248.5" y="366.0" width="214.5" height="56.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="260.5" y="390.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">$426</text><text x="260.5" y="410.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">of a $500 Tinker budget</text><rect x="477.0" y="366.0" width="214.5" height="56.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="489.0" y="390.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">0.191 -&gt; 0.289</text><text x="489.0" y="410.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">forecast skill, base -&gt; SFT 4</text><rect x="705.5" y="366.0" width="214.5" height="56.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="717.5" y="390.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">~15%</text><text x="717.5" y="410.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">less error than base (Aug-Sep)</text></svg>