<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 485" width="940" height="485" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="485" fill="#ffffff"/><text x="24.0" y="34.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Balancing an MoE router: throughput first, then what each balancer leaves behind</text><text x="24.0" y="54.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Handbook measurements on the 6.86B-A1.22B MoE (64 experts, top-8, EP8 on one 8xH100 node); published numbers on the right</text><rect x="24.0" y="76.0" width="520.0" height="360.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><text x="40.0" y="102.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">A. Median TFLOP/s over iterations 101-120</text><text x="40.0" y="120.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Runs from init, one seed; gray bars are forced-routing controls</text><text x="40.0" y="160.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Forced-even (control)</text><rect x="210.1" y="148.0" width="258.8" height="16.0" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="474.9" y="161.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">149.4</text><text x="210.1" y="179.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">random logits; never train</text><text x="40.0" y="204.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Quantile balancing</text><rect x="210.1" y="192.0" width="240.8" height="16.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="456.9" y="205.0" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="start">139</text><text x="210.1" y="223.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">highest final LM loss of the five</text><text x="40.0" y="248.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Aux loss, coeff 1e-3</text><rect x="210.1" y="236.0" width="216.5" height="16.0" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><text x="432.6" y="249.0" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">125</text><text x="210.1" y="267.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">the setting of the first MoE run</text><text x="40.0" y="292.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Quantile + EMA 0.9</text><rect x="210.1" y="280.0" width="209.6" height="16.0" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="425.7" y="293.0" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">121</text><text x="210.1" y="311.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">bias lags the router</text><text x="40.0" y="336.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Forced-biased, max skew</text><rect x="210.1" y="324.0" width="174.1" height="16.0" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="390.2" y="337.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">100.5</text><text x="210.1" y="355.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">MaxVio 7: one expert gets all</text><text x="40.0" y="380.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Loss-free bias, 1e-3</text><rect x="210.1" y="368.0" width="171.5" height="16.0" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="387.6" y="381.0" font-size="12.5" font-weight="700" fill="#7f1d1d" text-anchor="start">99</text><text x="210.1" y="399.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">sigmoid; bf16 counts at that commit</text><line x1="210.1" y1="412.0" x2="487.2" y2="412.0" stroke="#64748b" stroke-width="1"/><line x1="210.1" y1="412.0" x2="210.1" y2="416.0" stroke="#64748b" stroke-width="1"/><text x="210.1" y="428.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">0</text><line x1="296.7" y1="412.0" x2="296.7" y2="416.0" stroke="#64748b" stroke-width="1"/><text x="296.7" y="428.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">50</text><line x1="383.3" y1="412.0" x2="383.3" y2="416.0" stroke="#64748b" stroke-width="1"/><text x="383.3" y="428.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">100</text><line x1="469.9" y1="412.0" x2="469.9" y2="416.0" stroke="#64748b" stroke-width="1"/><text x="469.9" y="428.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">150</text><rect x="562.0" y="76.0" width="354.0" height="360.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><text x="578.0" y="102.0" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">B. What balance metrics hide</text><text x="578.0" y="120.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Read MaxVio = max(c) / mean(c) - 1 at your scope</text><rect x="576.0" y="134.0" width="326.0" height="66.5" rx="6" fill="#eff6ff" stroke="#dbeafe" stroke-width="1"/><rect x="576.0" y="134.0" width="4.0" height="66.5" rx="0" fill="#2563eb" stroke="none" stroke-width="1"/><text x="590.0" y="157.0" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="start">Aux loss vs loss-free bias (1B, 64E top-6)</text><text x="590.0" y="172.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Aux loss at 1e-3: MaxVio 0.72, perplexity 9.56</text><text x="590.0" y="187.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Loss-free bias: MaxVio 0.04, perplexity 9.50</text><rect x="576.0" y="208.5" width="326.0" height="66.5" rx="6" fill="#fef2f2" stroke="#fee2e2" stroke-width="1"/><rect x="576.0" y="208.5" width="4.0" height="66.5" rx="0" fill="#dc2626" stroke="none" stroke-width="1"/><text x="590.0" y="231.5" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="start">Sign-update bias at rate 1e-3</text><text x="590.0" y="246.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">At 1,024 experts, the busiest expert gets</text><text x="590.0" y="261.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">about 50x the mean load (aux 1e-2: under 7x)</text><rect x="576.0" y="283.0" width="326.0" height="66.5" rx="6" fill="#f5f3ff" stroke="#ede9fe" stroke-width="1"/><rect x="576.0" y="283.0" width="4.0" height="66.5" rx="0" fill="#7c3aed" stroke="none" stroke-width="1"/><text x="590.0" y="306.0" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="start">Global batch hides local skew (7.5B)</text><text x="590.0" y="321.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Quantile bias: global-batch MaxVio 0.92,</text><text x="590.0" y="336.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">yet the worst EP micro-batch sits at 5.96</text><rect x="576.0" y="357.5" width="326.0" height="66.5" rx="6" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/><rect x="576.0" y="357.5" width="4.0" height="66.5" rx="0" fill="#d97706" stroke="none" stroke-width="1"/><text x="590.0" y="380.5" font-size="12" font-weight="700" fill="#78350f" text-anchor="start">Global-batch aux loss (43B)</text><text x="590.0" y="395.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Domain experts can form, but uneven GPU load</text><text x="590.0" y="410.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">makes each step about 5.8% slower</text><text x="24.0" y="458.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Quantile balancing led on throughput but ended with the highest training loss, so speed alone does not prove faster training to the same quality. Bias-only used sigmoid</text><text x="24.0" y="473.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">scores; the other four used softmax.</text></svg>