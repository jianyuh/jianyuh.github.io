<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 675" width="940" height="675" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="940" height="675" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="17.5" fill="#0f172a" font-weight="700">DSec: the sandbox layer under DeepSeek's agentic RL</text>
  <text x="470" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">One scale unit: ~160 CPU nodes · 30K cores · 250 TB DRAM · ~3M sandboxes/day · ~380K live at peak</text>
  <rect x="22" y="68" width="896" height="248" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="38" y="89" font-size="12.5" fill="#1d4ed8" font-weight="700">ONE CLIENT, FOUR ISOLATION BOUNDARIES, SHARED STORAGE</text>
  <rect x="38" y="112" width="150" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="113" y="134" text-anchor="middle" font-size="10.6" fill="#334155" font-weight="700">libdsec</text>
  <text x="113" y="150" text-anchor="middle" font-size="9.2" fill="#64748b">unified Python client</text>
  <rect x="218" y="112" width="300" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="368" y="134" text-anchor="middle" font-size="10.6" fill="#1d4ed8" font-weight="700">cluster services</text>
  <text x="368" y="150" text-anchor="middle" font-size="9.2" fill="#64748b">IAM · stateless API server · power-of-k placement</text>
  <rect x="548" y="112" width="354" height="50" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="725" y="134" text-anchor="middle" font-size="10.6" fill="#6d28d9" font-weight="700">per-node runtime</text>
  <text x="725" y="150" text-anchor="middle" font-size="9.2" fill="#64748b">Edge (admission) -&gt; Aether (proxy) -&gt; Chronus (sessions)</text>
  <line x1="192" y1="137" x2="214" y2="137" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a94a3b8)"/>
  <line x1="522" y1="137" x2="544" y2="137" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a94a3b8)"/>
  <rect x="38" y="192" width="204" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="140" y="214" text-anchor="middle" font-size="10.6" fill="#047857" font-weight="700">FnCall</text>
  <text x="140" y="230" text-anchor="middle" font-size="9.2" fill="#64748b">process pool · OJ, kernels</text>
  <path d="M725.0,164 L725.0,174 L140.0,174 L140.0,189" fill="none" stroke="#c4b5fd" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ac4b5fd)"/>
  <line x1="140" y1="244" x2="140" y2="264" stroke="#cbd5e1" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <rect x="258" y="192" width="204" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="360" y="214" text-anchor="middle" font-size="10.6" fill="#1d4ed8" font-weight="700">Container</text>
  <text x="360" y="230" text-anchor="middle" font-size="9.2" fill="#64748b">Docker in QEMU · 3,200/node</text>
  <path d="M725.0,164 L725.0,174 L360.0,174 L360.0,189" fill="none" stroke="#c4b5fd" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ac4b5fd)"/>
  <line x1="360" y1="244" x2="360" y2="264" stroke="#cbd5e1" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <rect x="478" y="192" width="204" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="580" y="214" text-anchor="middle" font-size="10.6" fill="#b91c1c" font-weight="700">MicroVM</text>
  <text x="580" y="230" text-anchor="middle" font-size="9.2" fill="#64748b">Firecracker · 800/node</text>
  <path d="M725.0,164 L725.0,174 L580.0,174 L580.0,189" fill="none" stroke="#c4b5fd" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ac4b5fd)"/>
  <line x1="580" y1="244" x2="580" y2="264" stroke="#cbd5e1" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <rect x="698" y="192" width="204" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="800" y="214" text-anchor="middle" font-size="10.6" fill="#b45309" font-weight="700">Full VM</text>
  <text x="800" y="230" text-anchor="middle" font-size="9.2" fill="#64748b">QEMU + virtio-gpu · GUI, Android</text>
  <path d="M725.0,164 L725.0,174 L800.0,174 L800.0,189" fill="none" stroke="#c4b5fd" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ac4b5fd)"/>
  <line x1="800" y1="244" x2="800" y2="264" stroke="#cbd5e1" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/>
  <rect x="38" y="266" width="864" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="470" y="287" text-anchor="middle" font-size="10.4" fill="#334155" font-weight="700">3FS distributed storage (RDMA): EROFS metadata + data blobs, OverlayBD block images for MicroVMs</text>
  <rect x="22" y="330" width="439" height="259.2" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="38" y="351" font-size="12" fill="#b45309" font-weight="700">COMPOSABLE LAYERS, NOT MONOLITHIC IMAGES</text>
  <rect x="38" y="372" width="407" height="34" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="50" y="393" font-size="10.2" fill="#334155" font-weight="700">upper: local ext4, writable</text>
  <text x="433" y="393" text-anchor="end" font-size="9.3" fill="#64748b">all runtime writes stay on the node</text>
  <rect x="38" y="412" width="407" height="34" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
  <text x="50" y="433" font-size="10.2" fill="#b45309" font-weight="700">lower 3: toolkit (EROFS)</text>
  <text x="433" y="433" text-anchor="end" font-size="9.3" fill="#64748b">rebuild alone: O(k)</text>
  <rect x="38" y="452" width="407" height="34" rx="7" fill="#ffffff" stroke="#059669" stroke-width="1.3"/>
  <text x="50" y="473" font-size="10.2" fill="#047857" font-weight="700">lower 2: workspace (EROFS)</text>
  <text x="433" y="473" text-anchor="end" font-size="9.3" fill="#64748b">one per task, N of them</text>
  <rect x="38" y="492" width="407" height="34" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="50" y="513" font-size="10.2" fill="#1d4ed8" font-weight="700">lower 1: base OS (EROFS)</text>
  <text x="433" y="513" text-anchor="end" font-size="9.3" fill="#64748b">rebuild alone: O(m)</text>
  <text x="38" y="544" font-size="9.6" fill="#475569">Monolithic images cost O(mN) + O(kN) rebuilds. Agents read only 4-13% of image bytes, so</text>
  <text x="38" y="557.4" font-size="9.6" fill="#475569">EROFS data blocks come from 3FS on demand, while metadata is pulled local up front.</text>
  <rect x="479" y="330" width="439" height="259.2" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="495" y="351" font-size="12" fill="#b91c1c" font-weight="700">ROLLOUT STATE OFF THE GPU; THE POLICY AS ADVERSARY</text>
  <rect x="495" y="372" width="407" height="54.8" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="505" y="388" font-size="10.2" fill="#334155" font-weight="700">before</text>
  <text x="505" y="404" font-size="9.6" fill="#475569">Agent loop inside the preemptible GPU pod. Preemption kills the loop and resuming needs</text>
  <text x="505" y="417.4" font-size="9.6" fill="#475569">command-log replay to rebuild sandbox state.</text>
  <rect x="495" y="436.8" width="407" height="68.2" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.3"/>
  <text x="505" y="452.8" font-size="10.2" fill="#047857" font-weight="700">since DeepSeek-V4.1</text>
  <text x="505" y="468.8" font-size="9.6" fill="#475569">Trainer -&gt; async RPC -&gt; DSec, which hosts a scaffold-agnostic worker plus the sandbox.</text>
  <text x="505" y="482.2" font-size="9.6" fill="#475569">On preemption containers pause and swap, MicroVMs snapshot; the trainer reconnects</text>
  <text x="505" y="495.6" font-size="9.6" fill="#475569">with no replay.</text>
  <rect x="495" y="515" width="407" height="68.2" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <text x="505" y="531" font-size="10.2" fill="#b91c1c" font-weight="700">reward hacking and defense</text>
  <text x="505" y="547" font-size="9.6" fill="#475569">Seen: Chronus socket forgery, XFS extent swaps that panic the kernel, port scans for</text>
  <text x="505" y="560.4" font-size="9.6" fill="#475569">solutions. Defense: AppArmor even for root in the container, and per-sandbox eBPF</text>
  <text x="505" y="573.8" font-size="9.6" fill="#475569">allowlists by IP, port and protocol.</text>
  <rect x="22" y="605.2" width="168" height="50" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="106" y="631.2" text-anchor="middle" font-size="14.5" fill="#1d4ed8" font-weight="700">1.71x</text>
  <text x="106" y="646.2" text-anchor="middle" font-size="9" fill="#64748b">8,192 burst, EROFS on-demand</text>
  <rect x="204" y="605.2" width="168" height="50" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="288" y="631.2" text-anchor="middle" font-size="14.5" fill="#1d4ed8" font-weight="700">1.76x</text>
  <text x="288" y="646.2" text-anchor="middle" font-size="9" fill="#64748b">workspace mount vs tar.gz</text>
  <rect x="386" y="605.2" width="168" height="50" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="470" y="631.2" text-anchor="middle" font-size="14.5" fill="#047857" font-weight="700">-40.2%</text>
  <text x="470" y="646.2" text-anchor="middle" font-size="9" fill="#64748b">peak host mem, virtio-pmem</text>
  <rect x="568" y="605.2" width="168" height="50" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="652" y="631.2" text-anchor="middle" font-size="14.5" fill="#047857" font-weight="700">-21.2%</text>
  <text x="652" y="646.2" text-anchor="middle" font-size="9" fill="#64748b">time-integ. mem, DAMON+FPR</text>
  <rect x="750" y="605.2" width="168" height="50" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
  <text x="834" y="631.2" text-anchor="middle" font-size="14.5" fill="#b45309" font-weight="700">17.3%</text>
  <text x="834" y="646.2" text-anchor="middle" font-size="9" fill="#64748b">SMT inflation (was 45.2%)</text>
  <defs>
    <marker id="a94a3b8" markerWidth="6" markerHeight="5.2" refX="5.6" refY="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.4,0.5 L5.8,2.6 L0.4,4.7 Z" fill="#94a3b8"/></marker>
    <marker id="ac4b5fd" markerWidth="6" markerHeight="5.2" refX="5.6" refY="2.6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.4,0.5 L5.8,2.6 L0.4,4.7 Z" fill="#c4b5fd"/></marker>
  </defs>
</svg>
