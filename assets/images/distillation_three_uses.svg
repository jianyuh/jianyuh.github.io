<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 477" width="940" height="477" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="477" fill="#ffffff"/><text x="20.0" y="34.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Three ways frontier labs distill in 2026</text><text x="20.0" y="56.0" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Same teacher-student mechanic; what changes is who the teacher is and whose tokens get graded</text><rect x="20.0" y="76.0" width="290.7" height="361.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="34.0" y="104.0" font-size="15" font-weight="700" fill="#1e293b" text-anchor="start">1. Big teacher, small student</text><text x="34.0" y="126.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">off-policy</text><rect x="34.0" y="138.0" width="262.7" height="30.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/><text x="44.0" y="157.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">Large IT teacher</text><line x1="60.0" y1="171.0" x2="60.0" y2="211.0" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><text x="72.0" y="195.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">soft labels or text</text><rect x="34.0" y="214.0" width="262.7" height="30.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="44.0" y="233.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Smaller student</text><text x="34.0" y="270.0" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">•</text><text x="46.0" y="270.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Soft labels: match the teacher's next-token</text><text x="46.0" y="287.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">distribution (white-box, needs logits).</text><text x="34.0" y="310.0" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">•</text><text x="46.0" y="310.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Hard labels: SFT on the teacher's</text><text x="46.0" y="327.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">generated text (black-box, text only).</text><text x="34.0" y="358.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">Examples: Gemma 3, DeepSeek-R1-Distill</text><rect x="324.7" y="76.0" width="290.7" height="361.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="338.7" y="104.0" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="start">2. Merge RL experts (MOPD)</text><text x="338.7" y="126.0" font-size="12" font-weight="400" fill="#7c3aed" text-anchor="start" font-style="italic">on-policy</text><rect x="338.7" y="138.0" width="262.7" height="30.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="348.7" y="157.0" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">Math / code / agent RL experts</text><line x1="364.7" y1="171.0" x2="364.7" y2="211.0" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><text x="376.7" y="195.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">per-token reverse KL</text><rect x="338.7" y="214.0" width="262.7" height="30.0" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/><text x="348.7" y="233.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">One unified student</text><text x="338.7" y="270.0" font-size="12.5" font-weight="400" fill="#7c3aed" text-anchor="start">•</text><text x="350.7" y="270.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Experts are same-size checkpoints of the</text><text x="350.7" y="287.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">same base, each pushed by SFT then</text><text x="350.7" y="304.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">GRPO in one domain.</text><text x="338.7" y="327.0" font-size="12.5" font-weight="400" fill="#7c3aed" text-anchor="start">•</text><text x="350.7" y="327.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">The student writes its own rollouts; every</text><text x="350.7" y="344.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">teacher grades every token.</text><text x="338.7" y="375.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">Examples: DeepSeek-V4, MiMo-V2-Flash,</text><text x="338.7" y="391.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">Nemotron 3 Ultra (10+ teachers), GLM-5</text><rect x="629.3" y="76.0" width="290.7" height="361.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="643.3" y="104.0" font-size="15" font-weight="700" fill="#14532d" text-anchor="start">3. The teacher is you</text><text x="643.3" y="126.0" font-size="12" font-weight="400" fill="#16a34a" text-anchor="start" font-style="italic">self-distillation</text><rect x="643.3" y="138.0" width="262.7" height="46.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="653.3" y="157.0" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="start">Same model + hint, or earlier</text><text x="653.3" y="173.0" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="start">checkpoint</text><line x1="669.3" y1="187.0" x2="669.3" y2="227.0" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><text x="681.3" y="211.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">per-token KL</text><rect x="643.3" y="230.0" width="262.7" height="30.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/><text x="653.3" y="249.0" font-size="12.5" font-weight="700" fill="#334155" text-anchor="start">Same model, no hint</text><text x="643.3" y="286.0" font-size="12.5" font-weight="400" fill="#16a34a" text-anchor="start">•</text><text x="655.3" y="286.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Hint-conditioned self teaches the unhinted</text><text x="655.3" y="303.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">self, so the behavior survives without the</text><text x="655.3" y="320.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">hint.</text><text x="643.3" y="343.0" font-size="12.5" font-weight="400" fill="#16a34a" text-anchor="start">•</text><text x="655.3" y="343.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">An earlier checkpoint restores what</text><text x="655.3" y="360.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">fine-tuning erased (continual learning).</text><text x="643.3" y="391.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">Examples: Cursor Composer 2.5, Thinking</text><text x="643.3" y="407.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">Machines</text><text x="20.0" y="463.0" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">Why it is cheap: a teacher scores every token, while an RL reward is one number per attempt (Qwen3: about 1/10 the GPU hours of RL).</text></svg>