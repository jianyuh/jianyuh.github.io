<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="940" height="450" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="18" fill="#0f172a" font-weight="700">Mixture-of-Recursions: Middle-Cycle Sharing + Expert-Choice Depth</text>
  <text x="470" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">N_r = 3   ·   unshared entry and exit layers   ·   a token reaches step r+1 only if it was selected at step r</text>
  <rect x="22" y="68" width="580" height="214" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="38" y="89" font-size="12.5" fill="#1d4ed8" font-weight="700">TOKEN-LEVEL DEPTH  (expert-choice, hierarchical)</text>
  <rect x="82" y="98" width="46" height="118" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="105" y="110" text-anchor="middle" font-size="10" fill="#334155" font-weight="700">entry</text>
  <rect x="540" y="98" width="46" height="118" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="563" y="110" text-anchor="middle" font-size="10" fill="#334155" font-weight="700">exit</text>
  <rect x="136" y="98" width="126.667" height="118" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="199.333" y="110" text-anchor="middle" font-size="10.5" fill="#1d4ed8" font-weight="700">step 1</text>
  <rect x="270.667" y="98" width="126.667" height="118" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="334" y="110" text-anchor="middle" font-size="10.5" fill="#1d4ed8" font-weight="700">step 2</text>
  <rect x="405.333" y="98" width="126.667" height="118" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="468.667" y="110" text-anchor="middle" font-size="10.5" fill="#1d4ed8" font-weight="700">step 3</text>
  <text x="72" y="133" text-anchor="end" font-size="9.3" fill="#64748b">tok A</text>
  <rect x="145" y="125" width="108.667" height="11" rx="5" fill="#93c5fd" stroke="none" stroke-width="1.4"/>
  <rect x="279.667" y="125" width="108.667" height="11" rx="5" fill="#93c5fd" stroke="none" stroke-width="1.4"/>
  <rect x="414.333" y="125" width="108.667" height="11" rx="5" fill="#93c5fd" stroke="none" stroke-width="1.4"/>
  <rect x="91" y="125" width="28" height="11" rx="5" fill="#cbd5e1" stroke="none" stroke-width="1.4"/>
  <rect x="549" y="125" width="28" height="11" rx="5" fill="#cbd5e1" stroke="none" stroke-width="1.4"/>
  <text x="72" y="155" text-anchor="end" font-size="9.3" fill="#64748b">tok B</text>
  <rect x="145" y="147" width="108.667" height="11" rx="5" fill="#93c5fd" stroke="none" stroke-width="1.4"/>
  <rect x="279.667" y="147" width="108.667" height="11" rx="5" fill="#93c5fd" stroke="none" stroke-width="1.4"/>
  <rect x="414.333" y="147" width="108.667" height="11" rx="5" fill="#93c5fd" stroke="none" stroke-width="1.4"/>
  <rect x="91" y="147" width="28" height="11" rx="5" fill="#cbd5e1" stroke="none" stroke-width="1.4"/>
  <rect x="549" y="147" width="28" height="11" rx="5" fill="#cbd5e1" stroke="none" stroke-width="1.4"/>
  <text x="72" y="177" text-anchor="end" font-size="9.3" fill="#64748b">tok C</text>
  <rect x="145" y="169" width="108.667" height="11" rx="5" fill="#93c5fd" stroke="none" stroke-width="1.4"/>
  <rect x="279.667" y="169" width="108.667" height="11" rx="5" fill="#93c5fd" stroke="none" stroke-width="1.4"/>
  <text x="468.667" y="177" text-anchor="middle" font-size="9" fill="#cbd5e1">exited</text>
  <rect x="91" y="169" width="28" height="11" rx="5" fill="#cbd5e1" stroke="none" stroke-width="1.4"/>
  <text x="72" y="199" text-anchor="end" font-size="9.3" fill="#64748b">tok D</text>
  <rect x="145" y="191" width="108.667" height="11" rx="5" fill="#93c5fd" stroke="none" stroke-width="1.4"/>
  <text x="334" y="199" text-anchor="middle" font-size="9" fill="#cbd5e1">exited</text>
  <text x="468.667" y="199" text-anchor="middle" font-size="9" fill="#cbd5e1">exited</text>
  <rect x="91" y="191" width="28" height="11" rx="5" fill="#cbd5e1" stroke="none" stroke-width="1.4"/>
  <text x="38" y="240" font-size="10.3" fill="#475569">gate:  g = G(θ_r^T · H)  &gt;  P_β(G^r)   ·   an auxiliary BCE loss makes g bimodal,</text>
  <text x="38" y="255" font-size="10.3" fill="#475569">so decoding drops the sort and uses a static 0.5 threshold</text>
  <rect x="620" y="68" width="298" height="214" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="636" y="89" font-size="12.5" fill="#6d28d9" font-weight="700">TWO KV STRATEGIES  (N_r = 3)</text>
  <rect x="634" y="98" width="270" height="76" rx="9" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="646" y="118" font-size="11.5" fill="#6d28d9" font-weight="700">Recursion-wise caching</text>
  <text x="646" y="136" font-size="10" fill="#475569">memory  (N_r+1)/2N_r  =  0.67×</text>
  <text x="646" y="151" font-size="10" fill="#475569">IO  0.67×</text>
  <text x="646" y="166" font-size="10" fill="#475569">attention FLOPs  ~ (k/N_ctx)²  quadratic</text>
  <rect x="634" y="184" width="270" height="76" rx="9" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="646" y="204" font-size="11.5" fill="#6d28d9" font-weight="700">Recursive KV sharing</text>
  <text x="646" y="222" font-size="10" fill="#475569">memory  1/N_r  =  0.33×</text>
  <text x="646" y="237" font-size="10" fill="#475569">IO  1.0×  (step-1 cache refetched)</text>
  <text x="646" y="252" font-size="10" fill="#475569">attention FLOPs  ~ k/N_ctx  linear</text>
  <text x="634" y="268" font-size="9.8" fill="#64748b">every token runs step 1, which is what makes sharing legal</text>
  <rect x="22" y="298" width="439" height="92" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="241.5" y="323.44" text-anchor="middle" font-size="11.5" fill="#047857" font-weight="700">Routing ablation  (N_r = 3, 118M)</text>
  <text x="241.5" y="341.44" text-anchor="middle" font-size="10.3" fill="#475569">Expert-Choice NLL 2.8667, downstream 40.1% versus Token-Choice NLL 2.9358,</text>
  <text x="241.5" y="355.94" text-anchor="middle" font-size="10.3" fill="#475569">downstream 39.1%. EC re-decides at every step; TC commits once and must balance</text>
  <text x="241.5" y="370.44" text-anchor="middle" font-size="10.3" fill="#475569">experts of unequal cost.</text>
  <rect x="479" y="298" width="439" height="92" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="698.5" y="330.69" text-anchor="middle" font-size="11.5" fill="#334155" font-weight="700">Continuous depth-wise batching  (H100)</text>
  <text x="698.5" y="348.69" text-anchor="middle" font-size="10.3" fill="#475569">Max batch 32 vanilla, 42 MoR-2, 48 MoR-3, 51 MoR-4. An exiting token's slot is refilled</text>
  <text x="698.5" y="363.19" text-anchor="middle" font-size="10.3" fill="#475569">from the FIFO queue at once, giving up to 2.06× serving throughput.</text>
  <text x="470" y="412" text-anchor="middle" font-size="11" fill="#475569">Sharing ablation, FineWeb-Edu 10B, NLL at 135M / 360M:   Sequence 3.1637 / 3.0245   ·   Middle-Sequence 3.1602 / 2.9753</text>
  <text x="470" y="430" text-anchor="middle" font-size="11" fill="#475569">Cycle 3.1154 / 2.9363   ·   Middle-Cycle 3.1048 / 2.8760   —   unshared boundaries plus a cyclic interior win, and the gap widens with scale</text>
</svg>
