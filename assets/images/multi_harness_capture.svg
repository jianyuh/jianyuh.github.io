<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 506" width="940" height="506" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="506" fill="#ffffff"/><text x="20.0" y="34.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Multi-harness RL: train through unmodified harnesses by capturing tokens at the model endpoint</text><text x="20.0" y="56.0" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">OpenEnv capture proxy + Harbor tasks and sandboxes + TRL AsyncGRPOTrainer; the harness never talks to vLLM or the trainer</text><rect x="20.0" y="86.0" width="192.0" height="145.4" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="32.0" y="109.9" font-size="14" font-weight="700" fill="#1e293b" text-anchor="start">Harbor task</text><text x="32.0" y="132.1" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Directory with an instruction,</text><text x="32.0" y="148.3" font-size="12" font-weight="400" fill="#334155" text-anchor="start">an environment and a test</text><text x="32.0" y="164.5" font-size="12" font-weight="400" fill="#334155" text-anchor="start">script. Names no harness,</text><text x="32.0" y="180.7" font-size="12" font-weight="400" fill="#334155" text-anchor="start">sandbox or trainer.</text><rect x="256.0" y="86.0" width="192.0" height="145.4" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="268.0" y="109.9" font-size="14" font-weight="700" fill="#14532d" text-anchor="start">Sandbox (E2B /</text><text x="268.0" y="128.8" font-size="14" font-weight="700" fill="#14532d" text-anchor="start">Daytona)</text><text x="268.0" y="151.0" font-size="12" font-weight="400" fill="#334155" text-anchor="start">One per rollout. An</text><text x="268.0" y="167.2" font-size="12" font-weight="400" fill="#334155" text-anchor="start">unmodified harness runs its</text><text x="268.0" y="183.4" font-size="12" font-weight="400" fill="#334155" text-anchor="start">own loop: Claude Code,</text><text x="268.0" y="199.6" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Codex, OpenCode or</text><text x="268.0" y="215.8" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Mini-SWE-Agent.</text><rect x="492.0" y="86.0" width="192.0" height="145.4" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="504.0" y="109.9" font-size="14" font-weight="700" fill="#78350f" text-anchor="start">OpenEnv capture proxy</text><text x="504.0" y="132.1" font-size="12" font-weight="400" fill="#334155" text-anchor="start">API key = per-rollout session</text><text x="504.0" y="148.3" font-size="12" font-weight="400" fill="#334155" text-anchor="start">id. Detects the dialect,</text><text x="504.0" y="164.5" font-size="12" font-weight="400" fill="#334155" text-anchor="start">converts to chat completions,</text><text x="504.0" y="180.7" font-size="12" font-weight="400" fill="#334155" text-anchor="start">never streams from the</text><text x="504.0" y="196.9" font-size="12" font-weight="400" fill="#334155" text-anchor="start">engine.</text><rect x="728.0" y="86.0" width="192.0" height="145.4" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="740.0" y="109.9" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start">vLLM (H100 #2)</text><text x="740.0" y="132.1" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Samples with top_p 1.0, no</text><text x="740.0" y="148.3" font-size="12" font-weight="400" fill="#334155" text-anchor="start">top_k. Returns prompt ids,</text><text x="740.0" y="164.5" font-size="12" font-weight="400" fill="#334155" text-anchor="start">sampled ids and a logprob</text><text x="740.0" y="180.7" font-size="12" font-weight="400" fill="#334155" text-anchor="start">per sampled token.</text><rect x="256.0" y="289.4" width="192.0" height="147.4" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="268.0" y="313.3" font-size="14" font-weight="700" fill="#14532d" text-anchor="start">Verifier</text><text x="268.0" y="335.5" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Runs the task's test script.</text><text x="268.0" y="351.7" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Reward is 0/1 plus a</text><text x="268.0" y="367.9" font-size="12" font-weight="400" fill="#334155" text-anchor="start">tool-efficiency bonus of at</text><text x="268.0" y="384.1" font-size="12" font-weight="400" fill="#334155" text-anchor="start">most 0.1, or None if it never</text><text x="268.0" y="400.3" font-size="12" font-weight="400" fill="#334155" text-anchor="start">ran.</text><rect x="492.0" y="289.4" width="192.0" height="147.4" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="504.0" y="313.3" font-size="14" font-weight="700" fill="#78350f" text-anchor="start">Rollout graph -&gt;</text><text x="504.0" y="332.2" font-size="14" font-weight="700" fill="#78350f" text-anchor="start">TrainingTrace</text><text x="504.0" y="354.4" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Calls linked by longest exact</text><text x="504.0" y="370.6" font-size="12" font-weight="400" fill="#334155" text-anchor="start">token prefix; each root-to-leaf</text><text x="504.0" y="386.8" font-size="12" font-weight="400" fill="#334155" text-anchor="start">path is one sequence, loss</text><text x="504.0" y="403.0" font-size="12" font-weight="400" fill="#334155" text-anchor="start">mask 1 on sampled tokens.</text><rect x="728.0" y="289.4" width="192.0" height="147.4" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="740.0" y="313.3" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="start">TRL</text><text x="740.0" y="332.2" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="start">AsyncGRPOTrainer</text><text x="740.0" y="351.1" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="start">(H100 #1)</text><text x="740.0" y="373.3" font-size="12" font-weight="400" fill="#334155" text-anchor="start">HarnessRolloutWorker; one</text><text x="740.0" y="389.5" font-size="12" font-weight="400" fill="#334155" text-anchor="start">harness per group of 8.</text><text x="740.0" y="405.7" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Rollouts usually 2 steps stale,</text><text x="740.0" y="421.9" font-size="12" font-weight="400" fill="#334155" text-anchor="start">never more than 4.</text><line x1="212.0" y1="158.7" x2="254.0" y2="158.7" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="448.0" y1="150.7" x2="490.0" y2="150.7" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="492.0" y1="166.7" x2="450.0" y2="166.7" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="684.0" y1="150.7" x2="726.0" y2="150.7" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="728.0" y1="166.7" x2="686.0" y2="166.7" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><text x="234.0" y="150.7" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">task</text><text x="470.0" y="144.7" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">calls</text><text x="706.0" y="144.7" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">tokens</text><line x1="352.0" y1="231.4" x2="352.0" y2="287.4" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><text x="360.0" y="264.4" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">finished run</text><line x1="588.0" y1="231.4" x2="588.0" y2="287.4" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><text x="596.0" y="264.4" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">every call recorded</text><line x1="824.0" y1="289.4" x2="824.0" y2="233.4" stroke="#d97706" stroke-width="1.4" marker-end="url(#ah)"/><text x="832.0" y="264.4" font-size="11" font-weight="700" fill="#78350f" text-anchor="start">new weights</text><line x1="448.0" y1="363.1" x2="490.0" y2="363.1" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><text x="470.0" y="357.1" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">reward</text><line x1="684.0" y1="363.1" x2="726.0" y2="363.1" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><text x="706.0" y="357.1" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">trace</text><rect x="20.0" y="289.4" width="192.0" height="199.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/><text x="32.0" y="313.4" font-size="14" font-weight="700" fill="#7f1d1d" text-anchor="start">Guard rails</text><text x="32.0" y="335.4" font-size="11.5" font-weight="400" fill="#dc2626" text-anchor="start">•</text><text x="44.0" y="335.4" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">ATIF cross-check: turns and</text><text x="44.0" y="350.4" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">tokens per call must match</text><text x="44.0" y="365.4" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Harbor's own trajectory</text><text x="32.0" y="386.4" font-size="11.5" font-weight="400" fill="#dc2626" text-anchor="start">•</text><text x="44.0" y="386.4" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">top_p 1.0: importance ratio</text><text x="44.0" y="401.4" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">0.985-0.993 -&gt;</text><text x="44.0" y="416.4" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">0.9984-0.9999</text><text x="32.0" y="437.4" font-size="11.5" font-weight="400" fill="#dc2626" text-anchor="start">•</text><text x="44.0" y="437.4" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Failed rollout: ok=False,</text><text x="44.0" y="452.4" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">reward=None, never an</text><text x="44.0" y="467.4" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">exception</text></svg>