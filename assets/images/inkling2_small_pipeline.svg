<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 377" width="940" height="377" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="377" fill="#ffffff"/><text x="20.0" y="34.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Inkling 2 Small: four pretraining phases, then one joint RL run</text><text x="20.0" y="56.0" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">Each pretraining phase is smaller, cleaner and closer to the deployment format than the one before it</text><rect x="20.0" y="82.0" width="162.4" height="174.9" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="30.0" y="103.0" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">H1 · broad pretrain</text><text x="30.0" y="129.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">8.4T tokens</text><text x="30.0" y="152.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Text, code and images. 68</text><text x="30.0" y="167.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">hours on GB300 NVL72</text><text x="30.0" y="183.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">racks, natively in NVFP4,</text><text x="30.0" y="198.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">with high expert</text><text x="30.0" y="214.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">parallelism.</text><rect x="204.4" y="82.0" width="162.4" height="174.9" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="214.4" y="103.0" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="start">H2 · newer data</text><text x="214.4" y="129.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">3.8T tokens</text><text x="214.4" y="152.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Higher-quality, newer data</text><text x="214.4" y="167.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">the model had not seen,</text><text x="214.4" y="183.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">at 512K context.</text><line x1="185.4" y1="169.5" x2="201.4" y2="169.5" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="388.8" y="82.0" width="162.4" height="174.9" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="398.8" y="103.0" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">H3 · trajectories</text><text x="398.8" y="129.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">~320B tokens</text><text x="398.8" y="152.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Reasoning and agent</text><text x="398.8" y="167.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">trajectories at 1M context,</text><text x="398.8" y="183.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">mixed with replayed</text><text x="398.8" y="198.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">pretraining data.</text><line x1="369.8" y1="169.5" x2="385.8" y2="169.5" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="573.2" y="82.0" width="162.4" height="174.9" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="583.2" y="103.0" font-size="12.5" font-weight="700" fill="#4c1d95" text-anchor="start">H4 · best only</text><text x="583.2" y="129.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">~34B tokens</text><text x="583.2" y="152.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Only the highest-quality</text><text x="583.2" y="167.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">agent trajectories. H3/H4</text><text x="583.2" y="183.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">are mostly samples from</text><text x="583.2" y="198.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Kimi K3 and earlier Inkling</text><text x="583.2" y="214.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">models, filtered for</text><text x="583.2" y="229.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">correctness and</text><text x="583.2" y="245.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">alignment.</text><line x1="554.2" y1="169.5" x2="570.2" y2="169.5" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><rect x="757.6" y="82.0" width="162.4" height="174.9" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="767.6" y="103.0" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="start">Joint RL</text><text x="767.6" y="129.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">3T+ tokens</text><text x="767.6" y="152.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">1,075 steps, 17M+</text><text x="767.6" y="167.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">rollouts, 2,048 GPUs, 9</text><text x="767.6" y="183.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">days, over 4×10²³ FLOPs.</text><text x="767.6" y="198.5" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">One run for every task</text><text x="767.6" y="214.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">family.</text><line x1="738.6" y1="169.5" x2="754.6" y2="169.5" stroke="#64748b" stroke-width="1.2" marker-end="url(#ah)"/><line x1="20.0" y1="272.9" x2="366.8" y2="272.9" stroke="#1e3a8a" stroke-width="1.2"/><line x1="20.0" y1="267.9" x2="20.0" y2="272.9" stroke="#1e3a8a" stroke-width="1.2"/><line x1="366.8" y1="267.9" x2="366.8" y2="272.9" stroke="#1e3a8a" stroke-width="1.2"/><text x="193.4" y="289.9" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">pretraining: ~12.2T tokens</text><line x1="388.8" y1="272.9" x2="735.6" y2="272.9" stroke="#4c1d95" stroke-width="1.2"/><line x1="388.8" y1="267.9" x2="388.8" y2="272.9" stroke="#4c1d95" stroke-width="1.2"/><line x1="735.6" y1="267.9" x2="735.6" y2="272.9" stroke="#4c1d95" stroke-width="1.2"/><text x="562.2" y="289.9" font-size="11.5" font-weight="700" fill="#4c1d95" text-anchor="middle">deployment-format data: ~354B tokens</text><line x1="757.6" y1="272.9" x2="920.0" y2="272.9" stroke="#14532d" stroke-width="1.2"/><line x1="757.6" y1="267.9" x2="757.6" y2="272.9" stroke="#14532d" stroke-width="1.2"/><line x1="920.0" y1="267.9" x2="920.0" y2="272.9" stroke="#14532d" stroke-width="1.2"/><text x="838.8" y="289.9" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">reward, not imitation</text><rect x="20.0" y="312.9" width="900.0" height="51.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 3"/><text x="32.0" y="333.9" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Contrast with the first Inkling: 45T pretraining tokens, then separate reasoning and agentic RL runs merged by multi-teacher distillation. Inkling 2 Small</text><text x="32.0" y="350.4" font-size="12" font-weight="400" fill="#334155" text-anchor="start">pretrains on about a quarter of that and replaces the merge with a single RL run.</text></svg>