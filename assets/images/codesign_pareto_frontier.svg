<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Throughput vs. Interactivity: sliding along the frontier vs. moving it</text>

  <!-- axes -->
  <line x1="90" y1="340" x2="600" y2="340" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="90" y1="340" x2="90" y2="60" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="345" y="372" text-anchor="middle" font-size="13" fill="#475569">Interactivity &#8594; tokens/s/user  (1 / inter-token latency)</text>
  <text x="30" y="200" text-anchor="middle" font-size="13" fill="#475569" transform="rotate(-90 30 200)">Throughput &#8594; tokens/s/GPU</text>

  <!-- baseline frontier -->
  <path d="M110,95 C 230,110 320,175 380,250 C 415,295 440,320 470,332" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="300" y="212" font-size="12" fill="#64748b" transform="rotate(30 300 212)">baseline frontier</text>

  <!-- expanded frontier -->
  <path d="M112,72 C 280,88 400,150 480,235 C 525,285 555,318 590,332" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="405" y="185" font-size="12.5" font-weight="600" fill="#2563eb" transform="rotate(32 405 185)">after co-design</text>

  <!-- operating points on baseline -->
  <circle cx="150" cy="100" r="5" fill="#059669"/>
  <text x="160" y="94" font-size="11.5" fill="#059669">large batch</text>
  <text x="160" y="108" font-size="10.5" fill="#64748b">high throughput, slow per user</text>
  <circle cx="410" cy="286" r="5" fill="#dc2626"/>
  <text x="330" y="308" font-size="11.5" fill="#dc2626">small batch</text>
  <text x="278" y="322" font-size="10.5" fill="#64748b">fast per user, GPU idle on weight loads</text>

  <!-- slide-along arrow -->
  <path d="M172,118 C 250,150 330,215 392,272" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ga)"/>
  <text x="205" y="168" font-size="11" fill="#64748b" transform="rotate(35 205 168)">batch size: slides along</text>

  <!-- push-out arrows -->
  <line x1="252" y1="140" x2="292" y2="112" stroke="#2563eb" stroke-width="2" marker-end="url(#ba)"/>
  <line x1="392" y1="252" x2="440" y2="228" stroke="#2563eb" stroke-width="2" marker-end="url(#ba)"/>

  <!-- SLA band -->
  <line x1="470" y1="60" x2="470" y2="340" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="478" y="74" font-size="11" fill="#7c3aed">ITL SLA</text>
  <text x="478" y="88" font-size="10.5" fill="#7c3aed">the only fair comparison</text>
  <text x="478" y="102" font-size="10.5" fill="#7c3aed">is at fixed x</text>

  <!-- levers box -->
  <rect x="612" y="120" width="136" height="196" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="680" y="142" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">Co-design levers</text>
  <g font-size="10.8" fill="#334155">
    <text x="624" y="166">1. Low precision</text>
    <text x="632" y="180" fill="#64748b">FP8 &#8594; NVFP4</text>
    <text x="624" y="202">2. GEMM shapes</text>
    <text x="632" y="216" fill="#64748b">raise min(N, K)</text>
    <text x="624" y="238">3. Tile alignment</text>
    <text x="632" y="252" fill="#64748b">128 / 256 / 512</text>
    <text x="624" y="274">4. Parallel layout</text>
    <text x="632" y="288" fill="#64748b">wide EP + Helix</text>
    <text x="632" y="302" fill="#64748b">M&#8337;&#8339;&#8342;&#8337;&#8341;&#8348; = Ck/E</text>
  </g>

  <text x="345" y="398" text-anchor="middle" font-size="12" fill="#7c3aed">Area under the frontier &#8212; not any single tokens/s number &#8212; is the deployment metric.</text>

  <defs>
    <marker id="ba" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="ga" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
