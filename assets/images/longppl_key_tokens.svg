<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="780" height="430" fill="#ffffff"/>
  <text x="390" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Key Tokens: What Standard Perplexity Averages Away</text>

  <!-- token strip -->
  <text x="30" y="66" font-size="12" font-weight="600" fill="#334155">a long document, per-token loss</text>
  <g>
    <rect x="30" y="76" width="46" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="53" y="94" text-anchor="middle" font-size="11" fill="#64748b">0.1</text>
    <rect x="80" y="76" width="46" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="103" y="94" text-anchor="middle" font-size="11" fill="#64748b">0.2</text>
    <rect x="130" y="76" width="46" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="153" y="94" text-anchor="middle" font-size="11" fill="#64748b">0.1</text>
    <rect x="180" y="76" width="46" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="203" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">2.5</text>
    <rect x="230" y="76" width="46" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="253" y="94" text-anchor="middle" font-size="11" fill="#64748b">0.1</text>
    <rect x="280" y="76" width="46" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="303" y="94" text-anchor="middle" font-size="11" fill="#64748b">0.3</text>
    <rect x="330" y="76" width="46" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="353" y="94" text-anchor="middle" font-size="11" fill="#64748b">0.1</text>
    <rect x="380" y="76" width="46" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="403" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">3.1</text>
    <rect x="430" y="76" width="46" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="453" y="94" text-anchor="middle" font-size="11" fill="#64748b">0.2</text>
    <rect x="480" y="76" width="46" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="503" y="94" text-anchor="middle" font-size="11" fill="#64748b">0.1</text>
  </g>
  <text x="546" y="94" font-size="12" fill="#64748b">…  &gt;90% context-agnostic,  &lt;10% key</text>

  <line x1="230" y1="106" x2="230" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="540" y1="106" x2="540" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="30" y="134" width="380" height="58" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="220" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">Standard PPL — uniform 1/n average</text>
  <text x="220" y="178" text-anchor="middle" font-size="11.5" fill="#64748b">key signal diluted 10:1 → corr. with RULER = +0.27</text>

  <rect x="430" y="134" width="320" height="58" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="590" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">LongPPL — key tokens only</text>
  <text x="590" y="178" text-anchor="middle" font-size="11.5" fill="#475569">corr. with RULER = −0.90, LongBench = −0.96</text>

  <!-- intervention -->
  <rect x="30" y="212" width="720" height="122" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="48" y="236" font-size="13.5" font-weight="700" fill="#1d4ed8">How a key token is found: a causal intervention on context length</text>

  <rect x="48" y="248" width="300" height="30" rx="5" fill="#ffffff" stroke="#60a5fa"/>
  <text x="198" y="268" text-anchor="middle" font-size="11.5" fill="#1e293b">long ctx  l_i = (x_1 … x_{i−1})   →  log P(x_i | l_i)</text>
  <rect x="48" y="286" width="300" height="30" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="198" y="306" text-anchor="middle" font-size="11.5" fill="#1e293b">short ctx  s_i = (x_{i−K} … x_{i−1})  →  log P(x_i | s_i)</text>

  <line x1="356" y1="282" x2="392" y2="282" stroke="#2563eb" stroke-width="2" marker-end="url(#a1)"/>

  <rect x="398" y="248" width="164" height="68" rx="6" fill="#faf5ff" stroke="#7c3aed"/>
  <text x="480" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">LSD &gt; α  and  LCL &gt; β</text>
  <text x="480" y="288" text-anchor="middle" font-size="10.5" fill="#7c3aed">α = 2, β = −2, K = 4096</text>
  <text x="480" y="306" text-anchor="middle" font-size="10.5" fill="#64748b">treatment effect + predictability</text>

  <line x1="570" y1="282" x2="604" y2="282" stroke="#7c3aed" stroke-width="2" marker-end="url(#a1)"/>

  <g font-size="11" fill="#334155">
    <text x="616" y="258">key-token detection on LongEval</text>
    <text x="616" y="276">LSD alone</text><text x="736" y="276" text-anchor="end">85.6%</text>
    <text x="616" y="292">LCL alone</text><text x="736" y="292" text-anchor="end">35.4%</text>
    <text x="616" y="310" font-weight="700" fill="#047857">LSD + LCL</text><text x="736" y="310" text-anchor="end" font-weight="700" fill="#047857">98.2%</text>
  </g>

  <!-- longce -->
  <rect x="30" y="348" width="720" height="62" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="48" y="370" font-size="13" font-weight="700" fill="#6d28d9">Same idea as a loss: LongCE</text>
  <text x="48" y="390" font-size="11.5" fill="#475569">weight each token by min(P(x_i|l_i)/P(x_i|s_i), γ=5), model self-estimates in an EM loop</text>
  <text x="736" y="380" text-anchor="end" font-size="12.5" font-weight="700" fill="#059669">LongEval 24.0% → 46.0%</text>
</svg>
