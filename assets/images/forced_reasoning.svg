<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 634" width="940" height="634" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="940" height="634" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="17.5" fill="#0f172a" font-weight="700">FORCED-REASONING: a scratchpad tool becomes the thinking channel</text>
  <text x="470" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">Native reasoning off, first tool call forced; the extracted traces show how frontier models really reason</text>
  <rect x="22" y="68" width="896" height="153.47" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="38" y="89" font-size="12.5" fill="#1d4ed8" font-weight="700">THE PROTOCOL: STANDARD TOOL CALLING, NO WEIGHTS, NO FINE-TUNING</text>
  <rect x="38" y="106" width="193.5" height="67.47" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="134.75" y="126.97" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-weight="700">1 · force</text>
  <text x="134.75" y="144.97" text-anchor="middle" font-size="10" fill="#475569">tool_choice = forced-reasoning; native</text>
  <text x="134.75" y="158.47" text-anchor="middle" font-size="10" fill="#475569">effort = none (or low)</text>
  <rect x="261.5" y="106" width="193.5" height="67.47" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="358.25" y="126.97" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-weight="700">2 · record</text>
  <text x="358.25" y="144.97" text-anchor="middle" font-size="10" fill="#475569">parse_json(call.arguments)[reasoning]</text>
  <text x="358.25" y="158.47" text-anchor="middle" font-size="10" fill="#475569">is the extracted trace</text>
  <line x1="235.5" y1="139.735" x2="257.5" y2="139.735" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a2563eb)"/>
  <rect x="485" y="106" width="193.5" height="67.47" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="581.75" y="126.97" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-weight="700">3 · acknowledge</text>
  <text x="581.75" y="144.97" text-anchor="middle" font-size="10" fill="#475569">append tool_result(Received); trace</text>
  <text x="581.75" y="158.47" text-anchor="middle" font-size="10" fill="#475569">stays in history</text>
  <line x1="459" y1="139.735" x2="481" y2="139.735" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a2563eb)"/>
  <rect x="708.5" y="106" width="193.5" height="67.47" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="805.25" y="126.97" text-anchor="middle" font-size="11.5" fill="#1d4ed8" font-weight="700">4 · loop</text>
  <text x="805.25" y="144.97" text-anchor="middle" font-size="10" fill="#475569">tool_choice = auto until no tool calls,</text>
  <text x="805.25" y="158.47" text-anchor="middle" font-size="10" fill="#475569">then return the visible answer</text>
  <line x1="682.5" y1="139.735" x2="704.5" y2="139.735" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" marker-end="url(#a2563eb)"/>
  <path d="M805.25,175.47 L805.25,195.47 L358.25,195.47 L358.25,179.47" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#a2563eb)"/>
  <rect x="489.75" y="187.47" width="184" height="16" rx="4" fill="#eff6ff"/>
  <text x="581.75" y="198.97" text-anchor="middle" font-size="9.6" fill="#1d4ed8" font-weight="700">model calls the scratchpad again</text>
  <rect x="22" y="235.47" width="439" height="312.8" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="38" y="256.47" font-size="12" fill="#047857" font-weight="700">LENGTH VS. DENSITY OF THE EXTRACTED TRACES</text>
  <rect x="78" y="281.47" width="361" height="188" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="78" y1="438.137" x2="439" y2="438.137" stroke="#eef2f7" stroke-width="1" stroke-linecap="round"/>
  <text x="72" y="441.637" text-anchor="end" font-size="9" fill="#64748b">0.40</text>
  <line x1="78" y1="375.47" x2="439" y2="375.47" stroke="#eef2f7" stroke-width="1" stroke-linecap="round"/>
  <text x="72" y="378.97" text-anchor="end" font-size="9" fill="#64748b">0.50</text>
  <line x1="78" y1="312.803" x2="439" y2="312.803" stroke="#eef2f7" stroke-width="1" stroke-linecap="round"/>
  <text x="72" y="316.303" text-anchor="end" font-size="9" fill="#64748b">0.60</text>
  <line x1="138.167" y1="469.47" x2="138.167" y2="473.47" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <text x="138.167" y="484.47" text-anchor="middle" font-size="9" fill="#64748b">1k</text>
  <line x1="233.529" y1="469.47" x2="233.529" y2="473.47" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <text x="233.529" y="484.47" text-anchor="middle" font-size="9" fill="#64748b">3k</text>
  <line x1="338.036" y1="469.47" x2="338.036" y2="473.47" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <text x="338.036" y="484.47" text-anchor="middle" font-size="9" fill="#64748b">10k</text>
  <line x1="433.398" y1="469.47" x2="433.398" y2="473.47" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <text x="433.398" y="484.47" text-anchor="middle" font-size="9" fill="#64748b">30k</text>
  <text x="258.5" y="497.47" text-anchor="middle" font-size="9.4" fill="#64748b">forced output tokens (log scale)</text>
  <text x="36" y="275.47" font-size="9.4" fill="#64748b">zlib ratio (higher = denser)</text>
  <rect x="100.774" y="300.27" width="86.0679" height="37.6" rx="3" fill="#6ee7b7" stroke="#059669" stroke-width="1.2"/>
  <text x="100.774" y="293.27" font-size="9.8" fill="#047857" font-weight="700">GPT-6 Astra</text>
  <rect x="207.157" y="394.27" width="49.6999" height="12.5333" rx="3" fill="#93c5fd" stroke="#2563eb" stroke-width="1.2"/>
  <text x="207.157" y="387.27" font-size="9.8" fill="#1d4ed8" font-weight="700">GPT-5.6 Sol</text>
  <rect x="250.003" y="406.803" width="130.352" height="25.0667" rx="3" fill="#fcd34d" stroke="#d97706" stroke-width="1.2"/>
  <text x="380.355" y="399.803" text-anchor="end" font-size="9.8" fill="#b45309" font-weight="700">Claude Opus 4.8</text>
  <rect x="343.949" y="444.403" width="82.9966" height="12.5333" rx="3" fill="#fca5a5" stroke="#dc2626" stroke-width="1.2"/>
  <text x="337.949" y="454.17" text-anchor="end" font-size="9.8" fill="#b91c1c" font-weight="700">Claude Sonnet 5</text>
  <text x="38" y="517.47" font-size="9.6" fill="#475569">Each box spans the three benchmarks. The shortest traces are also the least compressible:</text>
  <text x="38" y="530.87" font-size="9.6" fill="#475569">Astra writes few tokens, and each carries more information.</text>
  <rect x="479" y="235.47" width="439" height="312.8" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="495" y="256.47" font-size="12" fill="#6d28d9" font-weight="700">TRANSPLANT: ASTRA'S TRACE IN ANOTHER MODEL (MATH)</text>
  <text x="495" y="287.47" font-size="9.8" fill="#047857" font-weight="700">Astra donor baseline</text>
  <rect x="495" y="293.47" width="367" height="10" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.6"/>
  <rect x="495" y="293.47" width="291.153" height="10" rx="3" fill="#059669"/>
  <text x="868" y="302.47" font-size="9.6" fill="#0f172a" font-weight="700">93.8%</text>
  <text x="495" y="323.47" font-size="9.8" fill="#1d4ed8" font-weight="700">strong: Kimi-K3, GLM-5.2, GPT-5.6 Luna</text>
  <rect x="495" y="329.47" width="367" height="10" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.6"/>
  <rect x="495" y="329.47" width="244.667" height="10" rx="3" fill="#93c5fd"/>
  <rect x="739.667" y="329.47" width="61.1667" height="10" rx="0" fill="#2563eb"/>
  <text x="868" y="338.47" font-size="9.6" fill="#0f172a" font-weight="700">~90-95%</text>
  <text x="495" y="359.47" font-size="9.8" fill="#b45309" font-weight="700">weak: GPT-5.4 Nano</text>
  <rect x="495" y="365.47" width="367" height="10" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.6"/>
  <rect x="495" y="365.47" width="122.333" height="10" rx="3" fill="#d97706"/>
  <text x="868" y="374.47" font-size="9.6" fill="#0f172a" font-weight="700">80.0%</text>
  <text x="495" y="395.47" font-size="9.8" fill="#b91c1c" font-weight="700">weak: Claude Haiku 4.5</text>
  <rect x="495" y="401.47" width="367" height="10" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.6"/>
  <rect x="495" y="401.47" width="79.5167" height="10" rx="3" fill="#dc2626"/>
  <text x="868" y="410.47" font-size="9.6" fill="#0f172a" font-weight="700">76.5%</text>
  <text x="495" y="435.47" font-size="9" fill="#64748b">70%</text>
  <text x="862" y="435.47" text-anchor="end" font-size="9" fill="#64748b">100%</text>
  <text x="495" y="457.47" font-size="9.6" fill="#475569">In 83.33% of Haiku 4.5's errors, the Astra trace already stated the correct answer. Small</text>
  <text x="495" y="470.87" font-size="9.6" fill="#475569">recipients cannot rebuild the steps a dense trace skips.</text>
  <rect x="22" y="564.27" width="168" height="50" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="106" y="590.27" text-anchor="middle" font-size="14.5" fill="#1d4ed8" font-weight="700">30.5 -&gt; 73.3%</text>
  <text x="106" y="605.27" text-anchor="middle" font-size="8.8" fill="#64748b">DSV4-Flash MATH, none -&gt; forced</text>
  <rect x="204" y="564.27" width="168" height="50" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="288" y="590.27" text-anchor="middle" font-size="14.5" fill="#047857" font-weight="700">5.0 vs 28.5</text>
  <text x="288" y="605.27" text-anchor="middle" font-size="8.8" fill="#64748b">median tree width, Astra vs Sonnet 5</text>
  <rect x="386" y="564.27" width="168" height="50" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="470" y="590.27" text-anchor="middle" font-size="14.5" fill="#047857" font-weight="700">27 vs 136</text>
  <text x="470" y="605.27" text-anchor="middle" font-size="8.8" fill="#64748b">median tree nodes, same pair</text>
  <rect x="568" y="564.27" width="168" height="50" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="652" y="590.27" text-anchor="middle" font-size="14.5" fill="#6d28d9" font-weight="700">83.33%</text>
  <text x="652" y="605.27" text-anchor="middle" font-size="8.8" fill="#64748b">Haiku errors with answer in trace</text>
  <rect x="750" y="564.27" width="168" height="50" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="834" y="590.27" text-anchor="middle" font-size="14.5" fill="#b91c1c" font-weight="700">0%</text>
  <text x="834" y="605.27" text-anchor="middle" font-size="8.8" fill="#64748b">extraction: Opus 5, Fable 5, 5.1</text>
