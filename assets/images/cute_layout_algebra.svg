<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 332" width="940" height="332" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 6 5.2" refX="5.6" refY="2.6" markerWidth="6" markerHeight="5.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 z" fill="#64748b"/></marker></defs><rect width="940" height="332" fill="#ffffff"/><text x="20.0" y="32.0" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Compose a tensor layout with the hardware mapping</text><text x="20.0" y="54.0" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">The instruction assigns values to threads; the tensor layout maps those coordinates to storage</text><rect x="20.0" y="82.0" width="436.0" height="78.6" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="32.0" y="105.9" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="start">Data tensor layout L</text><text x="32.0" y="128.1" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Maps logical tensor coordinates to storage offsets through its shape and</text><text x="32.0" y="144.3" font-size="12" font-weight="400" fill="#334155" text-anchor="start">strides.</text><rect x="484.0" y="82.0" width="436.0" height="78.6" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/><text x="496.0" y="105.9" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="start">Instruction layout T</text><text x="496.0" y="128.1" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Maps a thread and value index to the coordinate expected by the</text><text x="496.0" y="144.3" font-size="12" font-weight="400" fill="#334155" text-anchor="start">instruction.</text><rect x="20.0" y="212.6" width="900.0" height="66.4" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="34.0" y="238.5" font-size="14" font-weight="700" fill="#14532d" text-anchor="start">Compose the mappings</text><text x="34.0" y="260.7" font-size="12" font-weight="400" fill="#334155" text-anchor="start">R = L(T(thread, value)): the instruction's thread and value indices map to storage offsets. Fixing a thread index exposes that thread's values.</text><line x1="238.0" y1="163.6" x2="326.0" y2="208.6" stroke="#2563eb" stroke-width="1.2" marker-end="url(#ah)"/><line x1="702.0" y1="163.6" x2="614.0" y2="208.6" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#ah)"/><text x="20.0" y="303.0" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Composition connects a hardware-prescribed thread-value pattern to the program's actual data layout.</text></svg>